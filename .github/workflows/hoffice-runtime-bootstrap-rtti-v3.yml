name: Bootstrap HOffice stripped-Qt RTTI probe v3

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
    paths:
      - '.bootstrap/hrt-rtti-v3.tar.gz.b64.part*'
      - '.github/workflows/hoffice-runtime-bootstrap-rtti-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hrt-bootstrap-rtti-v3-${{ github.ref }}
  cancel-in-progress: true

env:
  BRANCH: codex/hoffice-runtime-from-scratch
  ARCHIVE_SHA256: da302bdb94542231b80b7cb2f99b0374a05a5581755ad111e6e4e76c9c0ac16e

jobs:
  assemble-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify the staged source archive
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/bootstrap build/unpacked
          mapfile -t parts < <(find .bootstrap -maxdepth 1 -type f \
            -name 'hrt-rtti-v3.tar.gz.b64.part*' | LC_ALL=C sort)
          test "${#parts[@]}" -eq 4
          cat "${parts[@]}" > build/bootstrap/payload.tar.gz.b64
          base64 --decode build/bootstrap/payload.tar.gz.b64 \
            > build/bootstrap/payload.tar.gz
          printf '%s  %s\n' "$ARCHIVE_SHA256" \
            build/bootstrap/payload.tar.gz | sha256sum --check -
          tar -xzf build/bootstrap/payload.tar.gz -C build/unpacked
          find build/unpacked -maxdepth 1 -type f -print | LC_ALL=C sort

      - name: Install the exact reviewed payload
        shell: bash
        run: |
          set -euxo pipefail
          printf '%s  %s\n' \
            f65d6bd8c68b10953b67dac7e5c9deadfe5e935e856fdad71943dc86f3f02e21 \
            build/unpacked/patch_elf_int3_qt_vtable.py \
            3014850fc648dea6b71c60c7edc552c9fb70bf4e728b7b9790de682e50da790a \
            build/unpacked/hoffice-runtime-guest-rtti-probe-v3.yml \
            df825951b79e9f2b4e3adb98c22c80fcc61aed72865439718abd2bbb3520a52f \
            build/unpacked/hoffice-runtime-m5-m6-qoffscreen-rtti-matrix-v3.yml \
            9a766d97b1a96388110d394013f128d5b4c9bb6cb9ab2474cd10f49d6471c7c3 \
            build/unpacked/hoffice-runtime-qoffscreen-rtti-resolver-v3.yml \
            | sha256sum --check -

          install -m 0755 build/unpacked/patch_elf_int3_qt_vtable.py \
            runtime/m3/patch_elf_int3_qt_vtable.py
          install -m 0644 build/unpacked/hoffice-runtime-guest-rtti-probe-v3.yml \
            .github/workflows/hoffice-runtime-guest-rtti-probe-v3.yml
          install -m 0644 build/unpacked/hoffice-runtime-m5-m6-qoffscreen-rtti-matrix-v3.yml \
            .github/workflows/hoffice-runtime-m5-m6-qoffscreen-rtti-matrix-v3.yml
          install -m 0644 build/unpacked/hoffice-runtime-qoffscreen-rtti-resolver-v3.yml \
            .github/workflows/hoffice-runtime-qoffscreen-rtti-resolver-v3.yml

          python3 -m py_compile runtime/m3/patch_elf_int3_qt_vtable.py
          git diff --check
          git status --short

      - name: Commit the stripped-Qt RTTI probe chain
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            runtime/m3/patch_elf_int3_qt_vtable.py \
            .github/workflows/hoffice-runtime-guest-rtti-probe-v3.yml \
            .github/workflows/hoffice-runtime-m5-m6-qoffscreen-rtti-matrix-v3.yml \
            .github/workflows/hoffice-runtime-qoffscreen-rtti-resolver-v3.yml
          if git diff --cached --quiet; then
            echo 'The exact payload is already present.'
            exit 0
          fi
          git commit -m 'runtime: add stripped Qt RTTI vtable probe chain'
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hrt-rtti-v3-bootstrap-evidence
          path: |
            build/bootstrap
            build/unpacked
          if-no-files-found: warn
          retention-days: 7
