name: HOffice runtime M0

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-guest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build deterministic static Linux x86-64 test ELF
        run: |
          set -euxo pipefail
          mkdir -p build/guest
          clang -c -nostdlib -fno-asynchronous-unwind-tables runtime/m0/test_guest.S -o build/guest/test_guest.o
          ld -nostdlib -static --build-id=none -z max-page-size=4096 -Ttext=0x400000 \
            build/guest/test_guest.o -o build/guest/linux-hello
          file build/guest/linux-hello
          readelf -hW build/guest/linux-hello
          readelf -lW build/guest/linux-hello
          readelf -hW build/guest/linux-hello | grep -q 'Type:.*EXEC'
          readelf -hW build/guest/linux-hello | grep -q 'Machine:.*X86-64'
      - uses: actions/upload-artifact@v4
        with:
          name: hrt-m0-linux-guest
          path: build/guest/linux-hello
          if-no-files-found: error
          retention-days: 2

  execute-on-apple-silicon:
    needs: build-linux-guest
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hrt-m0-linux-guest
          path: build/guest
      - name: Ensure Rosetta is available
        run: |
          set -euxo pipefail
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          /usr/bin/arch -x86_64 /usr/bin/true
      - name: Compile the clean-room x86-64 Mach-O host
        run: |
          set -euxo pipefail
          mkdir -p build/host
          clang -arch x86_64 -std=c17 -O2 -g -Wall -Wextra -Werror -Wpedantic \
            runtime/m0/main.c runtime/m0/common.c runtime/m0/elf_map.c \
            runtime/m0/stack.c runtime/m0/syscall_bridge.c runtime/m0/enter_guest.S \
            -o build/host/hrt-m0
          file build/host/hrt-m0
          lipo -info build/host/hrt-m0
          codesign --force --sign - --timestamp=none build/host/hrt-m0
          codesign --verify --strict build/host/hrt-m0
      - name: Execute raw Linux ELF and verify syscall translation
        run: |
          set -uxo pipefail
          chmod +x build/guest/linux-hello
          set +e
          /usr/bin/arch -x86_64 build/host/hrt-m0 build/guest/linux-hello \
            >build/stdout.txt 2>build/stderr.txt
          status=$?
          set -e
          printf '%s\n' "$status" > build/exit-status.txt
          echo '--- stderr ---'
          cat build/stderr.txt
          echo '--- stdout ---'
          cat build/stdout.txt
          echo "--- exit status: $status ---"
          test "$status" -eq 0
          grep -Fx 'HRT M0: Linux ELF executed through the macOS syscall bridge' build/stdout.txt
          grep -E 'mapped ELF .*patched=[1-9][0-9]*' build/stderr.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hrt-m0-macos-proof
          path: |
            build/host/hrt-m0
            build/guest/linux-hello
            build/stdout.txt
            build/stderr.txt
            build/exit-status.txt
          if-no-files-found: error
          retention-days: 2
