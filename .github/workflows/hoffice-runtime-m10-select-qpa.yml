name: Select QWidget-aware QPA for M10 replay

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
    paths:
      - '.github/workflows/hoffice-runtime-m10-select-qpa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hrt-m10-select-qpa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-qpa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin the verified default-enabled QWidget QPA
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('.github/workflows/hoffice-runtime-m10-recursive-replay.yml')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r"^  QPA_RUN_ID: '[0-9]+'$", re.MULTILINE)
          matches = pattern.findall(text)
          assert len(matches) == 1, matches
          text = pattern.sub("  QPA_RUN_ID: '31228334501'", text, count=1)
          assert text.count("  QPA_RUN_ID: '31228334501'") == 1
          path.write_text(text, encoding='utf-8')
          PY
          grep -F "QPA_RUN_ID: '31228334501'" \
            .github/workflows/hoffice-runtime-m10-recursive-replay.yml

      - name: Commit and trigger the exact-HWord QWidget replay
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/hoffice-runtime-m10-recursive-replay.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'ci: replay M10 with default-enabled QWidget QPA'
          for _ in $(seq 1 12); do
            if git push origin HEAD:codex/hoffice-runtime-from-scratch; then
              exit 0
            fi
            git fetch origin codex/hoffice-runtime-from-scratch
            git rebase origin/codex/hoffice-runtime-from-scratch
          done
          exit 1
