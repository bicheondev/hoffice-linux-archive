name: HOffice runtime M6 HWord offscreen window constructor

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
    paths:
      - 'proofs/m6-hword-offscreen-create-platform-window.json'
      - '.github/workflows/hoffice-runtime-m6-hword-window-constructor.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: hrt-m6-window-constructor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    uses: ./.github/workflows/hoffice-runtime-guest-symbol-probe.yml
    with:
      predecessor_proof: proofs/m6-hword-offscreen-create-platform-window.json
      symbol_regex: QOffscreenWindowC1E
      label: Qt offscreen window constructor
      milestone: M6-offscreen-window-constructor
      diagnostic_path: diagnostics/m6-hword-window-constructor-latest.json
      proof_path: proofs/m6-hword-offscreen-window-constructor.json
      trace_limit: 72000
      run_seconds: 40
      require_pipe2: true
