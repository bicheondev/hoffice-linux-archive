name: HOffice runtime M7 custom QPA host-call inventory

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
    paths:
      - '.github/workflows/hoffice-runtime-m7-hostcall-inventory.yml'
      - 'runtime/m4/**'
      - 'runtime/m5/**'
      - 'runtime/m6/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hrt-m7-hostcall-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inventory custom QPA and host-call sources
        run: |
          set -euxo pipefail
          mkdir -p diagnostics build/hostcall
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import re

          roots=[pathlib.Path(name) for name in (
              'runtime/m4','runtime/m5','runtime/m6','tests','.github/workflows')
              if pathlib.Path(name).exists()]
          suffixes={'.c','.cc','.cpp','.cxx','.h','.hpp','.m','.mm','.S',
                    '.py','.sh','.yml','.yaml','.json','.md'}
          patterns={
              'opcode_256':re.compile(r'(?<![0-9])256(?![0-9])|0x100\b'),
              'create_operation':re.compile(
                  r'\bCREATE\b|createPlatformWindow|QPlatformWindow'),
              'host_call':re.compile(
                  r'host[_ -]?call|hostcall|transport|dispatch',re.I),
              'custom_qpa':re.compile(
                  r'QPA|QPlatformIntegration|QPlatformWindow|platforms/',re.I),
              'appkit':re.compile(r'NSWindow|NSView|AppKit|CALayer|CGContext'),
              'rendering':re.compile(
                  r'backing.?store|paintDevice|flush|raster|surface|framebuffer',
                  re.I),
              'input_ime':re.compile(
                  r'inputMethod|IME|keyEvent|mouseEvent|NSTextInput',re.I),
          }
          files=[]
          matches={key:[] for key in patterns}
          for root in roots:
              for path in sorted(root.rglob('*')):
                  if not path.is_file() or path.suffix not in suffixes:
                      continue
                  try:
                      text=path.read_text(errors='replace')
                  except Exception:
                      continue
                  digest=hashlib.sha256(path.read_bytes()).hexdigest()
                  file_record={
                      'path':str(path),
                      'sha256':digest,
                      'size':path.stat().st_size,
                  }
                  matched_groups=[]
                  for lineno,line in enumerate(text.splitlines(),1):
                      for group,pattern in patterns.items():
                          if pattern.search(line):
                              matches[group].append({
                                  'path':str(path),
                                  'line':lineno,
                                  'text':line.strip()[:500],
                              })
                              matched_groups.append(group)
                  if matched_groups:
                      file_record['groups']=sorted(set(matched_groups))
                      files.append(file_record)

          inventory={
              'schema':1,
              'commit':'${{ github.sha }}',
              'workflow_run':'${{ github.run_id }}',
              'file_count':len(files),
              'match_counts':{key:len(value)
                              for key,value in matches.items()},
              'files':files,
              'matches':matches,
          }
          pathlib.Path('diagnostics/hostcall-qpa-inventory.json').write_text(
              json.dumps(inventory,indent=2)+'\n')
          lines=[
              '# Custom QPA and host-call inventory','',
              f"- Commit: `${{ github.sha }}`",
              f"- Matching files: `{len(files)}`",'',
          ]
          for group,count in inventory['match_counts'].items():
              lines.append(f'- `{group}`: `{count}` matches')
          for group,items in matches.items():
              lines.extend(['',f'## {group}',''])
              for item in items[:300]:
                  lines.append(
                      f"- `{item['path']}:{item['line']}` — "
                      f"`{item['text'].replace('`','\\`')}`")
              if len(items)>300:
                  lines.append(f'- … {len(items)-300} more matches in JSON')
          pathlib.Path('diagnostics/hostcall-qpa-inventory.md').write_text(
              '\n'.join(lines)+'\n')
          print(json.dumps(inventory['match_counts'],indent=2))
          assert inventory['match_counts']['opcode_256']>0
          assert inventory['match_counts']['custom_qpa']>0
          assert inventory['match_counts']['host_call']>0
          PY

      - name: Commit the host-call protocol map
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/hostcall-qpa-inventory.json \
                  diagnostics/hostcall-qpa-inventory.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'diagnostic: lock custom QPA host-call protocol map [skip ci]'
          git pull --rebase origin codex/hoffice-runtime-from-scratch
          git push origin HEAD:codex/hoffice-runtime-from-scratch

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hrt-m7-hostcall-qpa-inventory
          path: |
            diagnostics/hostcall-qpa-inventory.json
            diagnostics/hostcall-qpa-inventory.md
          if-no-files-found: warn
          retention-days: 30
