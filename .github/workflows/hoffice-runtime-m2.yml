name: HOffice runtime M2

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
    paths:
      - runtime/m2/**
      - .github/workflows/hoffice-runtime-m2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build PT_INTERP image with Linux FS TLS accesses
        run: |
          set -euxo pipefail
          mkdir -p build/m2/rootfs/bin build/m2/rootfs/lib64 build/m2/objects
          clang -c -nostdlib -fPIC -fno-asynchronous-unwind-tables \
            runtime/m2/test_interp.S -o build/m2/objects/test_interp.o
          clang -c -nostdlib -fPIC -fno-asynchronous-unwind-tables \
            runtime/m2/test_main.S -o build/m2/objects/test_main.o
          ld -shared -nostdlib --build-id=none -z max-page-size=4096 \
            -e _start build/m2/objects/test_interp.o \
            -o build/m2/rootfs/lib64/hrt-m2-interp.so
          ld -pie -nostdlib --build-id=none -z max-page-size=4096 \
            --dynamic-linker /lib64/hrt-m2-interp.so -e _start \
            build/m2/objects/test_main.o \
            -o build/m2/rootfs/bin/hrt-m2-main

          file build/m2/rootfs/lib64/hrt-m2-interp.so \
               build/m2/rootfs/bin/hrt-m2-main
          readelf -hW build/m2/rootfs/bin/hrt-m2-main
          readelf -lW build/m2/rootfs/bin/hrt-m2-main
          readelf -rW build/m2/rootfs/bin/hrt-m2-main
          objdump -d build/m2/rootfs/bin/hrt-m2-main | tee build/m2/disassembly.txt
          readelf -lW build/m2/rootfs/bin/hrt-m2-main | \
            grep -q 'Requesting program interpreter: /lib64/hrt-m2-interp.so'
          readelf -rW build/m2/rootfs/bin/hrt-m2-main | \
            grep -q 'R_X86_64_RELATIVE'
          grep -q '%fs:' build/m2/disassembly.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hrt-m2-linux-images
          path: |
            build/m2/rootfs
            build/m2/disassembly.txt
          if-no-files-found: error
          retention-days: 2

  execute-on-apple-silicon:
    needs: build-linux-images
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hrt-m2-linux-images
          path: build/m2
      - name: Ensure Rosetta is available
        run: |
          set -euxo pipefail
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          /usr/bin/arch -x86_64 /usr/bin/true
      - name: Compile clean-room M2 Mach-O host
        run: |
          set -euxo pipefail
          mkdir -p build/m2/host
          clang -arch x86_64 -std=c17 -O2 -g \
            -fno-stack-protector -fno-omit-frame-pointer \
            -Wall -Wextra -Werror -Wpedantic \
            runtime/m2/main.c runtime/m1/common.c runtime/m1/elf_map.c \
            runtime/m1/stack.c runtime/m2/tls_patch.c \
            runtime/m2/syscall_bridge.c runtime/m1/enter_guest.S \
            -Wl,-pagezero_size,0x1000 -o build/m2/host/hrt-m2
          file build/m2/host/hrt-m2
          lipo -info build/m2/host/hrt-m2
          codesign --force --sign - --timestamp=none build/m2/host/hrt-m2
          codesign --verify --strict build/m2/host/hrt-m2
      - name: Translate arch_prctl and rewritten FS TLS
        run: |
          set -uxo pipefail
          set +e
          /usr/bin/arch -x86_64 build/m2/host/hrt-m2 \
            --root "$PWD/build/m2/rootfs" \
            --program /bin/hrt-m2-main \
            >build/m2/stdout.txt 2>build/m2/stderr.txt
          status=$?
          set -e
          printf '%s\n' "$status" > build/m2/exit-status.txt
          echo '--- stderr ---'
          cat build/m2/stderr.txt
          echo '--- stdout ---'
          cat build/m2/stdout.txt
          echo "--- exit status: $status ---"
          test "$status" -eq 0
          grep -Fx 'HRT M2: PT_INTERP entered before guest TLS' \
            build/m2/stdout.txt
          grep -Fx \
            'HRT M2: arch_prctl SET/GET and rewritten FS TLS passed' \
            build/m2/stdout.txt
          grep -E 'program .*fs-prefixes=2 .*interp=/lib64/hrt-m2-interp.so' \
            build/m2/stderr.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hrt-m2-macos-proof
          path: |
            build/m2/host/hrt-m2
            build/m2/rootfs
            build/m2/disassembly.txt
            build/m2/stdout.txt
            build/m2/stderr.txt
            build/m2/exit-status.txt
          if-no-files-found: error
          retention-days: 2
