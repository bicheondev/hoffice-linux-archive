name: HOffice runtime M9 exact Korean locale

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
    paths:
      - 'runtime/m9/augment_stack_locale.py'
      - '.github/workflows/hoffice-runtime-m9-hword-korean-locale.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: hrt-m9-hword-korean-locale-${{ github.ref }}
  cancel-in-progress: true

env:
  ROOTFS_ARTIFACT_ID: '8968324706'
  ROOTFS_ARTIFACT_SHA256: 3e301d3c6269926c62804bff18671136fcf8c0b0b22b3952072e427a8fa9918a
  ROOTFS_ARCHIVE_SHA256: 322fcf228092b296a34edbfa7ee43f9a7b237d5bcedaee50109ac4bb44d9ca28
  QPA_RUN_ID: '31166152504'
  ASSET_NAME: hoffice_11.20.0.1520+h1_amd64.deb
  RELEASE_TAG: linux-11.20-series
  PACKAGE_SHA256: 23fc502c430b4dd829fee36740fbce06b819cd51d36fcdf0afbb6fcc5d0b7c46
  PROGRAM: /opt/hnc/hoffice11/Bin/hword
  PROGRAM_SHA256: 55876ea7d0c20e73d936af11cc3623c418acb09d61bde5bfeecafa1da7a9b5cb
  PLUGIN_GUEST: /opt/hnc/hoffice11/Bin/qt/plugins/platforms/libqhrtappkit.so

jobs:
  prepare-korean-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install exact locale and archive tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends locales zstd binutils file ca-certificates
          sudo localedef -i ko_KR -f UTF-8 ko_KR.UTF-8
          sudo localedef -i en_US -f UTF-8 en_US.UTF-8
          locale -a | tee build-locale-list.txt
          grep -Eiq '^ko_KR\.utf8$' build-locale-list.txt
          test -s /usr/lib/locale/locale-archive

      - name: Download and verify exact HWord inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p build/input/hword build/input/deb build/rootfs build/report
          curl --fail --location --retry 5 --retry-delay 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ROOTFS_ARTIFACT_ID/zip" \
            -o build/input/hword-artifact.zip
          printf '%s  %s\n' "$ROOTFS_ARTIFACT_SHA256" \
            build/input/hword-artifact.zip | sha256sum --check -
          unzip -q build/input/hword-artifact.zip -d build/input/hword
          printf '%s  %s\n' "$ROOTFS_ARCHIVE_SHA256" \
            build/input/hword/hword-rootfs.tar.gz | sha256sum --check -
          tar -xzf build/input/hword/hword-rootfs.tar.gz -C build/rootfs
          test -s build/rootfs/.hrt-prepatched-v1
          test -f "build/rootfs$PROGRAM"

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_NAME" \
            --dir build/input/deb
          printf '%s  %s\n' "$PACKAGE_SHA256" \
            "build/input/deb/$ASSET_NAME" | sha256sum --check -

      - name: Restore all exact HOffice fonts and Korean locale data
        run: |
          set -euxo pipefail
          deb="build/input/deb/$ASSET_NAME"
          data_member=$(ar t "$deb" | awk '/^data\.tar/{print; exit}')
          test -n "$data_member"
          ar p "$deb" "$data_member" >"build/input/deb/$data_member"
          tar -xf "build/input/deb/$data_member" -C build/rootfs \
            ./opt/hnc/hoffice11/Shared/Fonts \
            ./opt/hnc/hoffice11/Shared/TTF

          rm -f build/rootfs/opt/hnc/hoffice1
          ln -s hoffice11 build/rootfs/opt/hnc/hoffice1
          test "$(readlink build/rootfs/opt/hnc/hoffice1)" = hoffice11
          test -f build/rootfs/opt/hnc/hoffice1/Shared/Fonts/HGSMJ.HFT
          test -f build/rootfs/opt/hnc/hoffice11/Shared/TTF/Install/HanSantteutDotum-Regular.ttf

          install -D -m 0644 /usr/lib/locale/locale-archive \
            build/rootfs/usr/lib/locale/locale-archive
          if test -f /usr/share/locale/locale.alias; then
            install -D -m 0644 /usr/share/locale/locale.alias \
              build/rootfs/usr/share/locale/locale.alias
          fi
          mkdir -p build/rootfs/home/hrt/.config \
                   build/rootfs/home/hrt/.local/share
          chmod 0700 build/rootfs/home/hrt

          {
            sha256sum build/rootfs/usr/lib/locale/locale-archive
            find build/rootfs/opt/hnc/hoffice11/Shared/Fonts -type f | wc -l
            find build/rootfs/opt/hnc/hoffice11/Shared/TTF -type f | wc -l
          } | tee build/report/payload-lock.txt
          test "$(find build/rootfs/opt/hnc/hoffice11/Shared/Fonts -type f | wc -l)" -ge 400
          test "$(find build/rootfs/opt/hnc/hoffice11/Shared/TTF -type f | wc -l)" -ge 130

      - name: Build a deterministic enriched rootfs transfer object
        run: |
          set -euxo pipefail
          tar --sort=name --mtime='UTC 2026-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -C build/rootfs -cf - . \
            | zstd -T0 -12 -o build/hword-ko-rootfs.tar.zst
          sha256sum build/hword-ko-rootfs.tar.zst \
            >build/report/hword-ko-rootfs.tar.zst.sha256
          ls -lh build/hword-ko-rootfs.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: hrt-m9-hword-korean-rootfs
          path: |
            build/hword-ko-rootfs.tar.zst
            build/report
            build-locale-list.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  run-on-apple-silicon:
    needs: prepare-korean-guest
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: hrt-m9-hword-korean-rootfs
          path: build/input/rootfs
      - uses: actions/download-artifact@v4
        with:
          name: hrt-m8-qt5113-hrtappkit-input-qpa
          path: build/input/qpa
          repository: ${{ github.repository }}
          run-id: ${{ env.QPA_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Reconstruct the case-sensitive enriched HWord guest
        run: |
          set -euxo pipefail
          mkdir -p build/generated build/objects build/host build/proof
          expected=$(awk '{print $1; exit}' \
            build/input/rootfs/report/hword-ko-rootfs.tar.zst.sha256)
          actual=$(shasum -a 256 build/input/rootfs/hword-ko-rootfs.tar.zst \
            | awk '{print $1}')
          test "$actual" = "$expected"

          image="$RUNNER_TEMP/hrt-m9-ko.sparsebundle"
          root="/tmp/h9ko-$GITHUB_RUN_ID"
          rm -rf "$image" "$root"; mkdir -p "$root"
          if ! hdiutil create -quiet -size 12g -fs APFSX \
               -volname HRTM9KO -type SPARSEBUNDLE "$image"; then
            rm -rf "$image"
            hdiutil create -quiet -size 12g -fs HFSX \
              -volname HRTM9KO -type SPARSEBUNDLE "$image"
          fi
          hdiutil attach -quiet -nobrowse -mountpoint "$root" "$image"
          echo "HRT_ROOT=$root" >>"$GITHUB_ENV"
          echo "HRT_IMAGE=$image" >>"$GITHUB_ENV"
          zstd -dc build/input/rootfs/hword-ko-rootfs.tar.zst \
            | tar -xf - -C "$root"
          test -s "$root/.hrt-prepatched-v1"
          test -f "$root$PROGRAM"
          test -s "$root/usr/lib/locale/locale-archive"
          test -f "$root/opt/hnc/hoffice1/Shared/Fonts/HGSMJ.HFT"

          mkdir -p "$root$(dirname "$PLUGIN_GUEST")"
          python3 - build/input/qpa/libqhrtappkit.so.xz \
            build/input/qpa/lock.json "$root$PLUGIN_GUEST" <<'PY'
          import hashlib,json,lzma,pathlib,sys
          compressed=pathlib.Path(sys.argv[1]).read_bytes()
          lock=json.loads(pathlib.Path(sys.argv[2]).read_text())
          assert lock['toolchain']['qt_version']=='5.11.3'
          assert hashlib.sha256(compressed).hexdigest()==lock['plugin']['xz_sha256']
          plugin=lzma.decompress(compressed)
          assert hashlib.sha256(plugin).hexdigest()==lock['plugin']['sha256_after_prepatch']
          pathlib.Path(sys.argv[3]).write_bytes(plugin)
          pathlib.Path('build/proof/qpa-lock.json').write_text(
              json.dumps(lock,indent=2)+'\n')
          PY
          chmod 0755 "$root$PLUGIN_GUEST"
          diskutil info "$root" | tee build/proof/guest-volume.txt
          grep -F 'Case-sensitive' build/proof/guest-volume.txt

      - name: Generate the mature bridge and Korean initial environment
        run: |
          set -euxo pipefail
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          /usr/bin/arch -x86_64 /usr/bin/getconf PAGESIZE \
            | tee build/proof/x86-page-size.txt
          sw_vers | tee build/proof/sw-vers.txt

          python3 runtime/m8/augment_appkit_adapter_input.py \
            runtime/m6/appkit_adapter.m build/generated/appkit_adapter_m8.m
          python3 runtime/m6/augment_stack_hrtappkit.py \
            runtime/m3/stack.c build/generated/stack-m6.c
          python3 runtime/m9/augment_stack_locale.py \
            build/generated/stack-m6.c build/generated/stack.c
          grep -F 'LANG=ko_KR.UTF-8' build/generated/stack.c
          grep -F 'LC_ALL=ko_KR.UTF-8' build/generated/stack.c
          grep -F 'HOME=/home/hrt' build/generated/stack.c

          python3 runtime/m3/augment_syscalls.py \
            runtime/m3/syscall_bridge.c build/generated/stage1.c
          python3 runtime/m3/augment_directory_syscalls.py \
            build/generated/stage1.c build/generated/stage2.c
          python3 runtime/m3/augment_directory_stream.py \
            build/generated/stage2.c build/generated/stage3.c
          python3 runtime/m3/augment_pipe2.py \
            build/generated/stage3.c build/generated/stage4.c
          python3 runtime/m3/augment_eventfd2.py \
            build/generated/stage4.c build/generated/stage5.c
          python3 runtime/m3/augment_crash_signals.py \
            build/generated/stage5.c build/generated/stage6.c
          python3 runtime/m3/augment_poll.py \
            build/generated/stage6.c build/generated/stage7.c
          python3 runtime/m3/augment_posix_basics.py \
            build/generated/stage7.c build/generated/stage8.c
          python3 runtime/m3/augment_connect.py \
            build/generated/stage8.c build/generated/stage9.c
          python3 runtime/m6/augment_appkit_hostcall_deferred.py \
            build/generated/stage9.c build/generated/stage10.c
          python3 runtime/m3/augment_darwin_syscall_abi.py \
            build/generated/stage10.c build/generated/syscall_bridge.c
          python3 - <<'PY'
          from pathlib import Path
          path=Path('build/generated/syscall_bridge.c')
          path.write_text(path.read_text().replace(
              '#define M3_TRACE_LIMIT 256u','#define M3_TRACE_LIMIT 30000u'))
          PY

      - name: Compile and sign the locale-complete HWord runtime
        run: |
          set -euxo pipefail
          common=(-arch x86_64 -std=c17 -O2 -g -fno-stack-protector \
            -fno-omit-frame-pointer -Wall -Wextra -Werror -Wpedantic \
            -Wno-unused-function -Wno-unused-variable \
            -Iruntime/m8 -Iruntime/m6 -Iruntime/m3 -Iruntime/m1)
          index=0
          for source in runtime/m6/main.c runtime/m6/hostcall_trampoline.c \
            runtime/m1/common.c runtime/m3/elf_map.c build/generated/stack.c \
            runtime/m3/patch.c build/generated/syscall_bridge.c; do
            clang "${common[@]}" -c "$source" \
              -o "build/objects/c-${index}.o"
            index=$((index+1))
          done
          clang -arch x86_64 -std=c17 -O2 -g -fobjc-arc \
            -Wall -Wextra -Werror -Wpedantic -Iruntime/m8 -Iruntime/m6 \
            -c build/generated/appkit_adapter_m8.m \
            -o build/objects/appkit-adapter.o
          clang -arch x86_64 -std=c17 -O2 -g -fobjc-arc \
            -Wall -Wextra -Werror -Wpedantic -Iruntime/m8 -Iruntime/m6 \
            -c runtime/m8/appkit_input.m -o build/objects/appkit-input.o
          clang -arch x86_64 -g -c runtime/m1/enter_guest.S \
            -o build/objects/enter-guest.o
          clang -arch x86_64 -g -c runtime/m6/hostcall_trampoline.S \
            -o build/objects/hostcall-trampoline.o
          clang -arch x86_64 build/objects/*.o -Wl,-pagezero_size,0x1000 \
            -framework AppKit -framework CoreGraphics -framework ImageIO \
            -o build/host/hrt-m9-hword-korean-locale
          file build/host/hrt-m9-hword-korean-locale \
            | tee build/proof/host-file.txt
          codesign --force --sign - --timestamp=none \
            build/host/hrt-m9-hword-korean-locale
          codesign --verify --strict build/host/hrt-m9-hword-korean-locale

      - name: Run exact HWord under the Korean locale
        run: |
          set -uxo pipefail
          export HRT_M6_CAPTURE_PATH="$PWD/build/proof/pre-frame-window.png"
          export HRT_M7_CAPTURE_PATH="$PWD/build/proof/hword-korean-locale-frame.png"
          unset HRT_M8_SYNTHETIC_INPUT
          : >build/proof/stdout.txt; : >build/proof/stderr.txt
          /usr/bin/arch -x86_64 build/host/hrt-m9-hword-korean-locale \
            --root "$HRT_ROOT" --program "$PROGRAM" \
            >build/proof/stdout.txt 2>build/proof/stderr.txt &
          pid=$!
          frame_seen=0
          for _ in $(jot 1200); do
            if grep -q 'HRT M7 QPA: BGRA frame accepted' \
                 build/proof/stderr.txt 2>/dev/null; then
              frame_seen=1
              sleep 5
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 0.05
          done
          alive_after_frame=0
          if [ "$frame_seen" -eq 1 ] && kill -0 "$pid" 2>/dev/null; then
            alive_after_frame=1
          fi
          if kill -0 "$pid" 2>/dev/null; then
            ps -o pid,ppid,state,%cpu,%mem,etime,command -p "$pid" \
              >build/proof/process.txt 2>&1 || true
            /usr/bin/sample "$pid" 1 1 -file build/proof/sample.txt \
              >/dev/null 2>&1 || true
            kill -TERM "$pid" 2>/dev/null || true
            sleep 0.25
            kill -KILL "$pid" 2>/dev/null || true
          fi
          set +e; wait "$pid"; raw_status=$?; set -e
          printf '%s\n' "$raw_status" >build/proof/raw-exit-status.txt
          printf '%s\n' "$frame_seen" >build/proof/frame-seen.txt
          printf '%s\n' "$alive_after_frame" >build/proof/alive-after-frame.txt
          grep -E 'guest current directory=|HRT M6 QPA: CREATE |HRT M7 QPA: BGRA frame accepted|out_of_range|fatal signal|Linux syscall ENOSYS' \
            build/proof/stderr.txt | tail -n 10000 \
            | tee build/proof/key-lines.txt || true
          cat build/proof/key-lines.txt

      - name: Classify the exact Korean-locale boundary
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          stderr=Path('build/proof/stderr.txt').read_text(errors='replace')
          titles=[]; geometries=[]
          for line in re.findall(r'HRT M6 QPA: CREATE .*',stderr):
              title=re.search(r' title=(.*?) handle=',line)
              geometry=re.search(r' geometry=(\d+)x(\d+)',line)
              if title: titles.append(title.group(1))
              if geometry: geometries.append([
                  int(geometry.group(1)),int(geometry.group(2))])
          frame=Path('build/proof/hword-korean-locale-frame.png')
          frame_present=frame.is_file() and frame.stat().st_size>0
          init_error='Initialization Error' in titles
          throw_seen=('__pos (which is' in stderr or
                      'std::out_of_range' in stderr)
          alive=bool(int(Path('build/proof/alive-after-frame.txt').read_text()))
          if not titles:
              classification='NO_NATIVE_QT_WINDOW'
          elif init_error:
              classification='INITIALIZATION_ERROR_REMAINS'
          elif throw_seen:
              classification='SUBSTR_EXCEPTION_REMAINS'
          elif frame_present and alive:
              classification='HWORD_KOREAN_LOCALE_STABLE_FRAME'
          elif frame_present:
              classification='NONERROR_FRAME_PROCESS_EXITED'
          else:
              classification='NONERROR_WINDOW_WITHOUT_FRAME'
          result={
              'schema':1,
              'milestone':'M9-korean-locale',
              'status':'PASS' if classification=='HWORD_KOREAN_LOCALE_STABLE_FRAME' else 'DIAGNOSTIC',
              'classification':classification,
              'workflow_run':os.environ['GITHUB_RUN_ID'],
              'commit':os.environ['GITHUB_SHA'],
              'program':os.environ['PROGRAM'],
              'program_sha256':os.environ['PROGRAM_SHA256'],
              'package_sha256':os.environ['PACKAGE_SHA256'],
              'locale':{
                  'LANG':'ko_KR.UTF-8','LC_ALL':'ko_KR.UTF-8',
                  'LANGUAGE':'ko_KR:ko:en','HOME':'/home/hrt'},
              'window_titles':titles,
              'window_geometries':geometries,
              'initialization_error_observed':init_error,
              'substr_exception_observed':throw_seen,
              'frame_present':frame_present,
              'frame_sha256':hashlib.sha256(frame.read_bytes()).hexdigest()
                  if frame_present else None,
              'alive_after_frame':alive,
              'raw_exit_status':int(Path('build/proof/raw-exit-status.txt').read_text()),
          }
          Path('diagnostics').mkdir(exist_ok=True)
          payload=json.dumps(result,indent=2)+'\n'
          Path(f"diagnostics/m9-hword-korean-locale-{os.environ['GITHUB_RUN_ID']}.json").write_text(payload)
          Path('diagnostics/m9-hword-korean-locale-latest.json').write_text(payload)
          Path('build/proof/summary.json').write_text(payload)
          if result['status']=='PASS':
              Path('proofs').mkdir(exist_ok=True)
              Path('proofs/m9-hword-korean-locale-frame.json').write_text(payload)
          print(payload)
          PY

      - name: Commit the durable locale result
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin codex/hoffice-runtime-from-scratch
          git add diagnostics/m9-hword-korean-locale-*.json
          if test -f proofs/m9-hword-korean-locale-frame.json; then
            git add proofs/m9-hword-korean-locale-frame.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'diagnostic: classify exact HWord under Korean locale'
            git push origin HEAD:codex/hoffice-runtime-from-scratch
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hrt-m9-hword-korean-locale-proof
          path: |
            build/host/hrt-m9-hword-korean-locale
            build/proof
            diagnostics/m9-hword-korean-locale-*.json
            proofs/m9-hword-korean-locale-frame.json
          if-no-files-found: warn
          retention-days: 14

      - name: Detach the exact HWord guest
        if: always()
        run: hdiutil detach -quiet "$HRT_ROOT" || true
