name: HOffice runtime M5 HWord offscreen plugin instance

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
    paths:
      - 'runtime/m3/patch_elf_int3_probe.py'
      - 'runtime/m3/augment_int3_probe.py'
      - 'runtime/m3/augment_directory_stream.py'
      - 'runtime/m3/augment_directory_syscalls.py'
      - 'runtime/m3/augment_pipe2.py'
      - 'runtime/m3/augment_polling.py'
      - 'runtime/m3/augment_epoll.py'
      - 'runtime/m3/augment_tgkill.py'
      - 'runtime/m3/augment_crash_signals.py'
      - '.github/workflows/hoffice-runtime-m5-hword-plugin-instance.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: hrt-m5-hword-plugin-instance-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_RUN_ID: '31102898765'
  PROGRAM: /opt/hnc/hoffice11/Bin/hword
  PROGRAM_SHA256: 55876ea7d0c20e73d936af11cc3623c418acb09d61bde5bfeecafa1da7a9b5cb
  PLUGIN: /opt/hnc/hoffice11/Bin/qt/plugins/platforms/libqoffscreen.so

jobs:
  prove-plugin-instance-entry:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: hrt-m5-hword-offscreen-rootfs
          path: build/input
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Mount and verify the exact case-sensitive HWord root
        run: |
          set -euxo pipefail
          mkdir -p build/generated build/host build/proof diagnostics proofs
          expected=$(awk '{print $1; exit}' build/input/hword-rootfs.tar.gz.sha256)
          actual=$(shasum -a 256 build/input/hword-rootfs.tar.gz | awk '{print $1}')
          test "$actual" = "$expected"
          printf '%s\n' "$actual" > build/proof/rootfs-archive.sha256

          image="$RUNNER_TEMP/hrt-m5-plugin-instance.sparsebundle"
          root="$RUNNER_TEMP/hrt-m5-plugin-instance-root"
          rm -rf "$image" "$root"
          mkdir -p "$root"
          if ! hdiutil create -quiet -size 8g -fs APFSX \
               -volname HRTM5PI -type SPARSEBUNDLE "$image"; then
            rm -rf "$image"
            hdiutil create -quiet -size 8g -fs HFSX \
              -volname HRTM5PI -type SPARSEBUNDLE "$image"
          fi
          hdiutil attach -quiet -nobrowse -mountpoint "$root" "$image"
          echo "HRT_ROOT=$root" >> "$GITHUB_ENV"
          tar -xzf build/input/hword-rootfs.tar.gz -C "$root"
          test -s "$root/.hrt-closure-v1.json"
          test -s "$root/.hrt-prepatched-v1"
          test -f "$root$PROGRAM"
          test -f "$root$PLUGIN"
          test -d "$root/opt/hnc/hoffice11/Bin/Hword"

          python3 - "$root" "$PROGRAM" "$PROGRAM_SHA256" "$PLUGIN" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1]); program = sys.argv[2]
          expected_program = sys.argv[3]; plugin = sys.argv[4]
          marker = json.loads((root / '.hrt-prepatched-v1').read_text())
          records = {item['path']: item for item in marker['objects']}
          program_record = records[program]
          assert program_record['sha256_before'] == expected_program
          assert hashlib.sha256((root / program.lstrip('/')).read_bytes()).hexdigest() == program_record['sha256_after']
          plugin_record = records[plugin]
          assert hashlib.sha256((root / plugin.lstrip('/')).read_bytes()).hexdigest() == plugin_record['sha256_after']
          pathlib.Path('build/proof/prepatch-lock.json').write_text(
              json.dumps({'program': program_record, 'plugin': plugin_record},
                         indent=2) + '\n')
          PY
          diskutil info "$root" | tee build/proof/guest-volume.txt
          grep -F 'Case-sensitive' build/proof/guest-volume.txt

      - name: Patch qt_plugin_instance with a one-shot INT3
        run: |
          set -euxo pipefail
          python3 runtime/m3/patch_elf_int3_probe.py "$HRT_ROOT$PLUGIN" \
            --symbol qt_plugin_instance \
            --label 'Qt offscreen plugin instance' \
            --manifest build/proof/plugin-instance-probe.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          prepatch = json.loads(Path('build/proof/prepatch-lock.json').read_text())
          probe = json.loads(Path('build/proof/plugin-instance-probe.json').read_text())
          assert probe['sha256_before'] == prepatch['plugin']['sha256_after']
          assert probe['patched_bytes_hex'].startswith('cc')
          assert probe['symbol']['name'] == 'qt_plugin_instance'
          PY

      - name: Generate the resumable plugin-instance runtime
        run: |
          set -euxo pipefail
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          /usr/bin/arch -x86_64 /usr/bin/getconf PAGESIZE \
            | tee build/proof/x86-page-size.txt

          python3 runtime/m3/augment_syscalls.py \
            runtime/m3/syscall_bridge.c build/generated/stage1.c
          python3 runtime/m3/augment_directory_syscalls.py \
            build/generated/stage1.c build/generated/stage2.c
          python3 runtime/m3/augment_directory_stream.py \
            build/generated/stage2.c build/generated/stage3.c
          python3 runtime/m3/augment_pipe2.py \
            build/generated/stage3.c build/generated/stage4.c
          python3 runtime/m3/augment_polling.py \
            build/generated/stage4.c build/generated/stage5.c
          python3 runtime/m3/augment_epoll.py \
            build/generated/stage5.c build/generated/stage6.c
          python3 runtime/m3/augment_tgkill.py \
            build/generated/stage6.c build/generated/stage7.c
          python3 runtime/m3/augment_crash_signals.py \
            build/generated/stage7.c build/generated/stage8.c
          python3 runtime/m3/augment_int3_probe.py \
            build/generated/stage8.c build/proof/plugin-instance-probe.json \
            build/generated/syscall_bridge.c
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build/generated/syscall_bridge.c')
          text = path.read_text()
          anchor = '#define M3_TRACE_LIMIT 256u'
          assert text.count(anchor) == 1
          path.write_text(text.replace(anchor, '#define M3_TRACE_LIMIT 36000u'))
          PY

          grep -Fq 'HRT M5 INT3: guest Qt offscreen plugin instance entered' \
            build/generated/syscall_bridge.c
          grep -Fq 'int3_probe_signal_handler' build/generated/syscall_bridge.c
          grep -Fq 'host_getdents64_stream_bridge' build/generated/syscall_bridge.c
          grep -Fq 'host_pipe2_bridge' build/generated/syscall_bridge.c
          grep -Fq 'host_epoll_create1_bridge' build/generated/syscall_bridge.c

      - name: Compile and sign the x86-64 host
        run: |
          set -euxo pipefail
          clang -arch x86_64 -std=c17 -O2 -g \
            -fno-stack-protector -fno-omit-frame-pointer \
            -Wall -Wextra -Werror -Wpedantic \
            -Iruntime/m3 -Iruntime/m1 \
            runtime/m3/main.c runtime/m1/common.c runtime/m3/elf_map.c \
            runtime/m3/stack.c runtime/m3/patch.c \
            build/generated/syscall_bridge.c runtime/m1/enter_guest.S \
            -Wl,-pagezero_size,0x1000 -o build/host/hrt-m5-plugin-instance
          file build/host/hrt-m5-plugin-instance | tee build/proof/host-file.txt
          lipo -info build/host/hrt-m5-plugin-instance | tee build/proof/host-arch.txt
          codesign --force --sign - --timestamp=none build/host/hrt-m5-plugin-instance
          codesign --verify --strict build/host/hrt-m5-plugin-instance

      - name: Execute exact HWord through the guest plugin entry probe
        run: |
          set -uxo pipefail
          : > build/proof/stdout.txt
          : > build/proof/stderr.txt
          /usr/bin/arch -x86_64 build/host/hrt-m5-plugin-instance \
            --root "$HRT_ROOT" --program "$PROGRAM" \
            >build/proof/stdout.txt 2>build/proof/stderr.txt &
          pid=$!
          deadline=1
          for _ in $(jot 600); do
            if ! kill -0 "$pid" 2>/dev/null; then
              deadline=0
              break
            fi
            sleep 0.05
          done
          if [ "$deadline" -ne 0 ]; then
            ps -o pid,ppid,state,%cpu,%mem,etime,command -p "$pid" \
              >build/proof/process.txt 2>&1 || true
            /usr/bin/sample "$pid" 2 1 -file build/proof/sample.txt \
              >/dev/null 2>&1 || true
            kill -TERM "$pid" 2>/dev/null || true
            sleep 0.2
            kill -KILL "$pid" 2>/dev/null || true
          fi
          set +e
          wait "$pid"
          status=$?
          set -e
          if [ "$deadline" -ne 0 ]; then status=124; fi
          printf '%s\n' "$status" > build/proof/exit-status.txt
          printf '%s\n' "$deadline" > build/proof/reached-deadline.txt

          grep -E 'HRT M5: directory stream|HRT M5 INT3|Found metadata|Got keys|loaded library|GWakeup|Linux syscall ENOSYS|fatal signal|Qt platform plugin|QFactoryLoader|syscall (7|213|232|233|234|271|281|290|291|293) ' \
            build/proof/stderr.txt | tail -n 5000 \
            | tee build/proof/key-lines.txt || true
          grep -E 'Call graph:|Thread_.*DispatchQueue|hrt-m5|libqoffscreen|qt_plugin_instance|Qt5|GLib|poll|kevent|QEventLoop' \
            build/proof/sample.txt 2>/dev/null | head -n 1200 \
            > build/proof/sample-key-lines.txt || true
          echo '--- key lines ---'; cat build/proof/key-lines.txt
          echo '--- stderr tail ---'; tail -n 2400 build/proof/stderr.txt || true
          echo '--- stdout tail ---'; tail -n 500 build/proof/stdout.txt || true
          echo '--- process ---'; cat build/proof/process.txt 2>/dev/null || true
          echo '--- sample ---'; cat build/proof/sample-key-lines.txt || true
          echo "status=$status deadline=$deadline"

      - name: Record the plugin-instance diagnosis
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          stderr = Path('build/proof/stderr.txt').read_text(errors='replace')
          stdout = Path('build/proof/stdout.txt').read_text(errors='replace')
          probe = json.loads(Path('build/proof/plugin-instance-probe.json').read_text())
          unsupported = sorted({
              int(match.group(1))
              for line in stderr.splitlines()
              if (match := re.search(r'Linux syscall ENOSYS ([0-9]+)', line))
          })
          marker = 'HRT M5 INT3: guest Qt offscreen plugin instance entered (qt_plugin_instance)'
          summary = {
              'schema': 1,
              'milestone': 'M5-plugin-instance',
              'commit': '${{ github.sha }}',
              'workflow_run': '${{ github.run_id }}',
              'source_rootfs_run': '${{ env.SOURCE_RUN_ID }}',
              'program': '${{ env.PROGRAM }}',
              'plugin': '${{ env.PLUGIN }}',
              'plugin_probe_manifest': probe,
              'status': int(Path('build/proof/exit-status.txt').read_text()),
              'reached_deadline': bool(int(Path('build/proof/reached-deadline.txt').read_text())),
              'directory_stream_yielded_offscreen': (
                  'HRT M5: directory stream yielded libqoffscreen.so' in stderr),
              'offscreen_metadata_observed': (
                  'Got keys from plugin meta data ("offscreen")' in stderr or
                  ('Found metadata in lib' in stderr and 'libqoffscreen.so' in stderr)),
              'offscreen_library_loaded': (
                  'loaded library "/opt/hnc/hoffice11/Bin/qt/plugins/platforms/libqoffscreen.so"'
                  in stderr),
              'qt_plugin_instance_entered': marker in stderr,
              'pipe2_called': 'hrt-m3: syscall 293 ' in stderr,
              'glib_gwakeup_pipe_failure': 'Creating pipes for GWakeup' in stderr,
              'fatal_signals': [line for line in stderr.splitlines()
                                if 'hrt-m3: fatal signal ' in line],
              'unsupported_syscalls': unsupported,
              'stdout_tail': stdout[-2400:],
          }
          encoded = json.dumps(summary, indent=2) + '\n'
          Path('build/proof/summary.json').write_text(encoded)
          Path('diagnostics/m5-hword-plugin-instance-latest.json').write_text(encoded)
          print(encoded)
          PY

      - name: Persist diagnosis before the proof gate
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/m5-hword-plugin-instance-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'diagnostic: record HWord offscreen plugin-instance boundary [skip ci]'
          git pull --rebase origin codex/hoffice-runtime-from-scratch
          git push origin HEAD:codex/hoffice-runtime-from-scratch

      - name: Accept exact guest plugin-instance entry
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('build/proof/summary.json').read_text())
          assert summary['directory_stream_yielded_offscreen']
          assert summary['offscreen_metadata_observed']
          assert summary['offscreen_library_loaded']
          assert summary['qt_plugin_instance_entered']
          assert summary['pipe2_called']
          assert 293 not in summary['unsupported_syscalls']
          assert not summary['glib_gwakeup_pipe_failure']
          PY

      - name: Commit durable plugin-instance proof
        run: |
          set -euxo pipefail
          git fetch origin codex/hoffice-runtime-from-scratch
          git reset --hard origin/codex/hoffice-runtime-from-scratch
          cp build/proof/summary.json proofs/m5-hword-offscreen-plugin-instance.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proofs/m5-hword-offscreen-plugin-instance.json
          git commit -m 'proof: verify exact HWord enters offscreen plugin instance [skip ci]' || exit 0
          git pull --rebase origin codex/hoffice-runtime-from-scratch
          git push origin HEAD:codex/hoffice-runtime-from-scratch

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hrt-m5-hword-plugin-instance-proof
          path: |
            build/generated/syscall_bridge.c
            build/host/hrt-m5-plugin-instance
            build/proof
          if-no-files-found: warn
          retention-days: 14

      - name: Detach guest filesystem
        if: always()
        run: hdiutil detach -quiet "$HRT_ROOT" || true
