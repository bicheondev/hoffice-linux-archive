name: Reusable HOffice guest target ELF symbol probe v3

on:
  workflow_call:
    inputs:
      predecessor_proof:
        required: true
        type: string
      target_elf:
        required: true
        type: string
      symbol_regex:
        required: true
        type: string
      label:
        required: true
        type: string
      milestone:
        required: true
        type: string
      diagnostic_path:
        required: true
        type: string
      proof_path:
        required: true
        type: string
      trace_limit:
        required: false
        type: number
        default: 64000
      run_seconds:
        required: false
        type: number
        default: 40
      require_offscreen_loaded:
        required: false
        type: boolean
        default: true
      require_pipe2:
        required: false
        type: boolean
        default: true

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      SOURCE_RUN_ID: '31102898765'
      PROGRAM: /opt/hnc/hoffice11/Bin/hword
      PROGRAM_SHA256: 55876ea7d0c20e73d936af11cc3623c418acb09d61bde5bfeecafa1da7a9b5cb
      OFFSCREEN_PLUGIN: /opt/hnc/hoffice11/Bin/qt/plugins/platforms/libqoffscreen.so
      PREDECESSOR_PROOF: ${{ inputs.predecessor_proof }}
      TARGET_ELF_REQUESTED: ${{ inputs.target_elf }}
      SYMBOL_REGEX: ${{ inputs.symbol_regex }}
      PROBE_LABEL: ${{ inputs.label }}
      MILESTONE: ${{ inputs.milestone }}
      DIAGNOSTIC_PATH: ${{ inputs.diagnostic_path }}
      PROOF_PATH: ${{ inputs.proof_path }}
      TRACE_LIMIT: ${{ inputs.trace_limit }}
      RUN_SECONDS: ${{ inputs.run_seconds }}
      REQUIRE_OFFSCREEN_LOADED: ${{ inputs.require_offscreen_loaded }}
      REQUIRE_PIPE2: ${{ inputs.require_pipe2 }}
      BRANCH: codex/hoffice-runtime-from-scratch

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the predecessor boundary
        run: |
          set -euxo pipefail
          test -s "$PREDECESSOR_PROOF"
          python3 - "$PREDECESSOR_PROOF" <<'PY'
          import json, pathlib, sys
          proof = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert proof.get('schema') == 1
          PY

      - uses: actions/download-artifact@v4
        with:
          name: hrt-m5-hword-offscreen-rootfs
          path: build/input
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify, mount, and resolve the requested target ELF
        run: |
          set -euxo pipefail
          mkdir -p build/generated build/host build/proof
          mkdir -p "$(dirname "$DIAGNOSTIC_PATH")" \
                   "$(dirname "$PROOF_PATH")"
          expected=$(awk '{print $1; exit}' build/input/hword-rootfs.tar.gz.sha256)
          actual=$(shasum -a 256 build/input/hword-rootfs.tar.gz | awk '{print $1}')
          test "$actual" = "$expected"
          printf '%s\n' "$actual" > build/proof/rootfs-archive.sha256

          image="$RUNNER_TEMP/hrt-target-v3-${GITHUB_RUN_ID}.sparsebundle"
          root="$RUNNER_TEMP/hrt-target-v3-${GITHUB_RUN_ID}-root"
          rm -rf "$image" "$root"; mkdir -p "$root"
          if ! hdiutil create -quiet -size 8g -fs APFSX \
               -volname HRTTARGET -type SPARSEBUNDLE "$image"; then
            rm -rf "$image"
            hdiutil create -quiet -size 8g -fs HFSX \
              -volname HRTTARGET -type SPARSEBUNDLE "$image"
          fi
          hdiutil attach -quiet -nobrowse -mountpoint "$root" "$image"
          echo "HRT_ROOT=$root" >> "$GITHUB_ENV"
          echo "HRT_IMAGE=$image" >> "$GITHUB_ENV"
          tar -xzf build/input/hword-rootfs.tar.gz -C "$root"

          test -s "$root/.hrt-closure-v1.json"
          test -s "$root/.hrt-prepatched-v1"
          test -f "$root$PROGRAM"
          test -f "$root$OFFSCREEN_PLUGIN"
          test -e "$root$TARGET_ELF_REQUESTED"
          test -d "$root/opt/hnc/hoffice11/Bin/Hword"

          python3 - "$root" "$PROGRAM" "$PROGRAM_SHA256" \
                    "$OFFSCREEN_PLUGIN" "$TARGET_ELF_REQUESTED" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1]).resolve()
          program = sys.argv[2]
          expected_program = sys.argv[3]
          plugin = sys.argv[4]
          requested = sys.argv[5]
          requested_host = root / requested.lstrip('/')
          resolved_host = requested_host.resolve(strict=True)
          try:
              resolved_relative = resolved_host.relative_to(root)
          except ValueError as error:
              raise SystemExit('resolved target escaped rootfs') from error
          resolved_guest = '/' + str(resolved_relative)

          manifest = json.loads((root / '.hrt-prepatched-v1').read_text())
          records = {item['path']: item for item in manifest['objects']}
          program_record = records[program]
          assert program_record['sha256_before'] == expected_program
          assert hashlib.sha256(
              (root / program.lstrip('/')).read_bytes()).hexdigest() == \
              program_record['sha256_after']

          plugin_host = (root / plugin.lstrip('/')).resolve(strict=True)
          plugin_guest = '/' + str(plugin_host.relative_to(root))
          plugin_record = records.get(plugin) or records.get(plugin_guest)
          if plugin_record is None:
              raise SystemExit(f'plugin missing from prepatch manifest: {plugin_guest}')
          assert hashlib.sha256(plugin_host.read_bytes()).hexdigest() == \
              plugin_record['sha256_after']

          target_record = records.get(requested) or records.get(resolved_guest)
          if target_record is None:
              raise SystemExit(
                  f'target missing from prepatch manifest: '
                  f'{requested} -> {resolved_guest}')
          target_hash = hashlib.sha256(resolved_host.read_bytes()).hexdigest()
          assert target_hash == target_record['sha256_after'], (
              target_hash, target_record)

          lock = {
              'program': program_record,
              'offscreen_plugin_requested': plugin,
              'offscreen_plugin_resolved': plugin_guest,
              'offscreen_plugin': plugin_record,
              'target_requested': requested,
              'target_resolved': resolved_guest,
              'target': target_record,
          }
          pathlib.Path('build/proof/prepatch-lock.json').write_text(
              json.dumps(lock, indent=2) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'TARGET_ELF_RESOLVED={resolved_guest}\n')
          print(json.dumps(lock, indent=2))
          PY
          diskutil info "$root" | tee build/proof/guest-volume.txt
          grep -F 'Case-sensitive' build/proof/guest-volume.txt
          file "$root$TARGET_ELF_RESOLVED" | tee build/proof/target-file.txt

      - name: Patch the selected target function with one-shot INT3
        run: |
          set -euxo pipefail
          python3 runtime/m3/patch_elf_int3_probe_regex.py \
            "$HRT_ROOT$TARGET_ELF_RESOLVED" \
            --symbol-regex "$SYMBOL_REGEX" --label "$PROBE_LABEL" \
            --manifest build/proof/symbol-probe.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path('build/proof/prepatch-lock.json').read_text())
          probe = json.loads(Path('build/proof/symbol-probe.json').read_text())
          assert probe['sha256_before'] == lock['target']['sha256_after']
          assert probe['patched_bytes_hex'].startswith('cc')
          assert probe['sha256_before'] != probe['sha256_after']
          PY

      - name: Generate the full M5/M6 compatibility bridge
        run: |
          set -euxo pipefail
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          /usr/bin/arch -x86_64 /usr/bin/getconf PAGESIZE \
            | tee build/proof/x86-page-size.txt
          python3 runtime/m3/augment_syscalls.py \
            runtime/m3/syscall_bridge.c build/generated/1.c
          python3 runtime/m3/augment_directory_syscalls.py \
            build/generated/1.c build/generated/2.c
          python3 runtime/m3/augment_directory_stream.py \
            build/generated/2.c build/generated/3.c
          python3 runtime/m3/augment_directory_stream_hosttrace.py \
            build/generated/3.c build/generated/4.c
          python3 runtime/m3/augment_pipe2.py \
            build/generated/4.c build/generated/5.c
          python3 runtime/m3/augment_polling.py \
            build/generated/5.c build/generated/6.c
          python3 runtime/m3/augment_epoll.py \
            build/generated/6.c build/generated/7.c
          python3 runtime/m3/augment_tgkill.py \
            build/generated/7.c build/generated/8.c
          python3 runtime/m3/augment_crash_signals.py \
            build/generated/8.c build/generated/9.c
          python3 runtime/m3/augment_int3_probe.py \
            build/generated/9.c build/proof/symbol-probe.json \
            build/generated/syscall_bridge.c
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('build/generated/syscall_bridge.c')
          text = path.read_text()
          anchor = '#define M3_TRACE_LIMIT 256u'
          assert text.count(anchor) == 1
          path.write_text(text.replace(
              anchor,
              f'#define M3_TRACE_LIMIT {int(os.environ["TRACE_LIMIT"])}u'))
          PY
          grep -Fq '(void)write(STDERR_FILENO, marker' \
            build/generated/syscall_bridge.c
          grep -Fq 'host_pipe2_bridge' build/generated/syscall_bridge.c
          grep -Fq 'host_epoll_create1_bridge' \
            build/generated/syscall_bridge.c
          grep -Fq 'host_tgkill_bridge' build/generated/syscall_bridge.c
          grep -Fq 'int3_probe_signal_handler' \
            build/generated/syscall_bridge.c

      - name: Compile and sign the x86-64 host
        run: |
          set -euxo pipefail
          clang -arch x86_64 -std=c17 -O2 -g \
            -fno-stack-protector -fno-omit-frame-pointer \
            -Wall -Wextra -Werror -Wpedantic \
            -Iruntime/m3 -Iruntime/m1 \
            runtime/m3/main.c runtime/m1/common.c runtime/m3/elf_map.c \
            runtime/m3/stack.c runtime/m3/patch.c \
            build/generated/syscall_bridge.c runtime/m1/enter_guest.S \
            -Wl,-pagezero_size,0x1000 \
            -o build/host/hrt-target-symbol-v3
          file build/host/hrt-target-symbol-v3 | tee build/proof/host-file.txt
          lipo -info build/host/hrt-target-symbol-v3 \
            | tee build/proof/host-arch.txt
          codesign --force --sign - --timestamp=none \
            build/host/hrt-target-symbol-v3
          codesign --verify --strict build/host/hrt-target-symbol-v3

      - name: Run exact HWord through the selected target function
        run: |
          set -uxo pipefail
          : > build/proof/stdout.txt
          : > build/proof/stderr.txt
          /usr/bin/arch -x86_64 build/host/hrt-target-symbol-v3 \
            --root "$HRT_ROOT" --program "$PROGRAM" \
            >build/proof/stdout.txt 2>build/proof/stderr.txt &
          pid=$!
          deadline=1
          loops=$((RUN_SECONDS * 20))
          for _ in $(jot "$loops"); do
            if ! kill -0 "$pid" 2>/dev/null; then
              deadline=0
              break
            fi
            sleep 0.05
          done
          if [ "$deadline" -ne 0 ]; then
            ps -o pid,ppid,state,%cpu,%mem,etime,command -p "$pid" \
              >build/proof/process.txt 2>&1 || true
            /usr/bin/sample "$pid" 2 1 -file build/proof/sample.txt \
              >/dev/null 2>&1 || true
            kill -TERM "$pid" 2>/dev/null || true
            sleep 0.2
            kill -KILL "$pid" 2>/dev/null || true
          fi
          set +e
          wait "$pid"
          status=$?
          set -e
          if [ "$deadline" -ne 0 ]; then status=124; fi
          printf '%s\n' "$status" > build/proof/exit-status.txt
          printf '%s\n' "$deadline" > build/proof/reached-deadline.txt
          grep -E 'HRT M5: directory stream|HRT M5 INT3|Found metadata|Got keys|loaded library|GWakeup|Linux syscall ENOSYS|fatal signal|Qt platform plugin|QFactoryLoader|syscall (7|213|232|233|234|271|281|290|291|293) ' \
            build/proof/stderr.txt | tail -n 9000 \
            | tee build/proof/key-lines.txt || true
          grep -E 'Call graph:|Thread_.*DispatchQueue|libqoffscreen|Qt5|GLib|poll|ppoll|kevent|QEventLoop|QPlatform|QWindow|QBackingStore|QWidget' \
            build/proof/sample.txt 2>/dev/null | head -n 2200 \
            > build/proof/sample-key-lines.txt || true
          cat build/proof/key-lines.txt
          tail -n 2800 build/proof/stderr.txt || true
          cat build/proof/sample-key-lines.txt || true

      - name: Write and persist the target-boundary diagnosis
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          stderr = Path('build/proof/stderr.txt').read_text(errors='replace')
          stdout = Path('build/proof/stdout.txt').read_text(errors='replace')
          sample = (Path('build/proof/sample.txt').read_text(errors='replace')
                    if Path('build/proof/sample.txt').exists() else '')
          probe = json.loads(Path('build/proof/symbol-probe.json').read_text())
          lock = json.loads(Path('build/proof/prepatch-lock.json').read_text())
          unsupported = sorted({
              int(match.group(1))
              for line in stderr.splitlines()
              if (match := re.search(r'Linux syscall ENOSYS ([0-9]+)', line))
          })
          marker = f'HRT M5 INT3: guest {os.environ["PROBE_LABEL"]} entered'
          summary = {
              'schema': 1,
              'milestone': os.environ['MILESTONE'],
              'commit': os.environ['GITHUB_SHA'],
              'workflow_run': os.environ['GITHUB_RUN_ID'],
              'predecessor_proof': os.environ['PREDECESSOR_PROOF'],
              'program': os.environ['PROGRAM'],
              'target_elf_requested': os.environ['TARGET_ELF_REQUESTED'],
              'target_elf_resolved': os.environ['TARGET_ELF_RESOLVED'],
              'target_sha256_before_probe': probe['sha256_before'],
              'offscreen_plugin': os.environ['OFFSCREEN_PLUGIN'],
              'status': int(Path('build/proof/exit-status.txt').read_text()),
              'reached_deadline': bool(int(
                  Path('build/proof/reached-deadline.txt').read_text())),
              'directory_stream_yielded_offscreen': (
                  'HRT M5: directory stream yielded libqoffscreen.so' in stderr),
              'offscreen_library_loaded': (
                  'loaded library "/opt/hnc/hoffice11/Bin/qt/plugins/platforms/libqoffscreen.so"'
                  in stderr),
              'probe_label': os.environ['PROBE_LABEL'],
              'selected_symbol': probe['symbol'],
              'selected_symbol_entered': marker in stderr,
              'pipe2_called': 'hrt-m3: syscall 293 ' in stderr,
              'glib_gwakeup_pipe_failure': 'Creating pipes for GWakeup' in stderr,
              'fatal_signals': [line for line in stderr.splitlines()
                                if 'hrt-m3: fatal signal ' in line],
              'unsupported_syscalls': unsupported,
              'sample_mentions_gui_path': any(token in sample for token in (
                  'QEventLoop', 'QPlatform', 'QWindow', 'QBackingStore',
                  'QWidget', 'kevent', 'poll')),
              'prepatch_lock': lock,
              'probe_manifest': probe,
              'stdout_tail': stdout[-2600:],
          }
          encoded = json.dumps(summary, indent=2) + '\n'
          Path('build/proof/summary.json').write_text(encoded)
          target = Path(os.environ['DIAGNOSTIC_PATH'])
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(encoded)
          print(encoded)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DIAGNOSTIC_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "diagnostic: record $MILESTONE [skip ci]"
            git pull --rebase origin "$BRANCH"
            git push origin HEAD:"$BRANCH"
          fi

      - name: Accept and commit the durable target proof
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          summary = json.loads(Path('build/proof/summary.json').read_text())
          assert summary['selected_symbol_entered']
          if os.environ['REQUIRE_OFFSCREEN_LOADED'].lower() == 'true':
              assert summary['directory_stream_yielded_offscreen']
              assert summary['offscreen_library_loaded']
          if os.environ['REQUIRE_PIPE2'].lower() == 'true':
              assert summary['pipe2_called']
              assert 293 not in summary['unsupported_syscalls']
              assert not summary['glib_gwakeup_pipe_failure']
          PY
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          mkdir -p "$(dirname "$PROOF_PATH")"
          cp build/proof/summary.json "$PROOF_PATH"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$PROOF_PATH"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "proof: verify $MILESTONE"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hrt-${{ inputs.milestone }}-target-v3-proof
          path: |
            build/generated/syscall_bridge.c
            build/host/hrt-target-symbol-v3
            build/proof
          if-no-files-found: warn
          retention-days: 30

      - name: Detach the case-sensitive guest root
        if: always()
        run: hdiutil detach -quiet "$HRT_ROOT" || true
