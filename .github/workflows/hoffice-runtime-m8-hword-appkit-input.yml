name: HOffice runtime M8 exact HWord AppKit input

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
    paths:
      - 'runtime/m8/**'
      - 'runtime/m6/qpa/qhrtappkitbackingstore.cpp'
      - 'runtime/m6/qpa/qhrtappkitbackingstore.h'
      - '.github/workflows/hoffice-runtime-m8-hword-appkit-input.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: hrt-m8-exact-hword-appkit-input-${{ github.ref }}
  cancel-in-progress: true

env:
  ROOTFS_ARTIFACT_ID: '8968324706'
  ROOTFS_ARTIFACT_SHA256: 3e301d3c6269926c62804bff18671136fcf8c0b0b22b3952072e427a8fa9918a
  ROOTFS_ARCHIVE_SHA256: 322fcf228092b296a34edbfa7ee43f9a7b237d5bcedaee50109ac4bb44d9ca28
  PROGRAM: /opt/hnc/hoffice11/Bin/hword
  PROGRAM_SHA256: 55876ea7d0c20e73d936af11cc3623c418acb09d61bde5bfeecafa1da7a9b5cb
  PLUGIN_GUEST: /opt/hnc/hoffice11/Bin/qt/plugins/platforms/libqhrtappkit.so
  QTBASE_ARCHIVE_SHA256: c6bf887732b83ce072eb72eddb7497bedcdf9ca794e7ed91261a93f063623e1c

jobs:
  build-input-qpa:
    runs-on: ubuntu-24.04
    container: debian:buster-slim
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install and lock the exact Qt 5.11.3 build ABI
        shell: bash
        run: |
          set -euxo pipefail
          cat >/etc/apt/sources.list <<'EOF'
          deb [trusted=yes] http://archive.debian.org/debian buster main
          deb [trusted=yes] http://archive.debian.org/debian-security buster/updates main
          EOF
          printf 'Acquire::Check-Valid-Until "false";\n' >/etc/apt/apt.conf.d/99archive
          apt-get -o Acquire::AllowInsecureRepositories=true update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential binutils ca-certificates curl file jq python3 xz-utils \
            qt5-qmake qtbase5-dev qtbase5-dev-tools qtbase5-private-dev
          export QT_SELECT=qt5
          test "$(qmake -qt=5 -query QT_VERSION)" = 5.11.3
          qmake -qt=5 -query QT_VERSION | tee build-qt-version.txt
          g++ --version | head -n 1 | tee build-compiler-version.txt

      - name: Fetch the immutable official Qt offscreen implementation
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/source build/qpa \
            "build/m8-qpa-output/plugin-root$(dirname "$PLUGIN_GUEST")" \
            build/m8-qpa-output/report
          curl --fail --location --retry 5 --retry-delay 3 \
            https://download.qt.io/archive/qt/5.11/5.11.3/submodules/qtbase-everywhere-src-5.11.3.tar.xz \
            -o build/source/qtbase.tar.xz
          printf '%s  %s\n' "$QTBASE_ARCHIVE_SHA256" build/source/qtbase.tar.xz \
            | sha256sum --check -
          tar -xJf build/source/qtbase.tar.xz -C build/source
          qtbase=$(find build/source -mindepth 1 -maxdepth 1 -type d \
            -name 'qtbase-*5.11.3*' -print -quit)
          test -n "$qtbase"
          test -f "$qtbase/src/plugins/platforms/offscreen/qoffscreenintegration.cpp"
          printf '%s\n' "$qtbase" >build/m8-qpa-output/report/qtbase-path.txt
          sha256sum build/source/qtbase.tar.xz \
            >build/m8-qpa-output/report/qtbase-source.sha256

      - name: Build and audit the M8 input-enabled QPA
        shell: bash
        run: |
          set -euxo pipefail
          export QT_SELECT=qt5
          qtbase=$(cat build/m8-qpa-output/report/qtbase-path.txt)
          qpa_source="$PWD/runtime/m6/qpa/hrtappkit.pro"
          offscreen="$PWD/$qtbase/src/plugins/platforms/offscreen"
          cd build/qpa
          qmake -qt=5 "$qpa_source" "QTOFFSCREEN_DIR=$offscreen"
          make -j2 V=1
          plugin=$(find out . -type f -name libqhrtappkit.so -print -quit)
          test -n "$plugin"
          cp "$plugin" "$GITHUB_WORKSPACE/build/m8-qpa-output/plugin-root$PLUGIN_GUEST"
          cd "$GITHUB_WORKSPACE"
          chmod 0755 "build/m8-qpa-output/plugin-root$PLUGIN_GUEST"
          file "build/m8-qpa-output/plugin-root$PLUGIN_GUEST" \
            | tee build/m8-qpa-output/report/plugin-file.txt
          readelf -dW "build/m8-qpa-output/plugin-root$PLUGIN_GUEST" \
            | tee build/m8-qpa-output/report/plugin-dynamic.txt
          readelf -Ws "build/m8-qpa-output/plugin-root$PLUGIN_GUEST" \
            | tee build/m8-qpa-output/report/plugin-symbols.txt
          readelf -p .qtmetadata "build/m8-qpa-output/plugin-root$PLUGIN_GUEST" \
            | tee build/m8-qpa-output/report/plugin-qtmetadata.txt || true
          strings -a "build/m8-qpa-output/plugin-root$PLUGIN_GUEST" \
            | grep -E 'hrtappkit|HRT M7 QPA|HRT M8 QPA' \
            | tee build/m8-qpa-output/report/plugin-markers.txt
          grep -F 'Shared library: [libQt5Gui.so.5]' \
            build/m8-qpa-output/report/plugin-dynamic.txt
          grep -F 'Shared library: [libQt5Core.so.5]' \
            build/m8-qpa-output/report/plugin-dynamic.txt
          grep -aF 'HRT M7 QPA: BGRA frame accepted' \
            "build/m8-qpa-output/plugin-root$PLUGIN_GUEST"
          grep -aF 'HRT M8 QPA: key event delivered' \
            "build/m8-qpa-output/plugin-root$PLUGIN_GUEST"
          grep -aF 'HRT M8 QPA: mouse event delivered' \
            "build/m8-qpa-output/plugin-root$PLUGIN_GUEST"
          if awk '$7 == "UND" && /createPlatformVulkanInstance/' \
               build/m8-qpa-output/report/plugin-symbols.txt | grep .; then
            echo 'Unresolved HOffice Qt private-ABI relocation remains.' >&2
            exit 1
          fi

      - name: Prepatch and lock the M8 plugin
        shell: bash
        run: |
          set -euxo pipefail
          python3 runtime/m3/prepatch_elf.py build/m8-qpa-output/plugin-root \
            | tee build/m8-qpa-output/report/plugin-prepatch.txt
          test -s build/m8-qpa-output/plugin-root/.hrt-prepatched-v1
          xz --threads=1 --check=crc64 -9 --stdout \
            "build/m8-qpa-output/plugin-root$PLUGIN_GUEST" \
            >build/m8-qpa-output/libqhrtappkit.so.xz
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path

          guest = os.environ['PLUGIN_GUEST']
          output = Path('build/m8-qpa-output')
          root = output / 'plugin-root'
          plugin = root / guest.lstrip('/')
          marker = json.loads((root / '.hrt-prepatched-v1').read_text())
          record, = [item for item in marker['objects'] if item['path'] == guest]
          actual = hashlib.sha256(plugin.read_bytes()).hexdigest()
          assert actual == record['sha256_after'], (actual, record)
          compressed = (output / 'libqhrtappkit.so.xz').read_bytes()
          dynamic = (output / 'report/plugin-dynamic.txt').read_text(errors='replace')
          lock = {
              'schema': 3,
              'artifact': {
                  'kind': 'same-run-m8-qpa',
                  'workflow_run': os.environ['GITHUB_RUN_ID'],
                  'source_commit': os.environ['GITHUB_SHA'],
              },
              'toolchain': {
                  'distribution': 'Debian Buster',
                  'compiler': Path('build-compiler-version.txt').read_text().strip(),
                  'qt_version': '5.11.3',
                  'qtbase_archive_sha256': os.environ['QTBASE_ARCHIVE_SHA256'],
              },
              'plugin': {
                  'guest_path': guest,
                  'qpa_key': 'hrtappkit',
                  'sha256_before_prepatch': record['sha256_before'],
                  'sha256_after_prepatch': record['sha256_after'],
                  'xz_sha256': hashlib.sha256(compressed).hexdigest(),
                  'patched_syscalls': record['syscalls'],
                  'rewritten_fs_prefixes': record['fs_to_gs'],
                  'vulkan_private_abi_locally_defined': True,
                  'm7_bgra_transport': True,
                  'm8_input_poll_transport': True,
                  'input_abi_size': 88,
                  'input_poll_opcode': 262,
                  'dependencies': re.findall(r'Shared library: \[([^\]]+)\]', dynamic),
              },
          }
          (output / 'lock.json').write_text(json.dumps(lock, indent=2) + '\n')
          print(json.dumps(lock, indent=2))
          PY
          sha256sum build/m8-qpa-output/libqhrtappkit.so.xz \
            >build/m8-qpa-output/report/plugin-xz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: hrt-m8-qt5113-hrtappkit-input-qpa
          path: build/m8-qpa-output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  run-exact-hword-input:
    needs: build-input-qpa
    runs-on: macos-14
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the durable exact-HWord M7 frame proof
        run: |
          set -euxo pipefail
          test -s proofs/m7-hword-bgra-first-frame.json
          grep -F '"status": "PASS"' proofs/m7-hword-bgra-first-frame.json

      - uses: actions/download-artifact@v4
        with:
          name: hrt-m8-qt5113-hrtappkit-input-qpa
          path: build/input/qpa

      - name: Download and verify the exact HWord rootfs artifact
        run: |
          set -euxo pipefail
          mkdir -p build/input/hword build/generated build/objects build/host build/proof
          curl --fail --location --retry 5 --retry-delay 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ROOTFS_ARTIFACT_ID/zip" \
            -o build/input/hword-artifact.zip
          printf '%s  %s\n' "$ROOTFS_ARTIFACT_SHA256" build/input/hword-artifact.zip \
            | shasum -a 256 -c -
          ditto -x -k build/input/hword-artifact.zip build/input/hword
          printf '%s  %s\n' "$ROOTFS_ARCHIVE_SHA256" \
            build/input/hword/hword-rootfs.tar.gz | shasum -a 256 -c -

      - name: Reconstruct the case-sensitive exact-HWord guest
        run: |
          set -euxo pipefail
          image="$RUNNER_TEMP/hrt-m8-input.sparsebundle"
          root="/tmp/h8i-$GITHUB_RUN_ID"
          rm -rf "$image" "$root"; mkdir -p "$root"
          if ! hdiutil create -quiet -size 8g -fs APFSX -volname HRTM8I \
               -type SPARSEBUNDLE "$image"; then
            rm -rf "$image"
            hdiutil create -quiet -size 8g -fs HFSX -volname HRTM8I \
              -type SPARSEBUNDLE "$image"
          fi
          hdiutil attach -quiet -nobrowse -mountpoint "$root" "$image"
          echo "HRT_ROOT=$root" >>"$GITHUB_ENV"
          echo "HRT_IMAGE=$image" >>"$GITHUB_ENV"
          tar -xzf build/input/hword/hword-rootfs.tar.gz -C "$root"
          test -s "$root/.hrt-prepatched-v1"
          test -f "$root$PROGRAM"
          test -d "$root/opt/hnc/hoffice11/Bin/Hword"

          mkdir -p "$root$(dirname "$PLUGIN_GUEST")"
          python3 - build/input/qpa/libqhrtappkit.so.xz \
            build/input/qpa/lock.json "$root$PLUGIN_GUEST" <<'PY'
          import hashlib, json, lzma, pathlib, sys
          source = pathlib.Path(sys.argv[1])
          lock = json.loads(pathlib.Path(sys.argv[2]).read_text())
          destination = pathlib.Path(sys.argv[3])
          assert lock['toolchain']['qt_version'] == '5.11.3', lock
          assert lock['plugin']['m8_input_poll_transport'] is True, lock
          compressed = source.read_bytes()
          assert hashlib.sha256(compressed).hexdigest() == lock['plugin']['xz_sha256'], lock
          plugin = lzma.decompress(compressed)
          assert hashlib.sha256(plugin).hexdigest() == lock['plugin']['sha256_after_prepatch'], lock
          destination.write_bytes(plugin)
          pathlib.Path('build/proof/qpa-lock.json').write_text(json.dumps(lock, indent=2) + '\n')
          PY
          chmod 0755 "$root$PLUGIN_GUEST"
          file "$root$PLUGIN_GUEST" | tee build/proof/plugin-file.txt
          diskutil info "$root" | tee build/proof/guest-volume.txt
          grep -F 'Case-sensitive' build/proof/guest-volume.txt

      - name: Generate the mature Linux bridge and M8 AppKit adapter
        run: |
          set -euxo pipefail
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          /usr/bin/arch -x86_64 /usr/bin/getconf PAGESIZE \
            | tee build/proof/x86-page-size.txt
          sw_vers | tee build/proof/sw-vers.txt

          python3 runtime/m8/augment_appkit_adapter_input.py \
            runtime/m6/appkit_adapter.m build/generated/appkit_adapter_m8.m
          grep -F 'case HRT_M8_OP_POLL_INPUT:' build/generated/appkit_adapter_m8.m
          grep -F 'hrt_m8_input_inject_if_requested' build/generated/appkit_adapter_m8.m

          python3 runtime/m6/augment_stack_hrtappkit.py \
            runtime/m3/stack.c build/generated/stack.c
          python3 runtime/m3/augment_syscalls.py \
            runtime/m3/syscall_bridge.c build/generated/stage1.c
          python3 runtime/m3/augment_directory_syscalls.py \
            build/generated/stage1.c build/generated/stage2.c
          python3 runtime/m3/augment_directory_stream.py \
            build/generated/stage2.c build/generated/stage3.c
          python3 runtime/m3/augment_pipe2.py \
            build/generated/stage3.c build/generated/stage4.c
          python3 runtime/m3/augment_eventfd2.py \
            build/generated/stage4.c build/generated/stage5.c
          python3 runtime/m3/augment_crash_signals.py \
            build/generated/stage5.c build/generated/stage6.c
          python3 runtime/m3/augment_poll.py \
            build/generated/stage6.c build/generated/stage7.c
          python3 runtime/m3/augment_posix_basics.py \
            build/generated/stage7.c build/generated/stage8.c
          python3 runtime/m3/augment_connect.py \
            build/generated/stage8.c build/generated/stage9.c
          python3 runtime/m6/augment_appkit_hostcall_deferred.py \
            build/generated/stage9.c build/generated/stage10.c
          python3 runtime/m3/augment_darwin_syscall_abi.py \
            build/generated/stage10.c build/generated/syscall_bridge.c
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build/generated/syscall_bridge.c')
          path.write_text(path.read_text().replace(
              '#define M3_TRACE_LIMIT 256u', '#define M3_TRACE_LIMIT 30000u'))
          PY
          grep -q 'host_getdents64_stream_bridge' build/generated/syscall_bridge.c
          grep -q 'case HRT_M6_HOSTCALL_SYSCALL' build/generated/syscall_bridge.c

      - name: Compile and sign the exact-HWord M8 host
        run: |
          set -euxo pipefail
          common=(-arch x86_64 -std=c17 -O2 -g -fno-stack-protector \
            -fno-omit-frame-pointer -Wall -Wextra -Werror -Wpedantic \
            -Wno-unused-function -Wno-unused-variable \
            -Iruntime/m8 -Iruntime/m6 -Iruntime/m3 -Iruntime/m1)
          index=0
          for source in runtime/m6/main.c runtime/m6/hostcall_trampoline.c \
            runtime/m1/common.c runtime/m3/elf_map.c build/generated/stack.c \
            runtime/m3/patch.c build/generated/syscall_bridge.c; do
            clang "${common[@]}" -c "$source" -o "build/objects/c-${index}.o"
            index=$((index+1))
          done
          clang -arch x86_64 -std=c17 -O2 -g -fobjc-arc \
            -Wall -Wextra -Werror -Wpedantic -Iruntime/m8 -Iruntime/m6 \
            -c build/generated/appkit_adapter_m8.m \
            -o build/objects/appkit-adapter.o
          clang -arch x86_64 -std=c17 -O2 -g -fobjc-arc \
            -Wall -Wextra -Werror -Wpedantic -Iruntime/m8 -Iruntime/m6 \
            -c runtime/m8/appkit_input.m -o build/objects/appkit-input.o
          clang -arch x86_64 -g -c runtime/m1/enter_guest.S \
            -o build/objects/enter-guest.o
          clang -arch x86_64 -g -c runtime/m6/hostcall_trampoline.S \
            -o build/objects/hostcall-trampoline.o
          clang -arch x86_64 build/objects/*.o -Wl,-pagezero_size,0x1000 \
            -framework AppKit -framework CoreGraphics -framework ImageIO \
            -o build/host/hrt-m8-hword-input
          file build/host/hrt-m8-hword-input | tee build/proof/host-file.txt
          lipo -info build/host/hrt-m8-hword-input | tee build/proof/host-arch.txt
          codesign --force --sign - --timestamp=none build/host/hrt-m8-hword-input
          codesign --verify --strict build/host/hrt-m8-hword-input

      - name: Run exact HWord through AppKit key and mouse delivery
        run: |
          set -uxo pipefail
          export HRT_M6_CAPTURE_PATH="$PWD/build/proof/pre-frame-window.png"
          export HRT_M7_CAPTURE_PATH="$PWD/build/proof/hword-m8-input-frame.png"
          export HRT_M8_SYNTHETIC_INPUT=1
          : >build/proof/stdout.txt; : >build/proof/stderr.txt
          /usr/bin/arch -x86_64 build/host/hrt-m8-hword-input \
            --root "$HRT_ROOT" --program "$PROGRAM" \
            >build/proof/stdout.txt 2>build/proof/stderr.txt &
          pid=$!; reached=0
          for _ in $(jot 1200); do
            if grep -q 'HRT M7 QPA: BGRA frame accepted' build/proof/stderr.txt 2>/dev/null && \
               grep -q 'HRT M8 QPA: key event delivered' build/proof/stderr.txt 2>/dev/null && \
               grep -q 'HRT M8 QPA: mouse event delivered' build/proof/stderr.txt 2>/dev/null && \
               grep -q 'HRT M8 QPA: input queue drained' build/proof/stderr.txt 2>/dev/null; then
              reached=1; break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 0.05
          done
          if kill -0 "$pid" 2>/dev/null; then
            ps -o pid,ppid,state,%cpu,%mem,etime,command -p "$pid" \
              >build/proof/process.txt 2>&1 || true
            /usr/bin/sample "$pid" 1 1 -file build/proof/sample.txt \
              >/dev/null 2>&1 || true
            kill -TERM "$pid" 2>/dev/null || true
            sleep 0.25
            kill -KILL "$pid" 2>/dev/null || true
          fi
          set +e; wait "$pid"; raw_status=$?; set -e
          printf '%s\n' "$raw_status" >build/proof/raw-exit-status.txt
          printf '%s\n' "$reached" >build/proof/reached-input.txt
          grep -E 'libqhrtappkit|HRT M7 QPA|HRT M8 APPKIT|HRT M8 QPA|host-call opcode=26[0-2]|fatal signal|Qt platform plugin|Linux syscall ENOSYS' \
            build/proof/stderr.txt | tail -n 5000 \
            | tee build/proof/key-lines.txt || true
          cat build/proof/key-lines.txt
          echo "raw-status=$raw_status reached=$reached"
          test "$reached" -eq 1

      - name: Accept only AppKit-originated events delivered into exact HWord Qt
        run: |
          set -euxo pipefail
          stderr=build/proof/stderr.txt
          grep -F 'loaded library "/opt/hnc/hoffice11/Bin/qt/plugins/platforms/libqhrtappkit.so"' "$stderr"
          grep -F 'HRT M7 QPA: BGRA frame accepted' "$stderr"
          grep -F 'HRT M8 APPKIT: input monitor attached' "$stderr"
          grep -F 'HRT M8 APPKIT: posted deterministic synthetic key and mouse events' "$stderr"
          grep -E 'HRT M8 APPKIT: queued key .*action=1' "$stderr"
          grep -E 'HRT M8 APPKIT: queued key .*action=2' "$stderr"
          grep -E 'HRT M8 APPKIT: queued mouse .*action=1' "$stderr"
          grep -E 'HRT M8 APPKIT: queued mouse .*action=2' "$stderr"
          grep -E 'HRT M8 APPKIT: queued mouse .*action=3' "$stderr"
          grep -E 'hrt-m6: host-call opcode=262 result=1' "$stderr"
          grep -E 'hrt-m6: host-call opcode=262 result=0' "$stderr"
          grep -E 'HRT M8 QPA: key event delivered .*action=1' "$stderr"
          grep -E 'HRT M8 QPA: key event delivered .*action=2' "$stderr"
          grep -E 'HRT M8 QPA: mouse event delivered .*action=1' "$stderr"
          grep -E 'HRT M8 QPA: mouse event delivered .*action=2' "$stderr"
          grep -E 'HRT M8 QPA: mouse event delivered .*action=3' "$stderr"
          grep -F 'HRT M8 QPA: input queue drained' "$stderr"
          ! grep -F 'fatal signal' "$stderr"
          test -s build/proof/hword-m8-input-frame.png

          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path

          stderr = Path('build/proof/stderr.txt').read_text(errors='replace')
          key_events = re.findall(r'HRT M8 QPA: key event delivered .*', stderr)
          mouse_events = re.findall(r'HRT M8 QPA: mouse event delivered .*', stderr)
          polls = [
              {'result': int(match.group(1))}
              for match in re.finditer(r'hrt-m6: host-call opcode=262 result=(-?\d+)', stderr)
          ]
          capture = Path('build/proof/hword-m8-input-frame.png')
          lock = json.loads(Path('build/proof/qpa-lock.json').read_text())
          proof = {
              'schema': 1,
              'milestone': 'M8',
              'status': 'PASS',
              'workflow_run': os.environ['GITHUB_RUN_ID'],
              'commit': os.environ['GITHUB_SHA'],
              'program': os.environ['PROGRAM'],
              'program_sha256': os.environ['PROGRAM_SHA256'],
              'rootfs_artifact_id': os.environ['ROOTFS_ARTIFACT_ID'],
              'qpa_sha256': lock['plugin']['sha256_after_prepatch'],
              'input_abi_size': lock['plugin']['input_abi_size'],
              'input_poll_opcode': lock['plugin']['input_poll_opcode'],
              'key_events_delivered': len(key_events),
              'mouse_events_delivered': len(mouse_events),
              'poll_results': polls,
              'capture_sha256': hashlib.sha256(capture.read_bytes()).hexdigest(),
              'proof': 'AppKit NSEvents traversed the M8 queue and QWindowSystemInterface into exact HWord Qt',
          }
          Path('proofs/m8-hword-appkit-input.json').write_text(
              json.dumps(proof, indent=2) + '\n')
          Path('build/proof/summary.json').write_text(
              json.dumps(proof, indent=2) + '\n')
          print(json.dumps(proof, indent=2))
          PY

      - name: Commit the durable M8 proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proofs/m8-hword-appkit-input.json
          git commit -m 'proof: verify M8 exact HWord AppKit key and mouse input'
          for _ in $(seq 1 12); do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hrt-m8-exact-hword-appkit-input-proof
          path: |
            build/host/hrt-m8-hword-input
            build/proof
          if-no-files-found: warn
          retention-days: 14

      - name: Detach the case-sensitive HWord guest
        if: always()
        run: hdiutil detach -quiet "$HRT_ROOT" || true
