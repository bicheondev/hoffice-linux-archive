name: Extract HOffice app icons

on:
  push:
    branches:
      - codex/hoffice-macos-audit
  workflow_dispatch:

permissions:
  contents: read

env:
  ASSET_NAME: hoffice_11.20.0.1520+h1_amd64.deb
  RELEASE_TAG: linux-11.20-series
  EXPECTED_SHA256: 23fc502c430b4dd829fee36740fbce06b819cd51d36fcdf0afbb6fcc5d0b7c46

jobs:
  extract-icons:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download exact release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p work/root work/icons/desktop work/icons/resource
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET_NAME" \
            --dir work
          printf '%s  %s\n' "$EXPECTED_SHA256" "work/$ASSET_NAME" | sha256sum --check -

      - name: Extract official application SVGs
        run: |
          set -euxo pipefail
          dpkg-deb --extract "work/$ASSET_NAME" work/root
          desktop=work/root/usr/share/icons/hicolor/scalable/apps
          cp "$desktop/hoffice11-hcl.svg" work/icons/desktop/
          cp "$desktop/hoffice11-hsl.svg" work/icons/desktop/
          cp "$desktop/hoffice11-hword.svg" work/icons/desktop/
          cp "$desktop/hoffice11-hwp.svg" work/icons/desktop/

          resource=work/root/opt/hnc/hoffice11/Bin/Resource
          cp "$resource/HCell/hoffice11-hcell.svg" work/icons/resource/
          cp "$resource/HShow/hoffice11-hshow.svg" work/icons/resource/
          cp "$resource/Hword/hoffice11-hword.svg" work/icons/resource/hoffice11-hword-resource.svg
          cp "$resource/Hwp/hoffice11-hwp.svg" work/icons/resource/hoffice11-hwp-resource.svg

          file work/icons/desktop/* work/icons/resource/*
          find work/icons -type f -name '*.svg' -print0 | sort -z | xargs -0 sha256sum > work/icons/SHA256SUMS

      - name: Upload exact icon sources
        uses: actions/upload-artifact@v4
        with:
          name: hoffice-11.20.0.1520-h1-official-icons
          path: work/icons
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
