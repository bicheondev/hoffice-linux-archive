name: HOffice runtime M9 after provider-string boundary

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
    paths:
      - 'diagnostics/m9-hword-provider-string-latest.json'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: hrt-m9-after-provider-string-${{ github.ref }}
  cancel-in-progress: true

env:
  ROOTFS_ARTIFACT_ID: '8968324706'
  ROOTFS_ARTIFACT_SHA256: 3e301d3c6269926c62804bff18671136fcf8c0b0b22b3952072e427a8fa9918a
  ROOTFS_ARCHIVE_SHA256: 322fcf228092b296a34edbfa7ee43f9a7b237d5bcedaee50109ac4bb44d9ca28
  QPA_RUN_ID: '31166152504'
  ASSET_NAME: hoffice_11.20.0.1520+h1_amd64.deb
  RELEASE_TAG: linux-11.20-series
  PACKAGE_SHA256: 23fc502c430b4dd829fee36740fbce06b819cd51d36fcdf0afbb6fcc5d0b7c46
  PROGRAM: /opt/hnc/hoffice11/Bin/hword
  PROGRAM_SHA256: 55876ea7d0c20e73d936af11cc3623c418acb09d61bde5bfeecafa1da7a9b5cb
  PLUGIN_GUEST: /opt/hnc/hoffice11/Bin/qt/plugins/platforms/libqhrtappkit.so

jobs:
  classify-next-boundary:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock the selected provider override
        run: |
          set -euxo pipefail
          test -s diagnostics/m9-hword-provider-string-latest.json
          python3 - <<'PY'
          import json,pathlib
          source=pathlib.Path(
              'diagnostics/m9-hword-provider-string-latest.json')
          data=json.loads(source.read_text())
          best=data['best_candidate']
          abi=data['method_abi']['abi']
          target=data['method_target']
          assert best['override_hits']>0,best
          assert not best['substr_exception'],best
          value=best['value']
          assert value.isascii() and len(value.encode('ascii'))<=15,value
          assert abi in ('this-rdi-out-rsi','sret-rdi-this-rsi'),abi
          pathlib.Path('build/proof').mkdir(parents=True,exist_ok=True)
          pathlib.Path('build/proof/selected-value.txt').write_text(value+'\n')
          pathlib.Path('build/proof/method-abi.txt').write_text(abi+'\n')
          pathlib.Path('build/proof/method-target.json').write_text(
              json.dumps(target,indent=2)+'\n')
          pathlib.Path('build/proof/source-provider-result.json').write_text(
              json.dumps(data,indent=2)+'\n')
          print(json.dumps({'value':value,'abi':abi,'target':target},indent=2))
          PY

      - name: Download the verified Qt 5.11.3 hrtappkit QPA
        uses: actions/download-artifact@v4
        with:
          name: hrt-m8-qt5113-hrtappkit-input-qpa
          path: build/input/qpa
          repository: ${{ github.repository }}
          run-id: ${{ env.QPA_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download and verify exact HWord inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p build/input/hword build/input/deb build/generated \
                   build/objects build/host build/logs
          curl --fail --location --retry 5 --retry-delay 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ROOTFS_ARTIFACT_ID/zip" \
            -o build/input/hword-artifact.zip
          printf '%s  %s\n' "$ROOTFS_ARTIFACT_SHA256" \
            build/input/hword-artifact.zip | shasum -a 256 -c -
          ditto -x -k build/input/hword-artifact.zip build/input/hword
          printf '%s  %s\n' "$ROOTFS_ARCHIVE_SHA256" \
            build/input/hword/hword-rootfs.tar.gz | shasum -a 256 -c -
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_NAME" \
            --dir build/input/deb
          printf '%s  %s\n' "$PACKAGE_SHA256" \
            "build/input/deb/$ASSET_NAME" | shasum -a 256 -c -

      - name: Reconstruct and enrich the exact case-sensitive guest
        run: |
          set -euxo pipefail
          image="$RUNNER_TEMP/hrt-m9-after-provider.sparsebundle"
          root="/tmp/h9n-$GITHUB_RUN_ID"
          rm -rf "$image" "$root"; mkdir -p "$root"
          if ! hdiutil create -quiet -size 12g -fs APFSX \
               -volname HRTM9N -type SPARSEBUNDLE "$image"; then
            rm -rf "$image"
            hdiutil create -quiet -size 12g -fs HFSX \
              -volname HRTM9N -type SPARSEBUNDLE "$image"
          fi
          hdiutil attach -quiet -nobrowse -mountpoint "$root" "$image"
          echo "HRT_ROOT=$root" >>"$GITHUB_ENV"
          echo "HRT_IMAGE=$image" >>"$GITHUB_ENV"
          tar -xzf build/input/hword/hword-rootfs.tar.gz -C "$root"
          test -s "$root/.hrt-prepatched-v1"
          test -f "$root$PROGRAM"

          deb="build/input/deb/$ASSET_NAME"
          data_member=$(ar t "$deb" | awk '/^data\.tar/{print; exit}')
          test -n "$data_member"
          ar p "$deb" "$data_member" >"build/input/deb/$data_member"
          tar -xf "build/input/deb/$data_member" -C "$root" \
            ./opt/hnc/hoffice11/Shared/Fonts \
            ./opt/hnc/hoffice11/Shared/TTF
          rm -f "$root/opt/hnc/hoffice1"
          ln -s hoffice11 "$root/opt/hnc/hoffice1"
          test -f "$root/opt/hnc/hoffice1/Shared/Fonts/HGSMJ.HFT"

          mkdir -p "$root$(dirname "$PLUGIN_GUEST")"
          python3 - build/input/qpa/libqhrtappkit.so.xz \
            build/input/qpa/lock.json "$root$PLUGIN_GUEST" <<'PY'
          import hashlib,json,lzma,pathlib,sys
          compressed=pathlib.Path(sys.argv[1]).read_bytes()
          lock=json.loads(pathlib.Path(sys.argv[2]).read_text())
          assert hashlib.sha256(compressed).hexdigest()==lock['plugin']['xz_sha256']
          plugin=lzma.decompress(compressed)
          assert hashlib.sha256(plugin).hexdigest()==lock['plugin']['sha256_after_prepatch']
          pathlib.Path(sys.argv[3]).write_bytes(plugin)
          pathlib.Path('build/proof/qpa-lock.json').write_text(
              json.dumps(lock,indent=2)+'\n')
          PY
          chmod 0755 "$root$PLUGIN_GUEST"

          python3 - "$root" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          target=json.loads(pathlib.Path(
              'build/proof/method-target.json').read_text())
          path=root/target['guest_path'].lstrip('/')
          assert path.is_file(),path
          actual=hashlib.sha256(path.read_bytes()).hexdigest()
          assert actual==target['object_sha256_before_probe'],(actual,target)
          pathlib.Path('build/proof/method-guest-path.txt').write_text(
              target['guest_path']+'\n')
          pathlib.Path('build/proof/method-file-offset.txt').write_text(
              str(target['file_offset'])+'\n')
          PY
          guest_path=$(cat build/proof/method-guest-path.txt)
          file_offset=$(cat build/proof/method-file-offset.txt)
          python3 runtime/m9/patch_elf_int3_at_offset.py \
            "$root$guest_path" --file-offset "$file_offset" \
            --label 'provider-vtable+0x130' --signature-length 24 \
            --manifest build/proof/method-int3-manifest.json
          diskutil info "$root" | tee build/proof/guest-volume.txt
          grep -F 'Case-sensitive' build/proof/guest-volume.txt

      - name: Generate the mature bridge with deep diagnostics
        run: |
          set -euxo pipefail
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          abi=$(cat build/proof/method-abi.txt)
          value=$(cat build/proof/selected-value.txt)
          python3 runtime/m8/augment_appkit_adapter_input.py \
            runtime/m6/appkit_adapter.m build/generated/appkit_adapter_m8.m
          python3 runtime/m6/augment_stack_hrtappkit.py \
            runtime/m3/stack.c build/generated/stack.c
          python3 runtime/m3/augment_syscalls.py \
            runtime/m3/syscall_bridge.c build/generated/stage1.c
          python3 runtime/m3/augment_directory_syscalls.py \
            build/generated/stage1.c build/generated/stage2.c
          python3 runtime/m3/augment_directory_stream.py \
            build/generated/stage2.c build/generated/stage3.c
          python3 runtime/m3/augment_pipe2.py \
            build/generated/stage3.c build/generated/stage4.c
          python3 runtime/m3/augment_eventfd2.py \
            build/generated/stage4.c build/generated/stage5.c
          python3 runtime/m3/augment_crash_signals.py \
            build/generated/stage5.c build/generated/stage6.c
          python3 runtime/m3/augment_poll.py \
            build/generated/stage6.c build/generated/stage7.c
          python3 runtime/m3/augment_posix_basics.py \
            build/generated/stage7.c build/generated/stage8.c
          python3 runtime/m3/augment_connect.py \
            build/generated/stage8.c build/generated/stage9.c
          python3 runtime/m6/augment_appkit_hostcall_deferred.py \
            build/generated/stage9.c build/generated/stage10.c
          python3 runtime/m3/augment_darwin_syscall_abi.py \
            build/generated/stage10.c build/generated/stage11.c
          python3 runtime/m9/augment_path_trace.py \
            build/generated/stage11.c build/generated/stage12.c
          python3 runtime/m9/augment_exec_mmap_trace.py \
            build/generated/stage12.c build/generated/stage13.c
          python3 runtime/m9/augment_int3_string_override.py \
            build/generated/stage13.c \
            build/proof/method-int3-manifest.json \
            build/generated/syscall_bridge.c \
            --abi "$abi" --value "$value"
          python3 - <<'PY'
          from pathlib import Path
          path=Path('build/generated/syscall_bridge.c')
          path.write_text(path.read_text().replace(
              '#define M3_TRACE_LIMIT 256u','#define M3_TRACE_LIMIT 120000u'))
          PY
          grep -Fq 'HRT M9 METHOD OVERRIDE:' \
            build/generated/syscall_bridge.c
          grep -Fq 'HRT M9 PATH:' build/generated/syscall_bridge.c
          grep -Fq 'HRT M9 MAP:' build/generated/syscall_bridge.c

      - name: Compile and sign the deep-observation runtime
        run: |
          set -euxo pipefail
          common=(-arch x86_64 -std=c17 -O2 -g -fno-stack-protector \
            -fno-omit-frame-pointer -Wall -Wextra -Werror -Wpedantic \
            -Wno-unused-function -Wno-unused-variable \
            -Iruntime/m8 -Iruntime/m6 -Iruntime/m3 -Iruntime/m1)
          index=0
          for source in runtime/m6/main.c runtime/m6/hostcall_trampoline.c \
            runtime/m1/common.c runtime/m3/elf_map.c build/generated/stack.c \
            runtime/m3/patch.c build/generated/syscall_bridge.c; do
            clang "${common[@]}" -c "$source" \
              -o "build/objects/c-${index}.o"
            index=$((index+1))
          done
          clang -arch x86_64 -std=c17 -O2 -g -fobjc-arc \
            -Wall -Wextra -Werror -Wpedantic -Iruntime/m8 -Iruntime/m6 \
            -c build/generated/appkit_adapter_m8.m \
            -o build/objects/appkit-adapter.o
          clang -arch x86_64 -std=c17 -O2 -g -fobjc-arc \
            -Wall -Wextra -Werror -Wpedantic -Iruntime/m8 -Iruntime/m6 \
            -c runtime/m8/appkit_input.m -o build/objects/appkit-input.o
          clang -arch x86_64 -g -c runtime/m1/enter_guest.S \
            -o build/objects/enter-guest.o
          clang -arch x86_64 -g -c runtime/m6/hostcall_trampoline.S \
            -o build/objects/hostcall-trampoline.o
          clang -arch x86_64 build/objects/*.o -Wl,-pagezero_size,0x1000 \
            -framework AppKit -framework CoreGraphics -framework ImageIO \
            -o build/host/hrt-m9-after-provider-string
          file build/host/hrt-m9-after-provider-string \
            | tee build/proof/host-file.txt
          codesign --force --sign - --timestamp=none \
            build/host/hrt-m9-after-provider-string
          codesign --verify --strict \
            build/host/hrt-m9-after-provider-string

      - name: Run exact HWord through the next stable boundary
        run: |
          set -uxo pipefail
          export HRT_M6_CAPTURE_PATH="$PWD/build/logs/pre-frame.png"
          export HRT_M7_CAPTURE_PATH="$PWD/build/logs/frame.png"
          unset HRT_M8_SYNTHETIC_INPUT
          : >build/logs/stdout.txt; : >build/logs/stderr.txt
          /usr/bin/arch -x86_64 build/host/hrt-m9-after-provider-string \
            --root "$HRT_ROOT" --program "$PROGRAM" \
            >build/logs/stdout.txt 2>build/logs/stderr.txt &
          pid=$!
          reached_deadline=1
          observed_frame=0
          for _ in $(jot 800); do
            if grep -q 'HRT M7 QPA: BGRA frame accepted' \
                 build/logs/stderr.txt 2>/dev/null; then
              observed_frame=1
              sleep 3
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              reached_deadline=0
              break
            fi
            sleep 0.05
          done
          if kill -0 "$pid" 2>/dev/null; then
            ps -o pid,ppid,state,%cpu,%mem,etime,command -p "$pid" \
              >build/logs/process.txt 2>&1 || true
            /usr/bin/sample "$pid" 2 1 -file build/logs/sample.txt \
              >/dev/null 2>&1 || true
            kill -TERM "$pid" 2>/dev/null || true
            sleep 0.25
            kill -KILL "$pid" 2>/dev/null || true
          fi
          set +e; wait "$pid"; raw_status=$?; set -e
          printf '%s\n' "$raw_status" >build/logs/raw-exit-status.txt
          printf '%s\n' "$reached_deadline" \
            >build/logs/reached-deadline.txt
          printf '%s\n' "$observed_frame" \
            >build/logs/observed-frame.txt
          grep -E 'HRT M9 METHOD OVERRIDE:|HRT M6 QPA: CREATE |HRT M7 QPA: BGRA frame accepted|fatal signal|terminate called|what\(\):|Linux syscall ENOSYS' \
            build/logs/stderr.txt | tail -n 12000 \
            | tee build/logs/key-lines.txt || true
          grep -F 'HRT M9 PATH:' build/logs/stderr.txt \
            | tail -n 10000 >build/logs/path-lines.txt || true
          tail -n 4000 build/logs/stderr.txt \
            >build/logs/stderr-tail.txt
          cat build/logs/key-lines.txt

      - name: Persist the next exact HWord boundary
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re
          stderr=pathlib.Path('build/logs/stderr.txt').read_text(errors='replace')
          stdout=pathlib.Path('build/logs/stdout.txt').read_text(errors='replace')
          titles=[]; geometries=[]
          for line in re.findall(r'HRT M6 QPA: CREATE .*',stderr):
              title=re.search(r' title=(.*?) handle=',line)
              geometry=re.search(r' geometry=(\d+)x(\d+)',line)
              if title: titles.append(title.group(1))
              if geometry: geometries.append([
                  int(geometry.group(1)),int(geometry.group(2))])
          fatal_lines=[line for line in stderr.splitlines()
                       if 'fatal signal' in line]
          exceptions=[]
          lines=stderr.splitlines()
          for index,line in enumerate(lines):
              if ('terminate called after throwing' in line or
                  line.strip().startswith('what():') or
                  'what():' in line):
                  exceptions.append('\n'.join(lines[max(0,index-2):index+3]))
          unknown=sorted({int(number) for number in re.findall(
              r'Linux syscall ENOSYS (\d+)',stderr)})
          source=json.loads(pathlib.Path(
              'build/proof/source-provider-result.json').read_text())
          frame=pathlib.Path('build/logs/frame.png')
          frame_present=frame.is_file() and frame.stat().st_size>0
          reached_deadline=bool(int(pathlib.Path(
              'build/logs/reached-deadline.txt').read_text()))
          substr_exception=(
              'basic_string::substr' in stderr or
              '__pos (which is %zu) > this->size()' in stderr)
          if frame_present:
              classification='NATIVE_FRAME_AFTER_PROVIDER_STRING'
              status='PASS'
          elif titles:
              classification='NATIVE_WINDOW_AFTER_PROVIDER_STRING'
              status='PASS'
          elif reached_deadline:
              classification='PROCESS_SURVIVED_OBSERVATION_WINDOW'
              status='PASS'
          elif not substr_exception:
              classification='NEW_POST_PROVIDER_BOUNDARY'
              status='ADVANCED'
          else:
              classification='PROVIDER_SUBSTR_BOUNDARY_RECURRED'
              status='DIAGNOSTIC'
          result={
              'schema':1,
              'milestone':'M9-after-provider-string',
              'status':status,
              'classification':classification,
              'workflow_run':os.environ['GITHUB_RUN_ID'],
              'commit':os.environ['GITHUB_SHA'],
              'program':os.environ['PROGRAM'],
              'program_sha256':os.environ['PROGRAM_SHA256'],
              'selected_value':pathlib.Path(
                  'build/proof/selected-value.txt').read_text().strip(),
              'method_abi':pathlib.Path(
                  'build/proof/method-abi.txt').read_text().strip(),
              'override_hits':stderr.count('HRT M9 METHOD OVERRIDE:'),
              'substr_exception':substr_exception,
              'window_titles':titles,
              'window_geometries':geometries,
              'frame_present':frame_present,
              'frame_sha256':hashlib.sha256(frame.read_bytes()).hexdigest()
                  if frame_present else None,
              'reached_deadline':reached_deadline,
              'raw_exit_status':int(pathlib.Path(
                  'build/logs/raw-exit-status.txt').read_text()),
              'fatal_signal_lines':fatal_lines,
              'exception_contexts':exceptions,
              'unknown_syscalls':unknown,
              'path_trace_count':stderr.count('HRT M9 PATH:'),
              'executable_mapping_count':stderr.count('HRT M9 MAP:'),
              'syscall_trace_count':len(re.findall(r'hrt-m3: syscall \d+ ',stderr)),
              'stderr_lines':len(stderr.splitlines()),
              'stderr_sha256':hashlib.sha256(stderr.encode()).hexdigest(),
              'stdout_sha256':hashlib.sha256(stdout.encode()).hexdigest(),
              'source_candidate_result':source,
              'stderr_tail':lines[-300:],
          }
          payload=json.dumps(result,indent=2)+'\n'
          pathlib.Path('diagnostics').mkdir(exist_ok=True)
          pathlib.Path(
              f"diagnostics/m9-hword-after-provider-string-{os.environ['GITHUB_RUN_ID']}.json"
          ).write_text(payload)
          pathlib.Path(
              'diagnostics/m9-hword-after-provider-string-latest.json').write_text(payload)
          pathlib.Path(
              'diagnostics/m9-hword-after-provider-string-latest.md').write_text(
              '# HWord after provider-string boundary\n\n'
              f"- Status: `{status}`\n"
              f"- Classification: `{classification}`\n"
              f"- Selected value: `{result['selected_value']}`\n"
              f"- Override hits: `{result['override_hits']}`\n"
              f"- Original `substr(3)` exception recurred: `{substr_exception}`\n"
              f"- Native windows: `{titles}`\n"
              f"- BGRA frame: `{frame_present}`\n"
              f"- Unknown syscalls: `{unknown}`\n"
              f"- Fatal signals: `{fatal_lines}`\n"
          )
          if frame_present:
              pathlib.Path('proofs').mkdir(exist_ok=True)
              pathlib.Path(
                  'proofs/m9-hword-after-provider-string-frame.json').write_text(payload)
          pathlib.Path('build/proof/final-summary.json').write_text(payload)
          print(payload)
          PY

      - name: Commit the durable next-boundary result
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin codex/hoffice-runtime-from-scratch
          git add diagnostics/m9-hword-after-provider-string-*.json \
                  diagnostics/m9-hword-after-provider-string-latest.md
          if test -f proofs/m9-hword-after-provider-string-frame.json; then
            git add proofs/m9-hword-after-provider-string-frame.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'diagnostic: classify exact HWord after provider string'
            git push origin HEAD:codex/hoffice-runtime-from-scratch
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hrt-m9-after-provider-string-proof
          path: |
            build/host/hrt-m9-after-provider-string
            build/proof
            build/logs
            diagnostics/m9-hword-after-provider-string-*.json
            diagnostics/m9-hword-after-provider-string-latest.md
            proofs/m9-hword-after-provider-string-frame.json
          if-no-files-found: warn
          retention-days: 14

      - name: Detach the exact HWord guest
        if: always()
        run: hdiutil detach -quiet "$HRT_ROOT" || true
