name: HOffice runtime M11 HWord open-callsite replay

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
    paths:
      - '.github/workflows/hoffice-runtime-m11-openctx-replay.yml'
      - 'runtime/m11/augment_hword_document_io_trace_v2.py'
      - 'runtime/m11/augment_hword_document_io_trace_v3.py'
      - 'runtime/m11/augment_hword_document_io_trace_v4.py'
      - 'runtime/m11/augment_hword_document_io_trace_v5.py'
      - 'runtime/m11/augment_hword_document_io_trace_v6.py'
      - 'runtime/m11/run_korean_title_staged_replay.sh'
      - 'runtime/m11/augment_full_product_replay.py'
      - 'runtime/m11/augment_full_product_replay_v2.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: hrt-m11-hword-openctx-${{ github.ref }}
  cancel-in-progress: true

env:
  PREPARED_RUN_ID: '31235068358'
  HOST_RUN_ID: '31398654109'
  HOST_ARTIFACT_DIGEST: c5072f673429ff912af82e1011eb1841b249db68ad9e72fa5b5a24f165751613
  QPA_RUN_ID: '31305695836'
  QPA_ARTIFACT_DIGEST: 8b2552ed25ce79626dcc90d55c2fcc6263b39ded64abac5ce5d7f639640df9ee
  ASSET_NAME: hoffice_11.20.0.1520+h1_amd64.deb
  RELEASE_TAG: linux-11.20-series
  PACKAGE_SHA256: 23fc502c430b4dd829fee36740fbce06b819cd51d36fcdf0afbb6fcc5d0b7c46
  PROGRAM: /opt/hnc/hoffice11/Bin/hword
  PROGRAM_SHA256: 55876ea7d0c20e73d936af11cc3623c418acb09d61bde5bfeecafa1da7a9b5cb
  HWORD_APP_GUEST: /opt/hnc/hoffice11/Bin/libHwordApp.so
  HWORD_APP_SHA256: e8523db3ae977771dddc8fbc5ac03c1a3410b28629e4136d31583a31c3806d50
  HWORD_APP_PATCHED_SHA256: ccceee82d4f5a97d8f52286a6cc8aa753c9ef44b2d484627291361645be27fd8
  PLUGIN_GUEST: /opt/hnc/hoffice11/Bin/qt/plugins/platforms/libqhrtappkit.so

jobs:
  replay-open-callsite:
    runs-on: macos-14
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the verified Korean HWord frontier
        run: |
          set -euxo pipefail
          test -s proofs/m10-hword-culture-resource-window.json
          grep -F '"status": "PASS"' \
            proofs/m10-hword-culture-resource-window.json
          test -s proofs/m10-clone-chdir.json
          grep -F '"status": "PASS"' proofs/m10-clone-chdir.json

      - name: Replay the exact product closure with canonical frame tracing
        env:
          GH_TOKEN: ${{ github.token }}
          HRT_M11_MODAL_CAPTURE_PATH: ${{ github.workspace }}/build/proof/hword-modal-dialog.png
        run: |
          set -euxo pipefail
          mkdir -p build/generated
          python3 runtime/m11/augment_full_product_replay_v2.py \
            runtime/m11/run_korean_title_staged_replay.sh \
            build/generated/run_korean_title_framectx.sh
          test -x build/generated/run_korean_title_framectx.sh
          build/generated/run_korean_title_framectx.sh

      - name: Resolve empty-path opens through canonical saved-frame returns
        if: always()
        run: |
          set -euxo pipefail
          test -f build/proof/stderr.txt
          grep -F 'HRT M11 OPENCTX:' build/proof/stderr.txt \
            >build/proof/open-context-lines.txt || true
          grep -F 'HRT M11 FRAMECTX:' build/proof/stderr.txt \
            >build/proof/frame-context-lines.txt || true
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          stderr_path = Path('build/proof/stderr.txt')
          stderr = stderr_path.read_text(errors='replace') \
              if stderr_path.is_file() else ''
          lines = stderr.splitlines()
          open_lines = [line for line in lines
                        if line.startswith('HRT M11 DOCIO:') and ' op=open ' in line]
          open_contexts = [line for line in lines
                           if line.startswith('HRT M11 OPENCTX:')]
          frame_contexts = [line for line in lines
                            if line.startswith('HRT M11 FRAMECTX:')]

          pairs = []
          pending = None
          for line in lines:
              if line.startswith('HRT M11 DOCIO:') and ' op=open ' in line:
                  pending = {'open': line}
                  continue
              if pending is None:
                  continue
              if line.startswith('HRT M11 OPENCTX:'):
                  pending['open_context'] = line
                  continue
              if not line.startswith('HRT M11 FRAMECTX:'):
                  continue

              pending['frame_context'] = line
              rbps = dict(re.findall(
                  r'frame(\d+)-rbp=(0x[0-9a-f]+)', line))
              saved = dict(re.findall(
                  r'frame(\d+)-saved=(0x[0-9a-f]+)', line))
              returned = dict(re.findall(
                  r'frame(\d+)-return=(0x[0-9a-f]+)', line))
              objects = dict(re.findall(
                  r'frame(\d+)-return-object=(\S+)', line))
              offsets = dict(re.findall(
                  r'frame(\d+)-return-file-offset=(0x[0-9a-f]+)', line))

              indices = sorted(
                  {int(value) for value in rbps} |
                  {int(value) for value in returned})
              frames = []
              for index in indices:
                  key = str(index)
                  frames.append({
                      'index': index,
                      'rbp': rbps.get(key),
                      'saved_rbp': saved.get(key),
                      'return_address': returned.get(key),
                      'object': objects.get(key, '(unmapped)'),
                      'file_offset': offsets.get(key),
                  })

              non_runtime = [
                  frame for frame in frames
                  if frame['object'] not in {
                      '(unmapped)',
                      '/lib/x86_64-linux-gnu/libc.so.6',
                      '/lib64/ld-linux-x86-64.so.2',
                  }
              ]
              hoffice = [
                  frame for frame in frames
                  if frame['object'].startswith('/opt/hnc/hoffice11/')
              ]
              pending.update({
                  'canonical_frames': frames,
                  'first_non_runtime_frame':
                      non_runtime[0] if non_runtime else None,
                  'first_hoffice_frame':
                      hoffice[0] if hoffice else None,
              })
              pairs.append(pending)
              pending = None

          empty_pairs = [item for item in pairs
                         if re.search(r' guest=(?:\s|$)', item['open'])]
          payload = {
              'schema': 3,
              'host_run': '31398654109',
              'host_artifact_digest':
                  'c5072f673429ff912af82e1011eb1841b249db68ad9e72fa5b5a24f165751613',
              'frame_limit_expected': 8,
              'open_line_count': len(open_lines),
              'open_context_count': len(open_contexts),
              'frame_context_count': len(frame_contexts),
              'paired_count': len(pairs),
              'empty_path_pairs': empty_pairs,
              'empty_path_first_hoffice_frames': [
                  item['first_hoffice_frame'] for item in empty_pairs
              ],
              'all_empty_paths_have_canonical_frames': bool(empty_pairs) and all(
                  item['canonical_frames'] for item in empty_pairs),
          }
          Path('build/proof/frame-context-summary.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8')
          print(json.dumps(payload, ensure_ascii=False, indent=2))

          if empty_pairs:
              assert all(item.get('frame_context') for item in empty_pairs), \
                  'an empty-path open lacks canonical frame context'
              assert all(item['canonical_frames'] for item in empty_pairs), \
                  'canonical frame walk returned no frame'
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hrt-m11-hword-frame-callsite-proof
          path: |
            build/generated/run_korean_title_framectx.sh
            build/host/hrt-m11-korean-staged
            build/proof
            diagnostics/m11-korean-title-staged-*.json
          if-no-files-found: warn
          retention-days: 14
