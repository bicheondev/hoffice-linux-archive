name: Stabilize the M10 filesystem path tracer

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
    paths:
      - '.github/workflows/hoffice-runtime-m10-stabilize-fs-trace.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: hrt-m10-stabilize-fs-trace-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_BRANCH: codex/hoffice-runtime-from-scratch
  TARGET_WORKFLOW: hoffice-runtime-m10-hword-fs-compat.yml
  LOCKED_PATH_TRACE_COMMIT: 988d710703f11747f1cd50e3dd7da2f63e25d1eb

jobs:
  stabilize-and-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize the locked path tracer into the current tree
        run: |
          set -euxo pipefail
          mkdir -p runtime/m10
          git show \
            "$LOCKED_PATH_TRACE_COMMIT:runtime/m9/augment_path_trace.py" \
            >runtime/m10/augment_path_trace_base.py
          chmod +x runtime/m10/augment_path_trace_base.py
          python3 -m py_compile runtime/m10/augment_path_trace_base.py
          grep -F 'HRT M9 PATH:' runtime/m10/augment_path_trace_base.py
          grep -F 'm9_trace_path("open"' runtime/m10/augment_path_trace_base.py

      - name: Replace the composed wrapper with a shallow-clone-safe version
        run: |
          set -euxo pipefail
          target=runtime/m10/augment_fs_compat.py
          base=runtime/m10/augment_fs_compat_base.py
          test -s "$base"
          cat >"$target" <<'PY'
          #!/usr/bin/env python3
          """Compose the locked M10 filesystem, eventfd2, and path bridges.

          All three augmenter implementations are materialized in the current
          tree.  The target workflow therefore needs no historical Git objects
          and remains reproducible under actions/checkout's shallow default.
          """
          from __future__ import annotations

          import importlib.util
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tempfile

          HRT_M10_FS_SELF_CONTAINED_TRACE_V3 = True


          def run_module(path: Path, argv: list[str]) -> None:
              spec = importlib.util.spec_from_file_location(
                  'hrt_composed_' + path.stem, path)
              if spec is None or spec.loader is None:
                  raise SystemExit(f'unable to load {path}')
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              previous = sys.argv
              try:
                  sys.argv = [str(path), *argv]
                  module.main()
              finally:
                  sys.argv = previous


          def main() -> int:
              if len(sys.argv) != 3:
                  print(f'usage: {sys.argv[0]} INPUT.c OUTPUT.c', file=sys.stderr)
                  return 64
              source = Path(sys.argv[1])
              output = Path(sys.argv[2])
              here = Path(__file__).resolve()
              filesystem = here.with_name('augment_fs_compat_base.py')
              eventfd = here.parents[1] / 'm3' / 'augment_eventfd2.py'
              path_trace = here.with_name('augment_path_trace_base.py')
              for required in (filesystem, eventfd, path_trace):
                  if not required.is_file():
                      raise SystemExit(f'missing composed augmenter: {required}')

              with tempfile.TemporaryDirectory(prefix='hrt-m10-composed-') as tmp:
                  directory = Path(tmp)
                  stage1 = directory / 'filesystem.c'
                  stage2 = directory / 'eventfd2.c'
                  run_module(filesystem, [str(source), str(stage1)])
                  first = stage1.read_text(encoding='utf-8')
                  if ('case LINUX_SYS_EVENTFD2:' in first and
                      'host_eventfd2_bridge' in first):
                      shutil.copy2(stage1, stage2)
                  else:
                      subprocess.run(
                          [sys.executable, str(eventfd),
                           str(stage1), str(stage2)], check=True)
                  second = stage2.read_text(encoding='utf-8')
                  if 'HRT M9 PATH:' in second:
                      shutil.copy2(stage2, output)
                  else:
                      run_module(path_trace, [str(stage2), str(output)])

              final = output.read_text(encoding='utf-8')
              requirements = {
                  'case LINUX_SYS_RENAME:': 1,
                  'case LINUX_SYS_EVENTFD2:': 1,
                  'host_eventfd2_bridge': 2,
                  'HRT M9 PATH:': 1,
                  'm9_trace_path("open"': 1,
                  'm9_trace_path("fstatat"': 1,
              }
              for marker, minimum in requirements.items():
                  count = final.count(marker)
                  if count < minimum:
                      raise SystemExit(
                          f'generated marker {marker!r}: expected at least '
                          f'{minimum}, found {count}')
              return 0


          if __name__ == '__main__':
              raise SystemExit(main())
          PY
          chmod +x "$target"
          python3 -m py_compile "$target"
          grep -F 'HRT_M10_FS_SELF_CONTAINED_TRACE_V3' "$target"

      - name: Commit with conflict retry
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runtime/m10/augment_fs_compat.py \
                  runtime/m10/augment_fs_compat_base.py \
                  runtime/m10/augment_path_trace_base.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'runtime: make M10 filesystem tracing self-contained'
          for attempt in $(seq 1 16); do
            if git push origin "HEAD:$TARGET_BRANCH"; then exit 0; fi
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH"
            sleep "$attempt"
          done
          exit 1

      - name: Dispatch the stabilized exact-HWord replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh workflow run "$TARGET_WORKFLOW" \
            --repo "$GITHUB_REPOSITORY" --ref "$TARGET_BRANCH"
