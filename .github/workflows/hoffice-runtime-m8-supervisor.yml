name: HOffice runtime M8 pipeline supervisor

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
    paths:
      - '.github/workflows/hoffice-runtime-m8-supervisor.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: hrt-m8-pipeline-supervisor-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_BRANCH: codex/hoffice-runtime-from-scratch
  PUBLISH_WORKFLOW: hoffice-runtime-m6-qpa-publish.yml
  REPLAY_WORKFLOW: hoffice-runtime-m8-hword-appkit-input.yml

jobs:
  supervise:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Clone the exact target branch without a hosted checkout action
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --single-branch \
            --branch "$TARGET_BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          git -C repo config user.name github-actions[bot]
          git -C repo config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Dispatch, wait for, and verify the M8 pipeline
        id: pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p repo/diagnostics build
          started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          list_latest_run() {
            local workflow=$1
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=${TARGET_BRANCH}&per_page=20" \
              --jq '.workflow_runs | map(select(.status != "queued" or .event == "workflow_dispatch" or .event == "push")) | .[0] // empty'
          }

          wait_for_new_run() {
            local workflow=$1
            local before=$2
            local run_id=""
            for _ in $(seq 1 120); do
              run_id=$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=${TARGET_BRANCH}&per_page=20" \
                --jq --argjson before "$before" \
                '[.workflow_runs[] | select(.id > $before)] | sort_by(.id) | reverse | .[0].id // empty')
              if [ -n "$run_id" ]; then
                printf '%s\n' "$run_id"
                return 0
              fi
              sleep 2
            done
            return 1
          }

          wait_for_completion() {
            local run_id=$1
            local limit=$2
            local state conclusion
            for _ in $(seq 1 "$limit"); do
              state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .status)
              conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // ""')
              printf 'run=%s status=%s conclusion=%s\n' "$run_id" "$state" "$conclusion"
              if [ "$state" = completed ]; then
                printf '%s\n' "$conclusion"
                return 0
              fi
              sleep 10
            done
            return 1
          }

          latest_publish=$(list_latest_run "$PUBLISH_WORKFLOW" || true)
          publish_before=$(printf '%s' "$latest_publish" | jq -r '.id // 0')
          publish_id=$publish_before
          publish_status=$(printf '%s' "$latest_publish" | jq -r '.status // "missing"')
          publish_conclusion=$(printf '%s' "$latest_publish" | jq -r '.conclusion // ""')

          if [ "$publish_status" != completed ] || [ "$publish_conclusion" != success ]; then
            gh api -X POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${PUBLISH_WORKFLOW}/dispatches" \
              -f ref="$TARGET_BRANCH"
            publish_id=$(wait_for_new_run "$PUBLISH_WORKFLOW" "$publish_before")
            publish_conclusion=$(wait_for_completion "$publish_id" 240)
          fi

          publish_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${publish_id}"
          if [ "$publish_conclusion" != success ]; then
            jq -n \
              --arg status FAIL \
              --arg stage qpa-publish \
              --arg started_at "$started_at" \
              --argjson publish_run "$publish_id" \
              --arg publish_url "$publish_url" \
              --arg conclusion "$publish_conclusion" \
              '{schema:1,status:$status,stage:$stage,started_at:$started_at,publish_run:$publish_run,publish_url:$publish_url,publish_conclusion:$conclusion}' \
              >repo/diagnostics/m8-pipeline-supervisor.json
            echo 'pipeline_ok=0' >>"$GITHUB_OUTPUT"
            exit 0
          fi

          git -C repo fetch origin "$TARGET_BRANCH"
          git -C repo reset --hard "origin/$TARGET_BRANCH"

          latest_replay=$(list_latest_run "$REPLAY_WORKFLOW" || true)
          replay_before=$(printf '%s' "$latest_replay" | jq -r '.id // 0')
          replay_id=$replay_before
          replay_status=$(printf '%s' "$latest_replay" | jq -r '.status // "missing"')
          replay_conclusion=$(printf '%s' "$latest_replay" | jq -r '.conclusion // ""')

          if [ ! -s repo/proofs/m8-hword-appkit-input.json ] || \
             [ "$replay_status" != completed ] || [ "$replay_conclusion" != success ]; then
            gh api -X POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${REPLAY_WORKFLOW}/dispatches" \
              -f ref="$TARGET_BRANCH"
            replay_id=$(wait_for_new_run "$REPLAY_WORKFLOW" "$replay_before")
            replay_conclusion=$(wait_for_completion "$replay_id" 300)
          fi

          replay_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${replay_id}"
          git -C repo fetch origin "$TARGET_BRANCH"
          git -C repo reset --hard "origin/$TARGET_BRANCH"

          proof_ok=0
          if [ -s repo/proofs/m8-hword-appkit-input.json ] && \
             jq -e '.status == "PASS"' repo/proofs/m8-hword-appkit-input.json >/dev/null; then
            proof_ok=1
          fi

          if [ "$replay_conclusion" = success ] && [ "$proof_ok" -eq 1 ]; then
            final_status=PASS
            final_stage=complete
            pipeline_ok=1
          else
            final_status=FAIL
            final_stage=exact-hword-replay
            pipeline_ok=0
          fi

          head=$(git -C repo rev-parse HEAD)
          jq -n \
            --arg status "$final_status" \
            --arg stage "$final_stage" \
            --arg started_at "$started_at" \
            --arg completed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg branch "$TARGET_BRANCH" \
            --arg head "$head" \
            --argjson publish_run "$publish_id" \
            --arg publish_url "$publish_url" \
            --arg publish_conclusion "$publish_conclusion" \
            --argjson replay_run "$replay_id" \
            --arg replay_url "$replay_url" \
            --arg replay_conclusion "$replay_conclusion" \
            --argjson proof_present "$proof_ok" \
            '{schema:1,status:$status,stage:$stage,started_at:$started_at,completed_at:$completed_at,branch:$branch,head:$head,publish:{run:$publish_run,url:$publish_url,conclusion:$publish_conclusion},replay:{run:$replay_run,url:$replay_url,conclusion:$replay_conclusion},durable_proof_present:($proof_present == 1)}' \
            >repo/diagnostics/m8-pipeline-supervisor.json
          echo "pipeline_ok=$pipeline_ok" >>"$GITHUB_OUTPUT"

      - name: Commit the durable supervisor result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          cd repo
          git add diagnostics/m8-pipeline-supervisor.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'diagnostics: record the M8 pipeline supervisor result [skip ci]'
          for _ in $(seq 1 8); do
            if git push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            fi
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH"
          done
          exit 1

      - name: Require a durable exact-HWord M8 proof
        if: steps.pipeline.outputs.pipeline_ok != '1'
        run: |
          echo 'M8 did not produce a durable PASS proof; inspect diagnostics/m8-pipeline-supervisor.json.' >&2
          exit 1
