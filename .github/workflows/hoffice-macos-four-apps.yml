name: Build four HOffice macOS apps

on:
  push:
    branches:
      - codex/hoffice-macos-audit
  workflow_dispatch:

permissions:
  contents: read

env:
  ASSET_NAME: hoffice_11.20.0.1520+h1_amd64.deb
  RELEASE_TAG: linux-11.20-series
  EXPECTED_SHA256: 23fc502c430b4dd829fee36740fbce06b819cd51d36fcdf0afbb6fcc5d0b7c46

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 50
    steps:
      - name: Download package and extract exact official icons
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p work/deb work/icons work/src work/dist work/out
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET_NAME" \
            --dir work/deb
          printf '%s  %s\n' "$EXPECTED_SHA256" "work/deb/$ASSET_NAME" | shasum -a 256 -c -
          cd work/deb
          ar x "$ASSET_NAME"
          data=
          for f in data.tar*; do test -f "$f" && data=$f && break; done
          test -n "$data"
          tar -tf "$data" > members.txt
          extract_member() {
            suffix=$1
            output=$2
            member=$(grep -F "$suffix" members.txt | head -n 1)
            test -n "$member"
            tar -xOf "$data" "$member" > "$output"
            test -s "$output"
          }
          extract_member '/opt/hnc/hoffice11/Bin/Resource/HCell/hoffice11-hcell.svg' ../icons/hcell.svg
          extract_member '/opt/hnc/hoffice11/Bin/Resource/HShow/hoffice11-hshow.svg' ../icons/hshow.svg
          extract_member '/opt/hnc/hoffice11/Bin/Resource/Hword/hoffice11-hword.svg' ../icons/hword.svg
          extract_member '/opt/hnc/hoffice11/Bin/Resource/Hwp/hoffice11-hwp.svg' ../icons/hwp.svg
          file ../icons/*.svg
          shasum -a 256 ../icons/*.svg > ../icons/SHA256SUMS

      - name: Write native AppKit launcher and runtime adapter
        run: |
          cat > work/src/HOfficeLauncher.swift <<'SWIFT'
          import AppKit
          import Foundation

          private struct Manifest: Decodable {
              let id: String
              let displayName: String
              let guestExecutable: String
          }

          @main
          final class Launcher: NSObject, NSApplicationDelegate {
              private var child: Process?
              private var pendingDocuments: [String] = []
              private var launched = false

              static func main() {
                  let app = NSApplication.shared
                  let delegate = Launcher()
                  app.delegate = delegate
                  app.setActivationPolicy(.regular)
                  app.run()
              }

              func applicationDidFinishLaunching(_ notification: Notification) {
                  NSApp.activate(ignoringOtherApps: true)
                  DispatchQueue.main.async { [weak self] in self?.launch() }
              }

              func application(_ sender: NSApplication, openFiles filenames: [String]) {
                  pendingDocuments.append(contentsOf: filenames)
                  sender.reply(toOpenOrPrint: .success)
                  if !launched { launch() }
              }

              func applicationWillTerminate(_ notification: Notification) {
                  if let child = child, child.isRunning { child.terminate() }
              }

              private func launch() {
                  guard !launched else { return }
                  launched = true
                  do {
                      guard let resources = Bundle.main.resourceURL else {
                          throw NSError(domain: "HOffice", code: 1)
                      }
                      let manifestURL = resources.appendingPathComponent("AppManifest.json")
                      let adapterURL = resources.appendingPathComponent("runtime-adapter.sh")
                      let manifest = try JSONDecoder().decode(Manifest.self, from: Data(contentsOf: manifestURL))
                      let support = FileManager.default.homeDirectoryForCurrentUser
                          .appendingPathComponent("Library/Application Support/Hancom Office 2022 Beta", isDirectory: true)
                      let rootfs = ProcessInfo.processInfo.environment["HOFFICE_PAYLOAD_ROOT"].map { URL(fileURLWithPath: $0) }
                          ?? support.appendingPathComponent("rootfs", isDirectory: true)
                      let logs = FileManager.default.homeDirectoryForCurrentUser
                          .appendingPathComponent("Library/Logs/Hancom Office 2022 Beta", isDirectory: true)
                      try FileManager.default.createDirectory(at: logs, withIntermediateDirectories: true)
                      let logURL = logs.appendingPathComponent("\(manifest.id).log")
                      FileManager.default.createFile(atPath: logURL.path, contents: nil)
                      let log = try FileHandle(forWritingTo: logURL)
                      _ = try log.seekToEnd()
                      var docs = Array(CommandLine.arguments.dropFirst()) + pendingDocuments
                      docs = NSOrderedSet(array: docs).array.compactMap { $0 as? String }

                      let process = Process()
                      process.executableURL = URL(fileURLWithPath: "/bin/bash")
                      process.arguments = [adapterURL.path, "--manifest", manifestURL.path, "--rootfs", rootfs.path, "--"] + docs
                      var env = ProcessInfo.processInfo.environment
                      env["HOFFICE_APP_BUNDLE"] = Bundle.main.bundleURL.path
                      env["HOFFICE_APP_ID"] = manifest.id
                      env["HOFFICE_GUEST_EXECUTABLE"] = manifest.guestExecutable
                      process.environment = env
                      process.standardOutput = log
                      process.standardError = log
                      process.terminationHandler = { task in
                          try? log.close()
                          DispatchQueue.main.async {
                              if task.terminationStatus != 0 {
                                  let tail = (try? String(contentsOf: logURL, encoding: .utf8))?.suffix(1800) ?? ""
                                  let alert = NSAlert()
                                  alert.alertStyle = .critical
                                  alert.messageText = "\(manifest.displayName)을(를) 열지 못했습니다"
                                  alert.informativeText = "호환 런타임이 종료되었습니다 (상태 \(task.terminationStatus)).\n\n\(tail)\n\n로그: \(logURL.path)"
                                  alert.runModal()
                              }
                              NSApp.terminate(nil)
                          }
                      }
                      child = process
                      try process.run()
                  } catch {
                      let alert = NSAlert()
                      alert.alertStyle = .critical
                      alert.messageText = "한컴오피스 실행 오류"
                      alert.informativeText = error.localizedDescription
                      alert.runModal()
                      NSApp.terminate(nil)
                  }
              }
          }
          SWIFT

          cat > work/src/runtime-adapter.sh <<'BASH'
          #!/bin/bash
          set -euo pipefail
          manifest=
          rootfs=
          while [ "$#" -gt 0 ]; do
            case "$1" in
              --manifest) manifest=$2; shift 2 ;;
              --rootfs) rootfs=$2; shift 2 ;;
              --) shift; break ;;
              *) exit 64 ;;
            esac
          done
          test -f "$manifest" || { echo "manifest가 없습니다: $manifest" >&2; exit 66; }
          app_id=$(/usr/libexec/PlistBuddy -c 'Print :HOfficeAppID' "${HOFFICE_APP_BUNDLE}/Contents/Info.plist")
          display_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "${HOFFICE_APP_BUNDLE}/Contents/Info.plist")
          guest_program=$(/usr/libexec/PlistBuddy -c 'Print :HOfficeGuestExecutable' "${HOFFICE_APP_BUNDLE}/Contents/Info.plist")
          support="$HOME/Library/Application Support/Hancom Office 2022 Beta"
          adapter=${HOFFICE_RUNTIME_ADAPTER:-}
          if [ -z "$adapter" ] && [ -x "$support/runtime/launch" ]; then adapter="$support/runtime/launch"; fi
          if [ -n "$adapter" ]; then
            exec "$adapter" --app-id "$app_id" --display-name "$display_name" --rootfs "$rootfs" --guest-executable "$guest_program" --manifest "$manifest" -- "$@"
          fi
          test -d "$rootfs" || { echo "HOffice payload가 설치되지 않았습니다: $rootfs" >&2; exit 66; }
          runtime=${HOFFICE_RUNTIME:-}
          if [ -z "$runtime" ] && [ -x "$support/runtime/hoffice-runtime" ]; then runtime="$support/runtime/hoffice-runtime"; fi
          if [ -z "$runtime" ] && [ -x "${HOFFICE_APP_BUNDLE}/Contents/Frameworks/hoffice-runtime" ]; then
            runtime="${HOFFICE_APP_BUNDLE}/Contents/Frameworks/hoffice-runtime"
          fi
          if [ -z "$runtime" ] || [ ! -x "$runtime" ]; then
            cat >&2 <<MSG
          macOS 호환 런타임을 찾지 못했습니다.
          다음 어댑터를 연결하십시오:
          $support/runtime/launch
          원본 프로그램은 Linux x86-64 ELF이므로 호환 런타임 없이 직접 실행되지 않습니다.
          MSG
            exit 69
          fi
          export HOFFICE_APP_ID="$app_id"
          export HOFFICE_GUEST_QT_PLUGIN_PATH='/opt/hnc/hoffice11/Bin/qt/plugins'
          export HOFFICE_GUEST_LD_LIBRARY_PATH='/opt/hnc/hoffice11/Bin:/opt/hnc/hoffice11/Bin/qt/lib'
          exec "$runtime" --rootfs "$rootfs" --program "$guest_program" --app-id "$app_id" -- "$@"
          BASH
          chmod +x work/src/runtime-adapter.sh

      - name: Compile universal2 launcher
        run: |
          set -euxo pipefail
          sdk=$(xcrun --sdk macosx --show-sdk-path)
          xcrun swiftc -parse-as-library -O -whole-module-optimization -sdk "$sdk" \
            -target arm64-apple-macos12.0 work/src/HOfficeLauncher.swift \
            -framework AppKit -o work/src/HOfficeLauncher.arm64
          xcrun swiftc -parse-as-library -O -whole-module-optimization -sdk "$sdk" \
            -target x86_64-apple-macos12.0 work/src/HOfficeLauncher.swift \
            -framework AppKit -o work/src/HOfficeLauncher.x86_64
          lipo -create work/src/HOfficeLauncher.arm64 work/src/HOfficeLauncher.x86_64 \
            -output work/src/HOfficeLauncher
          lipo -info work/src/HOfficeLauncher

      - name: Build and sign four app bundles
        run: |
          set -euxo pipefail
          cat > work/src/build.py <<'PY'
          import json, os, plistlib, shutil
          from pathlib import Path

          icons=Path('work/icons')
          out=Path('work/dist')
          launcher=Path('work/src/HOfficeLauncher')
          adapter=Path('work/src/runtime-adapter.sh')
          apps=[
            dict(id='hcell', displayName='한셀 2022 Beta', englishName='HCell 2022 Beta', bundleIdentifier='dev.bicheon.hoffice2022.hcell', guestExecutable='/opt/hnc/hoffice11/Bin/hcl', icon='hcell.svg', extensions=['cell','nxl','hca','hcbk','xls','xlsx','xlsm','xlsb','ods','csv']),
            dict(id='hshow', displayName='한쇼 2022 Beta', englishName='Show 2022 Beta', bundleIdentifier='dev.bicheon.hoffice2022.hshow', guestExecutable='/opt/hnc/hoffice11/Bin/hsl', icon='hshow.svg', extensions=['show','hpt','ppt','pptx','pptm','pps','ppsx','odp']),
            dict(id='hword', displayName='한워드 2022 Beta', englishName='Hword 2022 Beta', bundleIdentifier='dev.bicheon.hoffice2022.hword', guestExecutable='/opt/hnc/hoffice11/Bin/hword', icon='hword.svg', extensions=['doc','docx','hwdt','wbk']),
            dict(id='hwp', displayName='한글 2022 Beta', englishName='Hwp 2022 Beta', bundleIdentifier='dev.bicheon.hoffice2022.hwp', guestExecutable='/opt/hnc/hoffice11/Bin/hwp', icon='hwp.svg', extensions=['hwp','hwpx','hwt','hml','hwtx','asv','bak','doc','docx']),
          ]
          for app in apps:
              bundle=out/(app['displayName']+'.app')
              macos=bundle/'Contents/MacOS'; res=bundle/'Contents/Resources'; frameworks=bundle/'Contents/Frameworks'
              macos.mkdir(parents=True); res.mkdir(); frameworks.mkdir()
              shutil.copy2(launcher, macos/'HOfficeLauncher')
              shutil.copy2(adapter, res/'runtime-adapter.sh')
              os.chmod(macos/'HOfficeLauncher',0o755); os.chmod(res/'runtime-adapter.sh',0o755)
              manifest={k:v for k,v in app.items() if k != 'icon'}
              manifest['schemaVersion']=1
              (res/'AppManifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              plist={
                'CFBundleDevelopmentRegion':'ko','CFBundleDisplayName':app['displayName'],'CFBundleExecutable':'HOfficeLauncher',
                'CFBundleIconFile':'AppIcon','CFBundleIdentifier':app['bundleIdentifier'],'CFBundleInfoDictionaryVersion':'6.0',
                'CFBundleName':app['displayName'],'CFBundlePackageType':'APPL','CFBundleShortVersionString':'11.20.0',
                'CFBundleVersion':'1520','LSMinimumSystemVersion':'12.0','LSMultipleInstancesProhibited':True,
                'NSHighResolutionCapable':True,'NSSupportsAutomaticGraphicsSwitching':True,
                'CFBundleDocumentTypes':[{'CFBundleTypeExtensions':app['extensions'],'CFBundleTypeName':app['englishName']+' document','CFBundleTypeRole':'Editor','LSHandlerRank':'Alternate'}],
                'HOfficeAppID':app['id'],'HOfficeGuestExecutable':app['guestExecutable'],'HOfficeSourcePackageVersion':'11.20.0.1520+h1'
              }
              with (bundle/'Contents/Info.plist').open('wb') as f: plistlib.dump(plist,f,sort_keys=True)
              (bundle/'Contents/PkgInfo').write_text('APPL????',encoding='ascii')
              shutil.copy2(icons/app['icon'], res/'AppIcon.svg')
          PY
          python3 work/src/build.py

          make_icns() {
            svg=$1
            out=$2
            tmp=$(mktemp -d)
            mkdir -p "$tmp/png" "$tmp/AppIcon.iconset"
            qlmanage -t -s 1024 -o "$tmp/png" "$svg" >/dev/null 2>&1
            png=$(find "$tmp/png" -type f -name '*.png' -print | head -n 1)
            test -n "$png"
            while read size name; do
              sips -z "$size" "$size" "$png" --out "$tmp/AppIcon.iconset/$name" >/dev/null
            done <<'SIZES'
          16 icon_16x16.png
          32 icon_16x16@2x.png
          32 icon_32x32.png
          64 icon_32x32@2x.png
          128 icon_128x128.png
          256 icon_128x128@2x.png
          256 icon_256x256.png
          512 icon_256x256@2x.png
          512 icon_512x512.png
          1024 icon_512x512@2x.png
          SIZES
            iconutil -c icns "$tmp/AppIcon.iconset" -o "$out"
            rm -rf "$tmp"
          }

          count=0
          for app in work/dist/*.app; do
            make_icns "$app/Contents/Resources/AppIcon.svg" "$app/Contents/Resources/AppIcon.icns"
            plutil -lint "$app/Contents/Info.plist"
            codesign --force --deep --sign - --timestamp=none "$app"
            codesign --verify --deep --strict "$app"
            lipo -info "$app/Contents/MacOS/HOfficeLauncher"
            count=$((count+1))
          done
          test "$count" -eq 4

      - name: Output four separate app archives
        run: |
          set -euxo pipefail
          for app in work/dist/*.app; do
            name=$(basename "$app")
            ditto -c -k --sequesterRsrc --keepParent "$app" "work/out/$name.zip"
          done
          test "$(find work/out -maxdepth 1 -type f -name '*.app.zip' | wc -l | tr -d ' ')" -eq 4
          shasum -a 256 work/out/*.zip > work/out/SHA256SUMS
          ls -lh work/out

      - name: Upload four macOS apps
        uses: actions/upload-artifact@v4
        with:
          name: Hancom-Office-2022-Beta-four-macOS-apps
          path: work/out
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
