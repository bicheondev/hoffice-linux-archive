name: HOffice runtime M6 exact HWord candidate probes v3

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
    paths:
      - '.github/workflows/hoffice-runtime-m6-hword-candidate-probes-v3.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: hrt-m6-hword-candidates-v3-${{ github.ref }}
  cancel-in-progress: true

env:
  BRANCH: codex/hoffice-runtime-from-scratch
  INVENTORY: diagnostics/hword-symbol-inventory.json

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/hoffice-runtime-from-scratch
          fetch-depth: 0

      - name: Wait for the exact HWord symbol inventory
        run: |
          set -euxo pipefail
          for _ in $(seq 1 180); do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            if test -s "$INVENTORY"; then
              exit 0
            fi
            sleep 10
          done
          echo "HWord symbol inventory did not arrive" >&2
          exit 1

      - name: Select unique high-value HWord candidates
        id: select
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          inventory=json.loads(Path('diagnostics/hword-symbol-inventory.json').read_text())
          groups=inventory.get('groups',{})
          quotas={
              'main_window':3,
              'application':2,
              'document':2,
              'editor_view':2,
              'window_visibility':2,
          }
          excluded=(
              'vtable for ','typeinfo for ','typeinfo name for ',
              'non-virtual thunk to ','virtual thunk to ',
              'guard variable for ','construction vtable for ',
              'operator new','operator delete',
          )
          selected=[]
          used=set()
          for group,quota in quotas.items():
              accepted=0
              for record in groups.get(group,[]):
                  key=(record['guest_path'],record['mangled'])
                  if key in used:
                      continue
                  demangled=record.get('demangled','')
                  symbol_type=record.get('type','')
                  if any(token in demangled for token in excluded):
                      continue
                  if symbol_type not in ('T','t','W','w'):
                      continue
                  if not record.get('mangled') or not record.get('guest_path'):
                      continue
                  # Prefer actual callable functions over destructors unless
                  # a constructor or explicit UI method is visible.
                  if '::~' in demangled and not any(token in demangled for token in
                      ('MainWindow','DocumentWindow','FrameWindow')):
                      continue
                  used.add(key)
                  safe=re.sub(r'[^a-z0-9]+','-',
                              f'{group}-{accepted}-{record["mangled"]}'.lower())
                  safe=safe.strip('-')[:100]
                  label=f'HWord {demangled}'[:180]
                  selected.append({
                      'id':safe,
                      'target':record['guest_path'],
                      'regex':'^'+re.escape(record['mangled'])+'$',
                      'label':label,
                      'milestone':f'M6-v3-hword-{safe}',
                      'diagnostic':f'diagnostics/hword-v3/{safe}.json',
                      'proof':f'proofs/hword-v3/{safe}.json',
                      'trace':160000+len(selected)*8000,
                      'seconds':60,
                      'group':group,
                      'score':record.get('score'),
                      'mangled':record['mangled'],
                      'demangled':demangled,
                  })
                  accepted+=1
                  if accepted>=quota:
                      break
          if not selected:
              raise SystemExit('no callable HWord candidates were selected')
          matrix={'include':selected}
          Path('build-hword-candidate-matrix.json').write_text(
              json.dumps(matrix,indent=2)+'\n')
          with Path('/tmp/github-output').open('w') as output:
              output.write('matrix='+json.dumps(matrix,separators=(',',':'))+'\n')
              output.write(f'count={len(selected)}\n')
          print(json.dumps(matrix,indent=2))
          PY
          cat /tmp/github-output >> "$GITHUB_OUTPUT"
          cp build-hword-candidate-matrix.json \
             diagnostics/hword-candidate-probe-matrix.json

      - name: Commit the exact candidate selection
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/hword-candidate-probe-matrix.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'diagnostic: select exact HWord UI probe candidates [skip ci]'
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"

  probe:
    needs: select
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    name: ${{ matrix.id }}
    uses: ./.github/workflows/hoffice-runtime-guest-target-symbol-probe-v3.yml
    with:
      predecessor_proof: proofs/m3-hword-entry.json
      target_elf: ${{ matrix.target }}
      symbol_regex: ${{ matrix.regex }}
      label: ${{ matrix.label }}
      milestone: ${{ matrix.milestone }}
      diagnostic_path: ${{ matrix.diagnostic }}
      proof_path: ${{ matrix.proof }}
      trace_limit: ${{ matrix.trace }}
      run_seconds: ${{ matrix.seconds }}
      require_offscreen_loaded: true
      require_pipe2: true

  summarize:
    needs: [select, probe]
    if: always() && needs.select.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/hoffice-runtime-from-scratch
          fetch-depth: 0

      - name: Fetch every candidate proof and diagnosis
        run: |
          set -euxo pipefail
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"

      - name: Consolidate HWord-specific probe results
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          matrix=json.loads(Path('diagnostics/hword-candidate-probe-matrix.json').read_text())
          results=[]
          for candidate in matrix['include']:
              proof_path=Path(candidate['proof'])
              diagnostic_path=Path(candidate['diagnostic'])
              record={
                  'id':candidate['id'],
                  'group':candidate['group'],
                  'score':candidate['score'],
                  'target':candidate['target'],
                  'mangled':candidate['mangled'],
                  'demangled':candidate['demangled'],
                  'proof_path':str(proof_path),
                  'diagnostic_path':str(diagnostic_path),
                  'accepted':False,
              }
              source=None
              if proof_path.is_file():
                  source=proof_path
              elif diagnostic_path.is_file():
                  source=diagnostic_path
              if source:
                  data=json.loads(source.read_text())
                  record.update({
                      'source':str(source),
                      'accepted':data.get('selected_symbol_entered') is True and
                                 proof_path.is_file(),
                      'selected_symbol_entered':
                          data.get('selected_symbol_entered'),
                      'offscreen_library_loaded':
                          data.get('offscreen_library_loaded'),
                      'status':data.get('status'),
                      'workflow_run':data.get('workflow_run'),
                      'unsupported_syscalls':
                          data.get('unsupported_syscalls'),
                      'fatal_signals':data.get('fatal_signals'),
                  })
              results.append(record)
          accepted=[item for item in results if item['accepted']]
          summary={
              'schema':1,
              'workflow_run':'${{ github.run_id }}',
              'candidate_count':len(results),
              'accepted_count':len(accepted),
              'accepted':accepted,
              'results':results,
          }
          Path('diagnostics/hword-candidate-probe-summary.json').write_text(
              json.dumps(summary,indent=2)+'\n')
          lines=[
              '# Exact HWord candidate probe summary','',
              f"- Candidates: `{len(results)}`",
              f"- Accepted: `{len(accepted)}`",'',
          ]
          for item in results:
              state='PASS' if item['accepted'] else (
                  'OBSERVED' if item.get('selected_symbol_entered') else 'PENDING')
              lines.append(
                  f"- **{state}** — `{item['id']}`\n"
                  f"  - `{item['target']}`\n"
                  f"  - `{item['demangled']}`")
          Path('diagnostics/hword-candidate-probe-summary.md').write_text(
              '\n'.join(lines)+'\n')
          print(json.dumps(summary,indent=2))
          PY

      - name: Commit the HWord-specific frontier
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/hword-candidate-probe-summary.json \
                  diagnostics/hword-candidate-probe-summary.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'diagnostic: consolidate exact HWord UI probe results [skip ci]'
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
