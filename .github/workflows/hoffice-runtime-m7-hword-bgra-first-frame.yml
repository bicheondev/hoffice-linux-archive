name: HOffice runtime M7 exact HWord BGRA first frame

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
    paths:
      - 'runtime/m6/prebuilt/**'
      - '.github/workflows/hoffice-runtime-m7-hword-bgra-first-frame.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: hrt-m7-hword-bgra-first-frame-${{ github.ref }}
  cancel-in-progress: true

env:
  ROOTFS_ARTIFACT_ID: '8968324706'
  ROOTFS_ARTIFACT_SHA256: 3e301d3c6269926c62804bff18671136fcf8c0b0b22b3952072e427a8fa9918a
  ROOTFS_ARCHIVE_SHA256: 322fcf228092b296a34edbfa7ee43f9a7b237d5bcedaee50109ac4bb44d9ca28
  PROGRAM: /opt/hnc/hoffice11/Bin/hword
  PROGRAM_SHA256: 55876ea7d0c20e73d936af11cc3623c418acb09d61bde5bfeecafa1da7a9b5cb
  PLUGIN_GUEST: /opt/hnc/hoffice11/Bin/qt/plugins/platforms/libqhrtappkit.so

jobs:
  exact-hword-bgra-first-frame:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clone the exact branch and require M6
        run: |
          set -euxo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          rm -rf /tmp/hrt-m7-repository /tmp/hrt-m7-build
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            clone --depth=1 --branch "$GITHUB_REF_NAME" \
            "https://github.com/$GITHUB_REPOSITORY.git" /tmp/hrt-m7-repository
          cd /tmp/hrt-m7-repository
          git config "http.https://github.com/.extraheader" "AUTHORIZATION: basic $auth"
          git rev-parse HEAD | tee /tmp/hrt-m7-source-commit.txt
          test -s proofs/m6-hword-hrtappkit-first-window.json
          grep -F '"status": "PASS"' proofs/m6-hword-hrtappkit-first-window.json
          test -s runtime/m6/prebuilt/libqhrtappkit.so.xz
          test -s runtime/m6/prebuilt/libqhrtappkit.lock.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path('runtime/m6/prebuilt/libqhrtappkit.lock.json').read_text())
          assert lock['toolchain']['qt_version'] == '5.11.3', lock
          assert lock['plugin']['qpa_key'] == 'hrtappkit', lock
          assert lock['plugin'].get('m7_bgra_transport') is True, lock
          PY

      - name: Download and lock the verified HWord root
        run: |
          set -euxo pipefail
          mkdir -p /tmp/hrt-m7-build/input/hword /tmp/hrt-m7-build/generated \
                   /tmp/hrt-m7-build/objects /tmp/hrt-m7-build/host /tmp/hrt-m7-build/proof
          curl --fail --location --retry 5 --retry-delay 3 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ROOTFS_ARTIFACT_ID/zip" \
            -o /tmp/hrt-m7-build/input/hword-artifact.zip
          printf '%s  %s\n' "$ROOTFS_ARTIFACT_SHA256" /tmp/hrt-m7-build/input/hword-artifact.zip \
            | shasum -a 256 -c -
          ditto -x -k /tmp/hrt-m7-build/input/hword-artifact.zip /tmp/hrt-m7-build/input/hword
          printf '%s  %s\n' "$ROOTFS_ARCHIVE_SHA256" \
            /tmp/hrt-m7-build/input/hword/hword-rootfs.tar.gz | shasum -a 256 -c -

      - name: Reconstruct the case-sensitive HWord guest and M7 QPA
        run: |
          set -euxo pipefail
          image="$RUNNER_TEMP/hrt-m7-bgra.sparsebundle"
          root="/tmp/h7b-$GITHUB_RUN_ID"
          rm -rf "$image" "$root"; mkdir -p "$root"
          if ! hdiutil create -quiet -size 8g -fs APFSX -volname HRTM7B \
               -type SPARSEBUNDLE "$image"; then
            rm -rf "$image"
            hdiutil create -quiet -size 8g -fs HFSX -volname HRTM7B \
              -type SPARSEBUNDLE "$image"
          fi
          hdiutil attach -quiet -nobrowse -mountpoint "$root" "$image"
          echo "HRT_ROOT=$root" >> "$GITHUB_ENV"
          tar -xzf /tmp/hrt-m7-build/input/hword/hword-rootfs.tar.gz -C "$root"
          test -s "$root/.hrt-prepatched-v1"; test -f "$root$PROGRAM"
          mkdir -p "$root$(dirname "$PLUGIN_GUEST")"
          python3 - /tmp/hrt-m7-repository/runtime/m6/prebuilt/libqhrtappkit.so.xz \
            /tmp/hrt-m7-repository/runtime/m6/prebuilt/libqhrtappkit.lock.json \
            "$root$PLUGIN_GUEST" <<'PY'
          import hashlib, json, lzma, pathlib, sys
          source = pathlib.Path(sys.argv[1])
          lock = json.loads(pathlib.Path(sys.argv[2]).read_text())
          destination = pathlib.Path(sys.argv[3])
          compressed = source.read_bytes()
          assert hashlib.sha256(compressed).hexdigest() == lock['plugin']['xz_sha256'], lock
          plugin = lzma.decompress(compressed)
          assert hashlib.sha256(plugin).hexdigest() == lock['plugin']['sha256_after_prepatch'], lock
          destination.write_bytes(plugin)
          pathlib.Path('/tmp/hrt-m7-build/proof/qpa-lock.json').write_text(json.dumps(lock, indent=2) + '\n')
          PY
          chmod 0755 "$root$PLUGIN_GUEST"
          file "$root$PLUGIN_GUEST" | tee /tmp/hrt-m7-build/proof/plugin-file.txt
          diskutil info "$root" | tee /tmp/hrt-m7-build/proof/guest-volume.txt
          grep -F 'Case-sensitive' /tmp/hrt-m7-build/proof/guest-volume.txt

      - name: Generate the mature Linux and AppKit bridge
        run: |
          set -euxo pipefail
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          cd /tmp/hrt-m7-repository
          python3 runtime/m6/augment_stack_hrtappkit.py runtime/m3/stack.c /tmp/hrt-m7-build/generated/stack.c
          python3 runtime/m3/augment_syscalls.py runtime/m3/syscall_bridge.c /tmp/hrt-m7-build/generated/stage1.c
          python3 runtime/m3/augment_directory_syscalls.py /tmp/hrt-m7-build/generated/stage1.c /tmp/hrt-m7-build/generated/stage2.c
          python3 runtime/m3/augment_directory_stream.py /tmp/hrt-m7-build/generated/stage2.c /tmp/hrt-m7-build/generated/stage3.c
          python3 runtime/m3/augment_pipe2.py /tmp/hrt-m7-build/generated/stage3.c /tmp/hrt-m7-build/generated/stage4.c
          python3 runtime/m3/augment_eventfd2.py /tmp/hrt-m7-build/generated/stage4.c /tmp/hrt-m7-build/generated/stage5.c
          python3 runtime/m3/augment_crash_signals.py /tmp/hrt-m7-build/generated/stage5.c /tmp/hrt-m7-build/generated/stage6.c
          python3 runtime/m3/augment_poll.py /tmp/hrt-m7-build/generated/stage6.c /tmp/hrt-m7-build/generated/stage7.c
          python3 runtime/m3/augment_posix_basics.py /tmp/hrt-m7-build/generated/stage7.c /tmp/hrt-m7-build/generated/stage8.c
          python3 runtime/m3/augment_connect.py /tmp/hrt-m7-build/generated/stage8.c /tmp/hrt-m7-build/generated/stage9.c
          python3 runtime/m6/augment_appkit_hostcall_deferred.py /tmp/hrt-m7-build/generated/stage9.c /tmp/hrt-m7-build/generated/stage10.c
          python3 runtime/m3/augment_darwin_syscall_abi.py /tmp/hrt-m7-build/generated/stage10.c /tmp/hrt-m7-build/generated/syscall_bridge.c
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/hrt-m7-build/generated/syscall_bridge.c')
          text = path.read_text().replace('#define M3_TRACE_LIMIT 256u', '#define M3_TRACE_LIMIT 24000u')
          path.write_text(text)
          PY
          grep -q 'host_getdents64_stream_bridge' /tmp/hrt-m7-build/generated/syscall_bridge.c
          grep -q 'case HRT_M6_HOSTCALL_SYSCALL' /tmp/hrt-m7-build/generated/syscall_bridge.c

      - name: Compile and sign the exact-HWord M7 host
        run: |
          set -euxo pipefail
          cd /tmp/hrt-m7-repository
          common=(-arch x86_64 -std=c17 -O2 -g -fno-stack-protector \
            -fno-omit-frame-pointer -Wall -Wextra -Werror -Wpedantic \
            -Wno-unused-function -Wno-unused-variable -Iruntime/m6 -Iruntime/m3 -Iruntime/m1)
          index=0
          for source in runtime/m6/main.c runtime/m6/hostcall_trampoline.c \
            runtime/m1/common.c runtime/m3/elf_map.c /tmp/hrt-m7-build/generated/stack.c \
            runtime/m3/patch.c /tmp/hrt-m7-build/generated/syscall_bridge.c; do
            clang "${common[@]}" -c "$source" -o "/tmp/hrt-m7-build/objects/c-${index}.o"
            index=$((index+1))
          done
          clang -arch x86_64 -std=c17 -O2 -g -fobjc-arc -Wall -Wextra -Werror \
            -Wpedantic -Iruntime/m6 -c runtime/m6/appkit_adapter.m \
            -o /tmp/hrt-m7-build/objects/appkit-adapter.o
          clang -arch x86_64 -g -c runtime/m1/enter_guest.S -o /tmp/hrt-m7-build/objects/enter-guest.o
          clang -arch x86_64 -g -c runtime/m6/hostcall_trampoline.S -o /tmp/hrt-m7-build/objects/hostcall-trampoline.o
          clang -arch x86_64 /tmp/hrt-m7-build/objects/*.o -Wl,-pagezero_size,0x1000 \
            -framework AppKit -framework CoreGraphics -framework ImageIO \
            -o /tmp/hrt-m7-build/host/hrt-m7-hword-bgra
          codesign --force --sign - --timestamp=none /tmp/hrt-m7-build/host/hrt-m7-hword-bgra
          codesign --verify --strict /tmp/hrt-m7-build/host/hrt-m7-hword-bgra

      - name: Run until exact HWord presents its first BGRA frame
        run: |
          set -uxo pipefail
          cd /tmp/hrt-m7-repository
          export HRT_M6_CAPTURE_PATH=/tmp/hrt-m7-build/proof/pre-frame-window.png
          export HRT_M7_CAPTURE_PATH=/tmp/hrt-m7-build/proof/hword-bgra-first-frame.png
          : >/tmp/hrt-m7-build/proof/stdout.txt; : >/tmp/hrt-m7-build/proof/stderr.txt
          /usr/bin/arch -x86_64 /tmp/hrt-m7-build/host/hrt-m7-hword-bgra \
            --root "$HRT_ROOT" --program "$PROGRAM" \
            >/tmp/hrt-m7-build/proof/stdout.txt 2>/tmp/hrt-m7-build/proof/stderr.txt &
          pid=$!; reached=0
          for _ in $(jot 1200); do
            if grep -q 'HRT M7 QPA: BGRA frame accepted' /tmp/hrt-m7-build/proof/stderr.txt 2>/dev/null; then
              reached=1; break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 0.05
          done
          if kill -0 "$pid" 2>/dev/null; then
            ps -o pid,ppid,state,%cpu,%mem,etime,command -p "$pid" >/tmp/hrt-m7-build/proof/process.txt 2>&1 || true
            /usr/bin/sample "$pid" 1 1 -file /tmp/hrt-m7-build/proof/sample.txt >/dev/null 2>&1 || true
            kill -TERM "$pid" 2>/dev/null || true; sleep 0.25; kill -KILL "$pid" 2>/dev/null || true
          fi
          set +e; wait "$pid"; raw_status=$?; set -e
          printf '%s\n' "$raw_status" >/tmp/hrt-m7-build/proof/raw-exit-status.txt
          printf '%s\n' "$reached" >/tmp/hrt-m7-build/proof/reached-frame.txt
          grep -E 'libqhrtappkit|HRT M6 QPA|HRT M7 QPA|hrt-m7-hostcall|host-call opcode=26[01]|host-call opcode=25[6-9]|fatal signal|Qt platform plugin|Linux syscall ENOSYS' \
            /tmp/hrt-m7-build/proof/stderr.txt | tail -n 3200 | tee /tmp/hrt-m7-build/proof/key-lines.txt || true
          cat /tmp/hrt-m7-build/proof/key-lines.txt
          echo "raw-status=$raw_status reached=$reached"
          test "$reached" -eq 1

      - name: Accept only a copied HWord backing-store frame
        run: |
          set -euxo pipefail
          stderr=/tmp/hrt-m7-build/proof/stderr.txt
          grep -F 'loaded library "/opt/hnc/hoffice11/Bin/qt/plugins/platforms/libqhrtappkit.so"' "$stderr"
          grep -F 'HRT M7 QPA: backing store constructed' "$stderr"
          grep -E 'hrt-m7-hostcall: presented BGRA frame=[1-9][0-9]*' "$stderr"
          grep -E 'hrt-m6: host-call opcode=261 result=1' "$stderr"
          grep -E 'hrt-m6: host-call opcode=258 result=2[0-9][0-9]' "$stderr"
          grep -F 'HRT M7 QPA: BGRA frame accepted' "$stderr"
          ! grep -F 'fatal signal' "$stderr"
          test -s /tmp/hrt-m7-build/proof/pre-frame-window.png
          test -s /tmp/hrt-m7-build/proof/hword-bgra-first-frame.png
          pre=$(shasum -a 256 /tmp/hrt-m7-build/proof/pre-frame-window.png | awk '{print $1}')
          post=$(shasum -a 256 /tmp/hrt-m7-build/proof/hword-bgra-first-frame.png | awk '{print $1}')
          test "$pre" != "$post"
          sips -g pixelWidth -g pixelHeight /tmp/hrt-m7-build/proof/hword-bgra-first-frame.png \
            | tee /tmp/hrt-m7-build/proof/screenshot-info.txt
          python3 - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          stderr = Path('/tmp/hrt-m7-build/proof/stderr.txt').read_text(errors='replace')
          calls = []
          for line in stderr.splitlines():
              match = re.fullmatch(r'hrt-m6: host-call opcode=(\d+) result=(-?\d+)', line)
              if match: calls.append({'opcode': int(match.group(1)), 'result': int(match.group(2))})
          presents = [x for x in calls if x['opcode'] == 261 and x['result'] == 1]
          queries = [x for x in calls if x['opcode'] == 258]
          captures = [x for x in calls if x['opcode'] == 259 and x['result'] == 1]
          assert presents and queries and len(captures) >= 2, calls
          required = 0x01 | 0x02 | 0x04 | 0x20 | 0x40 | 0x80
          assert any((x['result'] & required) == required for x in queries), queries
          match = re.search(r'HRT M7 QPA: BGRA frame accepted sequence=(\d+) size=(\d+)x(\d+) stride=(\d+) host=(\d+) pump=(-?\d+) flags=0x([0-9a-fA-F]+) capture=(\d+)', stderr)
          assert match
          pre = Path('/tmp/hrt-m7-build/proof/pre-frame-window.png').read_bytes()
          post = Path('/tmp/hrt-m7-build/proof/hword-bgra-first-frame.png').read_bytes()
          assert pre != post
          lock = json.loads(Path('/tmp/hrt-m7-build/proof/qpa-lock.json').read_text())
          summary = {
              'schema': 1, 'milestone': 'M7 exact HWord first BGRA frame', 'status': 'PASS',
              'program': '/opt/hnc/hoffice11/Bin/hword',
              'program_sha256_before_prepatch': '55876ea7d0c20e73d936af11cc3623c418acb09d61bde5bfeecafa1da7a9b5cb',
              'qpa_plugin': '/opt/hnc/hoffice11/Bin/qt/plugins/platforms/libqhrtappkit.so',
              'qpa_plugin_sha256': lock['plugin']['sha256_after_prepatch'], 'qpa_key': 'hrtappkit',
              'frame': {'sequence': int(match.group(1)), 'width': int(match.group(2)),
                        'height': int(match.group(3)), 'bytes_per_line': int(match.group(4)),
                        'host_window': int(match.group(5)), 'query_flags': int(match.group(7), 16)},
              'host_calls': calls,
              'pre_frame_screenshot_sha256': hashlib.sha256(pre).hexdigest(),
              'presented_frame_screenshot_sha256': hashlib.sha256(post).hexdigest(),
              'screenshots_differ': True, 'window_server_listed': True,
              'guest_bgra_copied_to_appkit_view': True,
              'process_was_terminated_by_supervisor': True,
              'not_credited': ['continuous animation quality', 'native input', 'Korean IME',
                               'clipboard', 'document operations', 'clean shutdown'],
          }
          Path('/tmp/hrt-m7-build/proof/summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY

      - name: Commit durable M7 first-frame proof
        run: |
          set -euxo pipefail
          cd /tmp/hrt-m7-repository
          git fetch origin "$GITHUB_REF_NAME"; git reset --hard FETCH_HEAD
          mkdir -p proofs
          cp /tmp/hrt-m7-build/proof/summary.json proofs/m7-hword-bgra-first-frame.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proofs/m7-hword-bgra-first-frame.json
          git commit -m 'proof: verify exact HWord first BGRA frame [skip ci]'
          git push origin HEAD:"$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hrt-m7-hword-bgra-first-frame-proof
          path: /tmp/hrt-m7-build/proof
          if-no-files-found: warn
          retention-days: 14

      - name: Detach guest filesystem
        if: always()
        run: hdiutil detach -quiet "$HRT_ROOT" || true
