name: HOffice runtime M6 exact HWord prebuilt QPA

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
    paths:
      - 'runtime/m6/prebuilt/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: hrt-m6-hword-prebuilt-qpa-${{ github.ref }}
  cancel-in-progress: true

env:
  ROOTFS_ARTIFACT_ID: '8968324706'
  ROOTFS_ARTIFACT_SHA256: 3e301d3c6269926c62804bff18671136fcf8c0b0b22b3952072e427a8fa9918a
  ROOTFS_ARCHIVE_SHA256: 322fcf228092b296a34edbfa7ee43f9a7b237d5bcedaee50109ac4bb44d9ca28
  PROGRAM: /opt/hnc/hoffice11/Bin/hword
  PROGRAM_SHA256: 55876ea7d0c20e73d936af11cc3623c418acb09d61bde5bfeecafa1da7a9b5cb
  PLUGIN_GUEST: /opt/hnc/hoffice11/Bin/qt/plugins/platforms/libqhrtappkit.so

jobs:
  exact-hword-first-window:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clone the exact branch without Marketplace actions
        run: |
          set -euxo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          rm -rf /tmp/hrt-m6-repository /tmp/hrt-m6-build
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            clone --depth=1 --branch "$GITHUB_REF_NAME" \
            "https://github.com/$GITHUB_REPOSITORY.git" /tmp/hrt-m6-repository
          cd /tmp/hrt-m6-repository
          git config "http.https://github.com/.extraheader" \
            "AUTHORIZATION: basic $auth"
          git rev-parse HEAD | tee /tmp/hrt-m6-source-commit.txt
          test -s proofs/m6-linux-guest-appkit-window.json
          grep -F '"status": "PASS"' proofs/m6-linux-guest-appkit-window.json
          test -s runtime/m6/prebuilt/libqhrtappkit.so
          test -s runtime/m6/prebuilt/libqhrtappkit.lock.json

      - name: Download and lock the verified HWord root artifact
        run: |
          set -euxo pipefail
          mkdir -p /tmp/hrt-m6-build/input/hword \
                   /tmp/hrt-m6-build/generated /tmp/hrt-m6-build/objects \
                   /tmp/hrt-m6-build/host /tmp/hrt-m6-build/proof
          curl --fail --location --retry 5 --retry-delay 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ROOTFS_ARTIFACT_ID/zip" \
            -o /tmp/hrt-m6-build/input/hword-artifact.zip
          printf '%s  %s\n' "$ROOTFS_ARTIFACT_SHA256" \
            /tmp/hrt-m6-build/input/hword-artifact.zip | shasum -a 256 -c -
          ditto -x -k /tmp/hrt-m6-build/input/hword-artifact.zip \
            /tmp/hrt-m6-build/input/hword
          test -s /tmp/hrt-m6-build/input/hword/hword-rootfs.tar.gz
          printf '%s  %s\n' "$ROOTFS_ARCHIVE_SHA256" \
            /tmp/hrt-m6-build/input/hword/hword-rootfs.tar.gz \
            | shasum -a 256 -c -

      - name: Reconstruct and extend the case-sensitive guest root
        run: |
          set -euxo pipefail
          image="$RUNNER_TEMP/hrt-m6-prebuilt-qpa.sparsebundle"
          root="/tmp/h6p-$GITHUB_RUN_ID"
          rm -rf "$image" "$root"
          mkdir -p "$root"
          if ! hdiutil create -quiet -size 8g -fs APFSX \
               -volname HRTM6P -type SPARSEBUNDLE "$image"; then
            rm -rf "$image"
            hdiutil create -quiet -size 8g -fs HFSX \
              -volname HRTM6P -type SPARSEBUNDLE "$image"
          fi
          hdiutil attach -quiet -nobrowse -mountpoint "$root" "$image"
          echo "HRT_ROOT=$root" >> "$GITHUB_ENV"
          tar -xzf /tmp/hrt-m6-build/input/hword/hword-rootfs.tar.gz \
            -C "$root"
          test -s "$root/.hrt-closure-v1.json"
          test -s "$root/.hrt-prepatched-v1"
          test -f "$root$PROGRAM"
          test -d "$root/opt/hnc/hoffice11/Bin/Hword"

          mkdir -p "$root$(dirname "$PLUGIN_GUEST")"
          cp /tmp/hrt-m6-repository/runtime/m6/prebuilt/libqhrtappkit.so \
            "$root$PLUGIN_GUEST"
          chmod 0755 "$root$PLUGIN_GUEST"
          python3 - "$root" "$PROGRAM" "$PROGRAM_SHA256" \
                    "$PLUGIN_GUEST" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          program = sys.argv[2]
          original_sha = sys.argv[3]
          plugin_guest = sys.argv[4]
          marker = json.loads((root / '.hrt-prepatched-v1').read_text())
          record, = [item for item in marker['objects'] if item['path'] == program]
          assert record['sha256_before'] == original_sha, record
          actual_program = hashlib.sha256(
              (root / program.lstrip('/')).read_bytes()).hexdigest()
          assert actual_program == record['sha256_after'], (actual_program, record)

          lock = json.loads(pathlib.Path(
              '/tmp/hrt-m6-repository/runtime/m6/prebuilt/libqhrtappkit.lock.json'
          ).read_text())
          plugin = root / plugin_guest.lstrip('/')
          actual_plugin = hashlib.sha256(plugin.read_bytes()).hexdigest()
          assert actual_plugin == lock['sha256_after_prepatch'], (actual_plugin, lock)
          assert lock['qt_version'] == '5.11.3'
          assert lock['qpa_key'] == 'hrtappkit'
          pathlib.Path('/tmp/hrt-m6-build/proof/qpa-lock.json').write_text(
              json.dumps(lock, indent=2) + '\n')
          PY
          file "$root$PLUGIN_GUEST" | tee /tmp/hrt-m6-build/proof/plugin-file.txt
          diskutil info "$root" | tee /tmp/hrt-m6-build/proof/guest-volume.txt
          grep -F 'Case-sensitive' /tmp/hrt-m6-build/proof/guest-volume.txt

      - name: Generate the mature runtime and select hrtappkit
        run: |
          set -euxo pipefail
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          cd /tmp/hrt-m6-repository
          /usr/bin/arch -x86_64 /usr/bin/getconf PAGESIZE \
            | tee /tmp/hrt-m6-build/proof/x86-page-size.txt
          sw_vers | tee /tmp/hrt-m6-build/proof/sw-vers.txt

          python3 runtime/m6/augment_stack_hrtappkit.py \
            runtime/m3/stack.c /tmp/hrt-m6-build/generated/stack.c
          grep -F 'QT_QPA_PLATFORM=hrtappkit' \
            /tmp/hrt-m6-build/generated/stack.c

          python3 runtime/m3/augment_syscalls.py \
            runtime/m3/syscall_bridge.c /tmp/hrt-m6-build/generated/stage1.c
          python3 runtime/m3/augment_directory_syscalls.py \
            /tmp/hrt-m6-build/generated/stage1.c \
            /tmp/hrt-m6-build/generated/stage2.c
          python3 runtime/m3/augment_directory_stream.py \
            /tmp/hrt-m6-build/generated/stage2.c \
            /tmp/hrt-m6-build/generated/stage3.c
          python3 runtime/m3/augment_pipe2.py \
            /tmp/hrt-m6-build/generated/stage3.c \
            /tmp/hrt-m6-build/generated/stage4.c
          python3 runtime/m3/augment_eventfd2.py \
            /tmp/hrt-m6-build/generated/stage4.c \
            /tmp/hrt-m6-build/generated/stage5.c
          python3 runtime/m3/augment_crash_signals.py \
            /tmp/hrt-m6-build/generated/stage5.c \
            /tmp/hrt-m6-build/generated/stage6.c
          python3 runtime/m3/augment_poll.py \
            /tmp/hrt-m6-build/generated/stage6.c \
            /tmp/hrt-m6-build/generated/stage7.c
          python3 runtime/m3/augment_posix_basics.py \
            /tmp/hrt-m6-build/generated/stage7.c \
            /tmp/hrt-m6-build/generated/stage8.c
          python3 runtime/m3/augment_connect.py \
            /tmp/hrt-m6-build/generated/stage8.c \
            /tmp/hrt-m6-build/generated/stage9.c
          python3 runtime/m6/augment_appkit_hostcall_deferred.py \
            /tmp/hrt-m6-build/generated/stage9.c \
            /tmp/hrt-m6-build/generated/stage10.c
          python3 runtime/m3/augment_darwin_syscall_abi.py \
            /tmp/hrt-m6-build/generated/stage10.c \
            /tmp/hrt-m6-build/generated/syscall_bridge.c
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/hrt-m6-build/generated/syscall_bridge.c')
          text = path.read_text()
          old = '#define M3_TRACE_LIMIT 256u'
          assert text.count(old) == 1
          path.write_text(text.replace(old, '#define M3_TRACE_LIMIT 22000u'))
          PY
          grep -q 'host_getdents64_stream_bridge' \
            /tmp/hrt-m6-build/generated/syscall_bridge.c
          grep -q 'case HRT_M6_HOSTCALL_SYSCALL' \
            /tmp/hrt-m6-build/generated/syscall_bridge.c
          grep -q 'schedule_m6_appkit_hostcall' \
            /tmp/hrt-m6-build/generated/syscall_bridge.c

      - name: Compile and sign the exact-HWord AppKit host
        run: |
          set -euxo pipefail
          cd /tmp/hrt-m6-repository
          common=(
            -arch x86_64 -std=c17 -O2 -g
            -fno-stack-protector -fno-omit-frame-pointer
            -Wall -Wextra -Werror -Wpedantic
            -Iruntime/m6 -Iruntime/m3 -Iruntime/m1
          )
          index=0
          for source in \
            runtime/m6/main.c runtime/m6/hostcall_trampoline.c \
            runtime/m1/common.c runtime/m3/elf_map.c \
            /tmp/hrt-m6-build/generated/stack.c runtime/m3/patch.c \
            /tmp/hrt-m6-build/generated/syscall_bridge.c; do
            clang "${common[@]}" -c "$source" \
              -o "/tmp/hrt-m6-build/objects/c-${index}.o"
            index=$((index+1))
          done
          clang -arch x86_64 -std=c17 -O2 -g -fobjc-arc \
            -Wall -Wextra -Werror -Wpedantic -Iruntime/m6 \
            -c runtime/m6/appkit_adapter.m \
            -o /tmp/hrt-m6-build/objects/appkit-adapter.o
          clang -arch x86_64 -g -c runtime/m1/enter_guest.S \
            -o /tmp/hrt-m6-build/objects/enter-guest.o
          clang -arch x86_64 -g -c runtime/m6/hostcall_trampoline.S \
            -o /tmp/hrt-m6-build/objects/hostcall-trampoline.o
          clang -arch x86_64 /tmp/hrt-m6-build/objects/*.o \
            -Wl,-pagezero_size,0x1000 \
            -framework AppKit -framework CoreGraphics -framework ImageIO \
            -o /tmp/hrt-m6-build/host/hrt-m6-hword-qpa
          file /tmp/hrt-m6-build/host/hrt-m6-hword-qpa \
            | tee /tmp/hrt-m6-build/proof/host-file.txt
          lipo -info /tmp/hrt-m6-build/host/hrt-m6-hword-qpa \
            | tee /tmp/hrt-m6-build/proof/host-arch.txt
          codesign --force --sign - --timestamp=none \
            /tmp/hrt-m6-build/host/hrt-m6-hword-qpa
          codesign --verify --strict \
            /tmp/hrt-m6-build/host/hrt-m6-hword-qpa

      - name: Run exact HWord until its QPA creates an AppKit window
        run: |
          set -uxo pipefail
          cd /tmp/hrt-m6-repository
          export HRT_M6_CAPTURE_PATH=/tmp/hrt-m6-build/proof/hword-hrtappkit-window.png
          : >/tmp/hrt-m6-build/proof/stdout.txt
          : >/tmp/hrt-m6-build/proof/stderr.txt
          /usr/bin/arch -x86_64 /tmp/hrt-m6-build/host/hrt-m6-hword-qpa \
            --root "$HRT_ROOT" --program "$PROGRAM" \
            >/tmp/hrt-m6-build/proof/stdout.txt \
            2>/tmp/hrt-m6-build/proof/stderr.txt &
          pid=$!
          reached=0
          for _ in $(jot 900); do
            if grep -q 'hrt-m6: host-call opcode=259 result=1' \
                 /tmp/hrt-m6-build/proof/stderr.txt 2>/dev/null; then
              reached=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 0.05
          done
          if kill -0 "$pid" 2>/dev/null; then
            ps -o pid,ppid,state,%cpu,%mem,etime,command -p "$pid" \
              >/tmp/hrt-m6-build/proof/process.txt 2>&1 || true
            /usr/bin/sample "$pid" 1 1 \
              -file /tmp/hrt-m6-build/proof/sample.txt \
              >/dev/null 2>&1 || true
            kill -TERM "$pid" 2>/dev/null || true
            sleep 0.25
            kill -KILL "$pid" 2>/dev/null || true
          fi
          set +e
          wait "$pid"
          raw_status=$?
          set -e
          printf '%s\n' "$raw_status" \
            >/tmp/hrt-m6-build/proof/raw-exit-status.txt
          printf '%s\n' "$reached" \
            >/tmp/hrt-m6-build/proof/reached-window.txt
          grep -E 'libqhrtappkit|HRT M6 QPA|host-call opcode=25[6-9]|fatal signal|Qt platform plugin|Linux syscall ENOSYS|directory stream' \
            /tmp/hrt-m6-build/proof/stderr.txt | tail -n 2400 \
            | tee /tmp/hrt-m6-build/proof/key-lines.txt || true
          cat /tmp/hrt-m6-build/proof/key-lines.txt
          tail -n 500 /tmp/hrt-m6-build/proof/stdout.txt || true
          echo "raw-status=$raw_status reached=$reached"
          test "$reached" -eq 1

      - name: Accept only an HWord-issued native first window
        run: |
          set -euxo pipefail
          stderr=/tmp/hrt-m6-build/proof/stderr.txt
          grep -F 'Found metadata in lib /opt/hnc/hoffice11/Bin/qt/plugins/platforms/libqhrtappkit.so' "$stderr"
          grep -F 'Got keys from plugin meta data ("hrtappkit")' "$stderr"
          grep -F 'loaded library "/opt/hnc/hoffice11/Bin/qt/plugins/platforms/libqhrtappkit.so"' "$stderr"
          grep -F 'HRT M6 QPA: integration constructed' "$stderr"
          grep -F 'HRT M6 QPA: QPlatformWindow constructed' "$stderr"
          grep -E 'hrt-m6: host-call opcode=256 result=[1-9][0-9]*' "$stderr"
          grep -E 'hrt-m6: host-call opcode=258 result=1[0-9][0-9]' "$stderr"
          grep -F 'hrt-m6: host-call opcode=259 result=1' "$stderr"
          ! grep -F 'fatal signal' "$stderr"
          test -s /tmp/hrt-m6-build/proof/hword-hrtappkit-window.png
          sips -g pixelWidth -g pixelHeight \
            /tmp/hrt-m6-build/proof/hword-hrtappkit-window.png \
            | tee /tmp/hrt-m6-build/proof/screenshot-info.txt
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          stderr = Path('/tmp/hrt-m6-build/proof/stderr.txt').read_text(errors='replace')
          calls = []
          for line in stderr.splitlines():
              match = re.fullmatch(r'hrt-m6: host-call opcode=(\d+) result=(-?\d+)', line)
              if match:
                  calls.append({'opcode': int(match.group(1)),
                                'result': int(match.group(2))})
          creates = [item for item in calls if item['opcode'] == 256 and item['result'] > 0]
          queries = [item for item in calls if item['opcode'] == 258]
          captures = [item for item in calls if item['opcode'] == 259 and item['result'] == 1]
          assert creates and queries and captures, calls
          required = 0x01 | 0x02 | 0x04 | 0x20 | 0x40
          assert any((item['result'] & required) == required for item in queries), queries
          summary = {
              'schema': 1,
              'milestone': 'M6 exact HWord hrtappkit first window',
              'status': 'PASS',
              'program': '/opt/hnc/hoffice11/Bin/hword',
              'program_sha256_before_prepatch': '55876ea7d0c20e73d936af11cc3623c418acb09d61bde5bfeecafa1da7a9b5cb',
              'qpa_plugin': '/opt/hnc/hoffice11/Bin/qt/plugins/platforms/libqhrtappkit.so',
              'qpa_key': 'hrtappkit',
              'host_calls': calls,
              'window_server_listed': True,
              'screenshot_created': True,
              'process_was_terminated_by_supervisor': True,
              'not_credited': [
                  'HWord pixel transport', 'native input', 'Korean IME',
                  'document operations', 'clean shutdown'
              ],
          }
          Path('/tmp/hrt-m6-build/proof/summary.json').write_text(
              json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY

      - name: Commit durable first-window proof
        run: |
          set -euxo pipefail
          cd /tmp/hrt-m6-repository
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard FETCH_HEAD
          mkdir -p proofs
          cp /tmp/hrt-m6-build/proof/summary.json \
            proofs/m6-hword-hrtappkit-first-window.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proofs/m6-hword-hrtappkit-first-window.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'proof: verify exact HWord hrtappkit first window [skip ci]'
          git push origin HEAD:"$GITHUB_REF_NAME"

      - name: Detach guest filesystem
        if: always()
        run: hdiutil detach -quiet "$HRT_ROOT" || true
