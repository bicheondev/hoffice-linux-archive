name: HOffice runtime M11 workflow health

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
    paths:
      - '.github/workflows/hoffice-runtime-m11-health.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture the latest run of every active M11 experiment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p diagnostics build/health/logs
          python3 - <<'PY'
          import json,os,subprocess,urllib.parse
          from pathlib import Path

          repository=os.environ['GITHUB_REPOSITORY']
          branch=os.environ['GITHUB_REF_NAME']
          workflows=[
              'hoffice-runtime-m11-build-empty-fallback-host.yml',
              'hoffice-runtime-m11-empty-fallback-replay-v2.yml',
              'hoffice-runtime-m11-build-sendfile-fallback-host.yml',
              'hoffice-runtime-m11-sendfile-fallback-replay.yml',
              'hoffice-runtime-m11-build-empty-mask-matrix.yml',
              'hoffice-runtime-m11-empty-mask-matrix-replay.yml',
              'hoffice-runtime-m11-build-empty-buffer-host.yml',
              'hoffice-runtime-m11-empty-buffer-replay.yml',
              'hoffice-runtime-m11-build-short-buffer-host-v2.yml',
              'hoffice-runtime-m11-short-buffer-replay-v2.yml',
              'hoffice-runtime-m11-empty-caller-static.yml',
              'hoffice-runtime-m11-empty-caller-ghidra.yml',
              'hoffice-runtime-m11-orchestrator-v2.yml',
          ]
          entries=[]
          for workflow in workflows:
              query=urllib.parse.urlencode({'branch':branch,'per_page':5})
              try:
                  result=subprocess.run([
                      'gh','api','--method','GET',
                      f'repos/{repository}/actions/workflows/{workflow}/runs?{query}',
                  ],check=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
                  runs=json.loads(result.stdout).get('workflow_runs',[])
              except subprocess.CalledProcessError as error:
                  entries.append({'workflow':workflow,'lookup_error':error.stderr[-4000:]})
                  continue
              runs.sort(key=lambda item:item['created_at'],reverse=True)
              if not runs:
                  entries.append({'workflow':workflow,'status':'NO_RUN'})
                  continue
              run=runs[0]
              entry={
                  'workflow':workflow,
                  'run_id':str(run['id']),
                  'status':run['status'],
                  'conclusion':run.get('conclusion'),
                  'head_sha':run['head_sha'],
                  'display_title':run['display_title'],
                  'created_at':run['created_at'],
                  'updated_at':run['updated_at'],
                  'html_url':run['html_url'],
              }
              jobs=json.loads(subprocess.run([
                  'gh','api','--method','GET',
                  f'repos/{repository}/actions/runs/{run["id"]}/jobs?per_page=100',
              ],check=True,stdout=subprocess.PIPE,text=True).stdout).get('jobs',[])
              entry['jobs']=[{
                  'id':str(job['id']),
                  'name':job['name'],
                  'status':job['status'],
                  'conclusion':job.get('conclusion'),
                  'steps':[{
                      'number':step['number'],'name':step['name'],
                      'status':step['status'],'conclusion':step.get('conclusion')}
                      for step in job.get('steps',[])],
              } for job in jobs]
              failed=[job for job in jobs if job.get('conclusion')=='failure']
              snippets=[]
              for job in failed[:4]:
                  try:
                      log=subprocess.run([
                          'gh','api','--method','GET',
                          '-H','Accept: application/vnd.github+json',
                          f'repos/{repository}/actions/jobs/{job["id"]}/logs',
                      ],check=True,stdout=subprocess.PIPE,
                        stderr=subprocess.STDOUT).stdout.decode('utf-8','replace')
                      tail='\n'.join(log.splitlines()[-160:])
                      path=Path('build/health/logs')/f'{run["id"]}-{job["id"]}.txt'
                      path.write_text(tail+'\n',encoding='utf-8')
                      snippets.append({'job_id':str(job['id']),'tail':tail})
                  except Exception as error:
                      snippets.append({'job_id':str(job['id']),'log_error':repr(error)})
              entry['failed_job_log_tails']=snippets
              entries.append(entry)

          completed=[item for item in entries if item.get('status')=='completed']
          failures=[item for item in entries if item.get('conclusion')=='failure']
          active=[item for item in entries if item.get('status') in ('queued','in_progress','waiting','pending')]
          successful=[item for item in entries if item.get('conclusion')=='success']
          payload={
              'schema':1,
              'workflow_run':os.environ['GITHUB_RUN_ID'],
              'commit':os.environ['GITHUB_SHA'],
              'branch':branch,
              'workflow_count':len(workflows),
              'successful_count':len(successful),
              'failure_count':len(failures),
              'active_count':len(active),
              'completed_count':len(completed),
              'entries':entries,
          }
          encoded=json.dumps(payload,ensure_ascii=False,indent=2)+'\n'
          Path('diagnostics/m11-workflow-health-latest.json').write_text(
              encoded,encoding='utf-8')
          Path(f"diagnostics/m11-workflow-health-{os.environ['GITHUB_RUN_ID']}.json").write_text(
              encoded,encoding='utf-8')
          Path('diagnostics/m11-workflow-health-latest.md').write_text(
              '# HOffice M11 workflow health\n\n'
              f"- Successful: `{len(successful)}`\n"
              f"- Failed: `{len(failures)}`\n"
              f"- Active: `{len(active)}`\n\n"+
              '\n'.join(
                  f"- `{item['workflow']}`: `{item.get('status')}` / "
                  f"`{item.get('conclusion')}` (run `{item.get('run_id')}`)"
                  for item in entries)+'\n',
              encoding='utf-8')
          print(encoded)
          PY
      - name: Commit the durable workflow health record
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/m11-workflow-health-*.json \
                  diagnostics/m11-workflow-health-latest.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'diagnostic: record the live HOffice M11 workflow health'
          for attempt in $(seq 1 20); do
            if git push origin HEAD:codex/hoffice-runtime-from-scratch; then exit 0; fi
            git fetch origin codex/hoffice-runtime-from-scratch
            git rebase origin/codex/hoffice-runtime-from-scratch
            sleep "$attempt"
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hrt-m11-workflow-health
          path: |
            diagnostics/m11-workflow-health-*.json
            diagnostics/m11-workflow-health-latest.md
            build/health/logs
          if-no-files-found: warn
          retention-days: 14
