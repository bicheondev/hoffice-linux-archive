name: HOffice chain M5 offscreen integration constructor

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
    paths:
      - 'proofs/chain/m5-integration-create.json'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  probe:
    uses: ./.github/workflows/hoffice-runtime-guest-symbol-probe-chain.yml
    with:
      predecessor_proof: proofs/chain/m5-integration-create.json
      symbol_regex: 'QOffscreenIntegrationC1E'
      label: Qt offscreen integration constructor
      milestone: M5-chain-offscreen-integration-constructor
      diagnostic_path: diagnostics/chain/m5-integration-constructor.json
      proof_path: proofs/chain/m5-integration-constructor.json
      trace_limit: 64000
      run_seconds: 35
      require_pipe2: true
