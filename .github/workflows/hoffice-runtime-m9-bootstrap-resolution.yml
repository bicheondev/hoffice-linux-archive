name: HOffice runtime M9 bootstrap resolution

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
    paths:
      - 'runtime/m9/analyze_provider_artifact.py'
      - 'runtime/m9/augment_stack_locale.py'
      - 'runtime/m9/patch_provider_methods.py'
      - 'runtime/m9/augment_provider_culture_override.py'
      - '.github/workflows/hoffice-runtime-m9-bootstrap-resolution.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: hrt-m9-bootstrap-resolution-${{ github.ref }}
  cancel-in-progress: true

env:
  ROOTFS_ARTIFACT_ID: '8968324706'
  ROOTFS_ARTIFACT_SHA256: 3e301d3c6269926c62804bff18671136fcf8c0b0b22b3952072e427a8fa9918a
  ROOTFS_ARCHIVE_SHA256: 322fcf228092b296a34edbfa7ee43f9a7b237d5bcedaee50109ac4bb44d9ca28
  QPA_RUN_ID: '31166152504'
  ASSET_NAME: hoffice_11.20.0.1520+h1_amd64.deb
  RELEASE_TAG: linux-11.20-series
  PACKAGE_SHA256: 23fc502c430b4dd829fee36740fbce06b819cd51d36fcdf0afbb6fcc5d0b7c46
  PROGRAM: /opt/hnc/hoffice11/Bin/hword
  PROGRAM_SHA256: 55876ea7d0c20e73d936af11cc3623c418acb09d61bde5bfeecafa1da7a9b5cb
  PLUGIN_GUEST: /opt/hnc/hoffice11/Bin/qt/plugins/platforms/libqhrtappkit.so

jobs:
  prepare-exact-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deterministic analysis and locale tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends locales zstd binutils file ca-certificates unzip
          sudo localedef -i ko_KR -f UTF-8 ko_KR.UTF-8
          sudo localedef -i en_US -f UTF-8 en_US.UTF-8
          locale -a | tee locale-list.txt
          grep -Eiq '^ko_KR\.utf8$' locale-list.txt
          test -s /usr/lib/locale/locale-archive

      - name: Select the newest complete direct HWord throw artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p build/candidates build/direct-probe build/analysis build/report
          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/artifacts" \
            -f name=hrt-m9-hword-throw-int3-caller \
            -f per_page=100 >build/artifacts.json
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import shutil
          import subprocess
          import zipfile

          repository=os.environ['GITHUB_REPOSITORY']
          artifacts=json.loads(pathlib.Path('build/artifacts.json').read_text())['artifacts']
          candidates=[item for item in artifacts
              if not item['expired'] and
                 item.get('workflow_run',{}).get('head_branch')==
                    'codex/hoffice-runtime-from-scratch']
          candidates.sort(key=lambda item:item['created_at'],reverse=True)
          selected=None
          for item in candidates:
              candidate=pathlib.Path('build/candidates')/str(item['id'])
              candidate.mkdir(parents=True,exist_ok=True)
              archive=candidate/'artifact.zip'
              with archive.open('wb') as output:
                  subprocess.run([
                      'gh','api',
                      f'repos/{repository}/actions/artifacts/{item["id"]}/zip'],
                      check=True,stdout=output)
              with zipfile.ZipFile(archive) as zipped:
                  zipped.extractall(candidate/'expanded')
              expanded=candidate/'expanded'
              stderr_files=list(expanded.rglob('stderr.txt'))
              attribution=list(expanded.rglob('caller-attribution.json'))
              objects=list(expanded.rglob('libHwordApp.so'))
              if len(stderr_files)!=1 or len(attribution)!=1 or len(objects)!=1:
                  continue
              text=stderr_files[0].read_text(errors='replace')
              required=(
                  'HRT M9 THROW INT3:',
                  'HRT M9 THROW OBJECT:',
                  'HRT M9 THROW ARGS:',
                  'HRT M9 MAP:',
              )
              if not all(token in text for token in required):
                  continue
              selected=item
              shutil.copytree(expanded,'build/direct-probe',dirs_exist_ok=True)
              break
          if selected is None:
              raise SystemExit('no direct-probe artifact contains the complete M9 record')
          pathlib.Path('build/report/source-artifact.json').write_text(
              json.dumps(selected,indent=2)+'\n')
          pathlib.Path('build/report/source-run-id.txt').write_text(
              str(selected['workflow_run']['id'])+'\n')
          print(json.dumps(selected,indent=2))
          PY

      - name: Resolve the exact provider outputs and substr arguments
        run: |
          set -euxo pipefail
          source_run=$(cat build/report/source-run-id.txt)
          python3 runtime/m9/analyze_provider_artifact.py \
            build/direct-probe build/analysis --source-run "$source_run"
          cp build/analysis/diagnosis.json build/report/provider-diagnosis.json
          cp build/analysis/diagnosis.md build/report/provider-diagnosis.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          diagnosis=json.loads(Path('build/report/provider-diagnosis.json').read_text())
          substring=diagnosis['substring']
          assert diagnosis['status']=='PASS',diagnosis
          assert substring['position'] > substring['source_size'],substring
          assert diagnosis['provider_address_owners']['method_130'],diagnosis
          assert diagnosis['provider_address_owners']['method_138'],diagnosis
          print(json.dumps({
              'classification':diagnosis['classification'],
              'substring':substring,
              'provider_type':diagnosis['provider']['type_name'],
              'method_130':diagnosis['provider_address_owners']['method_130'],
              'method_138':diagnosis['provider_address_owners']['method_138'],
          },indent=2))
          PY

      - name: Download and verify the exact HWord root and package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p build/input/rootfs build/input/deb build/rootfs
          curl --fail --location --retry 5 --retry-delay 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ROOTFS_ARTIFACT_ID/zip" \
            -o build/input/rootfs-artifact.zip
          printf '%s  %s\n' "$ROOTFS_ARTIFACT_SHA256" \
            build/input/rootfs-artifact.zip | sha256sum --check -
          unzip -q build/input/rootfs-artifact.zip -d build/input/rootfs
          printf '%s  %s\n' "$ROOTFS_ARCHIVE_SHA256" \
            build/input/rootfs/hword-rootfs.tar.gz | sha256sum --check -
          tar -xzf build/input/rootfs/hword-rootfs.tar.gz -C build/rootfs
          test -s build/rootfs/.hrt-prepatched-v1
          test -f "build/rootfs$PROGRAM"

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_NAME" \
            --dir build/input/deb
          printf '%s  %s\n' "$PACKAGE_SHA256" \
            "build/input/deb/$ASSET_NAME" | sha256sum --check -

      - name: Restore full exact fonts, locale archive and compatibility aliases
        run: |
          set -euxo pipefail
          deb="build/input/deb/$ASSET_NAME"
          data_member=$(ar t "$deb" | awk '/^data\.tar/{print; exit}')
          test -n "$data_member"
          ar p "$deb" "$data_member" >"build/input/deb/$data_member"
          tar -xf "build/input/deb/$data_member" -C build/rootfs \
            ./opt/hnc/hoffice11/Shared/Fonts \
            ./opt/hnc/hoffice11/Shared/TTF
          rm -f build/rootfs/opt/hnc/hoffice1
          ln -s hoffice11 build/rootfs/opt/hnc/hoffice1
          test "$(readlink build/rootfs/opt/hnc/hoffice1)" = hoffice11
          test -f build/rootfs/opt/hnc/hoffice1/Shared/Fonts/HGSMJ.HFT
          test -f build/rootfs/opt/hnc/hoffice11/Shared/TTF/Install/HanSantteutDotum-Regular.ttf

          install -D -m 0644 /usr/lib/locale/locale-archive \
            build/rootfs/usr/lib/locale/locale-archive
          if test -f /usr/share/locale/locale.alias; then
            install -D -m 0644 /usr/share/locale/locale.alias \
              build/rootfs/usr/share/locale/locale.alias
          fi
          mkdir -p build/rootfs/home/hrt/.config \
                   build/rootfs/home/hrt/.local/share
          chmod 0700 build/rootfs/home/hrt

          {
            sha256sum build/rootfs/usr/lib/locale/locale-archive
            printf 'HFT files: %s\n' \
              "$(find build/rootfs/opt/hnc/hoffice11/Shared/Fonts -type f | wc -l)"
            printf 'TTF files: %s\n' \
              "$(find build/rootfs/opt/hnc/hoffice11/Shared/TTF -type f | wc -l)"
          } | tee build/report/enriched-payload-lock.txt
          test "$(find build/rootfs/opt/hnc/hoffice11/Shared/Fonts -type f | wc -l)" -ge 400
          test "$(find build/rootfs/opt/hnc/hoffice11/Shared/TTF -type f | wc -l)" -ge 130

      - name: Create deterministic prepared rootfs
        run: |
          set -euxo pipefail
          tar --sort=name --mtime='UTC 2026-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -C build/rootfs -cf - . \
            | zstd -T0 -12 -o build/hword-m9-prepared-rootfs.tar.zst
          sha256sum build/hword-m9-prepared-rootfs.tar.zst \
            >build/report/hword-m9-prepared-rootfs.tar.zst.sha256
          ls -lh build/hword-m9-prepared-rootfs.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: hrt-m9-bootstrap-prepared-guest
          path: |
            build/hword-m9-prepared-rootfs.tar.zst
            build/report
            locale-list.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  resolve-on-apple-silicon:
    needs: prepare-exact-guest
    runs-on: macos-14
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: hrt-m9-bootstrap-prepared-guest
          path: build/input/prepared
      - uses: actions/download-artifact@v4
        with:
          name: hrt-m8-qt5113-hrtappkit-input-qpa
          path: build/input/qpa
          repository: ${{ github.repository }}
          run-id: ${{ env.QPA_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Reconstruct the case-sensitive exact HWord guest
        run: |
          set -euxo pipefail
          mkdir -p build/generated build/objects-baseline build/objects-override \
                   build/host build/proof/baseline build/proof/override diagnostics proofs
          expected=$(awk '{print $1; exit}' \
            build/input/prepared/report/hword-m9-prepared-rootfs.tar.zst.sha256)
          actual=$(shasum -a 256 \
            build/input/prepared/hword-m9-prepared-rootfs.tar.zst | awk '{print $1}')
          test "$actual" = "$expected"

          image="$RUNNER_TEMP/hrt-m9-resolution.sparsebundle"
          root="/tmp/h9resolve-$GITHUB_RUN_ID"
          rm -rf "$image" "$root"; mkdir -p "$root"
          if ! hdiutil create -quiet -size 12g -fs APFSX \
               -volname HRTM9RESOLVE -type SPARSEBUNDLE "$image"; then
            rm -rf "$image"
            hdiutil create -quiet -size 12g -fs HFSX \
              -volname HRTM9RESOLVE -type SPARSEBUNDLE "$image"
          fi
          hdiutil attach -quiet -nobrowse -mountpoint "$root" "$image"
          echo "HRT_ROOT=$root" >>"$GITHUB_ENV"
          echo "HRT_IMAGE=$image" >>"$GITHUB_ENV"
          zstd -dc build/input/prepared/hword-m9-prepared-rootfs.tar.zst \
            | tar -xf - -C "$root"
          test -s "$root/.hrt-prepatched-v1"
          test -f "$root$PROGRAM"
          test -s "$root/usr/lib/locale/locale-archive"
          test -f "$root/opt/hnc/hoffice1/Shared/Fonts/HGSMJ.HFT"
          cp build/input/prepared/report/provider-diagnosis.json \
            build/proof/provider-diagnosis.json

          mkdir -p "$root$(dirname "$PLUGIN_GUEST")"
          python3 - build/input/qpa/libqhrtappkit.so.xz \
            build/input/qpa/lock.json "$root$PLUGIN_GUEST" <<'PY'
          import hashlib,json,lzma,pathlib,sys
          compressed=pathlib.Path(sys.argv[1]).read_bytes()
          lock=json.loads(pathlib.Path(sys.argv[2]).read_text())
          assert lock['toolchain']['qt_version']=='5.11.3'
          assert hashlib.sha256(compressed).hexdigest()==lock['plugin']['xz_sha256']
          plugin=lzma.decompress(compressed)
          assert hashlib.sha256(plugin).hexdigest()==lock['plugin']['sha256_after_prepatch']
          pathlib.Path(sys.argv[3]).write_bytes(plugin)
          pathlib.Path('build/proof/qpa-lock.json').write_text(
              json.dumps(lock,indent=2)+'\n')
          PY
          chmod 0755 "$root$PLUGIN_GUEST"
          diskutil info "$root" | tee build/proof/guest-volume.txt
          grep -F 'Case-sensitive' build/proof/guest-volume.txt

      - name: Generate shared AppKit, stack and Linux bridge sources
        run: |
          set -euxo pipefail
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          /usr/bin/arch -x86_64 /usr/bin/getconf PAGESIZE \
            | tee build/proof/x86-page-size.txt
          sw_vers | tee build/proof/sw-vers.txt

          python3 runtime/m8/augment_appkit_adapter_input.py \
            runtime/m6/appkit_adapter.m build/generated/appkit_adapter_m8.m
          python3 runtime/m6/augment_stack_hrtappkit.py \
            runtime/m3/stack.c build/generated/stack-m6.c
          python3 runtime/m9/augment_stack_locale.py \
            build/generated/stack-m6.c build/generated/stack.c
          grep -F 'LANG=ko_KR.UTF-8' build/generated/stack.c
          grep -F 'LC_ALL=ko_KR.UTF-8' build/generated/stack.c

          python3 runtime/m3/augment_syscalls.py \
            runtime/m3/syscall_bridge.c build/generated/stage1.c
          python3 runtime/m3/augment_directory_syscalls.py \
            build/generated/stage1.c build/generated/stage2.c
          python3 runtime/m3/augment_directory_stream.py \
            build/generated/stage2.c build/generated/stage3.c
          python3 runtime/m3/augment_pipe2.py \
            build/generated/stage3.c build/generated/stage4.c
          python3 runtime/m3/augment_eventfd2.py \
            build/generated/stage4.c build/generated/stage5.c
          python3 runtime/m3/augment_crash_signals.py \
            build/generated/stage5.c build/generated/stage6.c
          python3 runtime/m3/augment_poll.py \
            build/generated/stage6.c build/generated/stage7.c
          python3 runtime/m3/augment_posix_basics.py \
            build/generated/stage7.c build/generated/stage8.c
          python3 runtime/m3/augment_connect.py \
            build/generated/stage8.c build/generated/stage9.c
          python3 runtime/m6/augment_appkit_hostcall_deferred.py \
            build/generated/stage9.c build/generated/stage10.c
          python3 runtime/m3/augment_darwin_syscall_abi.py \
            build/generated/stage10.c build/generated/syscall-baseline.c
          python3 - <<'PY'
          from pathlib import Path
          path=Path('build/generated/syscall-baseline.c')
          path.write_text(path.read_text().replace(
              '#define M3_TRACE_LIMIT 256u','#define M3_TRACE_LIMIT 30000u'))
          PY

      - name: Compile the locale-complete baseline runtime
        run: |
          set -euxo pipefail
          common=(-arch x86_64 -std=c17 -O2 -g -fno-stack-protector \
            -fno-omit-frame-pointer -Wall -Wextra -Werror -Wpedantic \
            -Wno-unused-function -Wno-unused-variable \
            -Iruntime/m8 -Iruntime/m6 -Iruntime/m3 -Iruntime/m1)
          index=0
          for source in runtime/m6/main.c runtime/m6/hostcall_trampoline.c \
            runtime/m1/common.c runtime/m3/elf_map.c build/generated/stack.c \
            runtime/m3/patch.c build/generated/syscall-baseline.c; do
            clang "${common[@]}" -c "$source" \
              -o "build/objects-baseline/c-${index}.o"
            index=$((index+1))
          done
          clang -arch x86_64 -std=c17 -O2 -g -fobjc-arc \
            -Wall -Wextra -Werror -Wpedantic -Iruntime/m8 -Iruntime/m6 \
            -c build/generated/appkit_adapter_m8.m \
            -o build/objects-baseline/appkit-adapter.o
          clang -arch x86_64 -std=c17 -O2 -g -fobjc-arc \
            -Wall -Wextra -Werror -Wpedantic -Iruntime/m8 -Iruntime/m6 \
            -c runtime/m8/appkit_input.m \
            -o build/objects-baseline/appkit-input.o
          clang -arch x86_64 -g -c runtime/m1/enter_guest.S \
            -o build/objects-baseline/enter-guest.o
          clang -arch x86_64 -g -c runtime/m6/hostcall_trampoline.S \
            -o build/objects-baseline/hostcall-trampoline.o
          clang -arch x86_64 build/objects-baseline/*.o \
            -Wl,-pagezero_size,0x1000 \
            -framework AppKit -framework CoreGraphics -framework ImageIO \
            -o build/host/hrt-m9-baseline
          codesign --force --sign - --timestamp=none build/host/hrt-m9-baseline
          codesign --verify --strict build/host/hrt-m9-baseline

      - name: Run the locale-complete baseline
        run: |
          set -uxo pipefail
          export HRT_M6_CAPTURE_PATH="$PWD/build/proof/baseline/pre-frame-window.png"
          export HRT_M7_CAPTURE_PATH="$PWD/build/proof/baseline/frame.png"
          unset HRT_M8_SYNTHETIC_INPUT
          : >build/proof/baseline/stdout.txt
          : >build/proof/baseline/stderr.txt
          /usr/bin/arch -x86_64 build/host/hrt-m9-baseline \
            --root "$HRT_ROOT" --program "$PROGRAM" \
            >build/proof/baseline/stdout.txt \
            2>build/proof/baseline/stderr.txt &
          pid=$!
          frame_seen=0
          for _ in $(jot 1200); do
            if grep -q 'HRT M7 QPA: BGRA frame accepted' \
                 build/proof/baseline/stderr.txt 2>/dev/null; then
              frame_seen=1
              sleep 10
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 0.05
          done
          alive=0
          if [ "$frame_seen" -eq 1 ] && kill -0 "$pid" 2>/dev/null; then alive=1; fi
          if kill -0 "$pid" 2>/dev/null; then
            ps -o pid,ppid,state,%cpu,%mem,etime,command -p "$pid" \
              >build/proof/baseline/process.txt 2>&1 || true
            /usr/bin/sample "$pid" 1 1 \
              -file build/proof/baseline/sample.txt >/dev/null 2>&1 || true
            kill -TERM "$pid" 2>/dev/null || true
            sleep 0.25
            kill -KILL "$pid" 2>/dev/null || true
          fi
          set +e; wait "$pid"; raw_status=$?; set -e
          printf '%s\n' "$raw_status" >build/proof/baseline/raw-exit-status.txt
          printf '%s\n' "$frame_seen" >build/proof/baseline/frame-seen.txt
          printf '%s\n' "$alive" >build/proof/baseline/alive-after-frame.txt

      - name: Classify baseline before any binary override
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          root=Path('build/proof/baseline')
          stderr=(root/'stderr.txt').read_text(errors='replace')
          titles=[]; geometries=[]
          for line in re.findall(r'HRT M6 QPA: CREATE .*',stderr):
              title=re.search(r' title=(.*?) handle=',line)
              geometry=re.search(r' geometry=(\d+)x(\d+)',line)
              if title: titles.append(title.group(1))
              if geometry: geometries.append([
                  int(geometry.group(1)),int(geometry.group(2))])
          frame=root/'frame.png'
          frame_present=frame.is_file() and frame.stat().st_size>0
          alive=bool(int((root/'alive-after-frame.txt').read_text()))
          init_error='Initialization Error' in titles
          throw_seen=('__pos (which is' in stderr or 'std::out_of_range' in stderr)
          nonerror_titles=[title for title in titles if title!='Initialization Error']
          if not titles: classification='NO_NATIVE_QT_WINDOW'
          elif init_error and not nonerror_titles: classification='INITIALIZATION_ERROR_REMAINS'
          elif throw_seen: classification='SUBSTR_EXCEPTION_REMAINS'
          elif frame_present and alive: classification='BASELINE_STABLE_FRAME'
          elif frame_present: classification='BASELINE_FRAME_PROCESS_EXITED'
          else: classification='BASELINE_NONERROR_WINDOW_WITHOUT_FRAME'
          result={
              'status':'PASS' if classification=='BASELINE_STABLE_FRAME' else 'DIAGNOSTIC',
              'classification':classification,
              'window_titles':titles,'window_geometries':geometries,
              'frame_present':frame_present,
              'frame_sha256':hashlib.sha256(frame.read_bytes()).hexdigest()
                  if frame_present else None,
              'alive_after_frame':alive,
              'initialization_error_observed':init_error,
              'substr_exception_observed':throw_seen,
              'raw_exit_status':int((root/'raw-exit-status.txt').read_text()),
          }
          (root/'summary.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY

      - name: Patch and compile the exact provider fallback only when needed
        run: |
          set -euxo pipefail
          baseline=$(python3 -c "import json;print(json.load(open('build/proof/baseline/summary.json'))['status'])")
          if [ "$baseline" = PASS ]; then
            echo 'Baseline passed; exact provider override is intentionally skipped.'
            touch build/proof/override/skipped
            exit 0
          fi

          python3 runtime/m9/patch_provider_methods.py \
            --root "$HRT_ROOT" \
            --diagnosis build/proof/provider-diagnosis.json \
            --manifest build/proof/override/provider-patch-manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          diagnosis=json.loads(Path('build/proof/provider-diagnosis.json').read_text())
          matched=diagnosis['substring']['matching_provider_sources']
          if matched==['second_string']:
              value130,value138='UTF-8','ko_KR'
          else:
              value130,value138='ko_KR','UTF-8'
          config={'value_130':value130,'value_138':value138,
                  'matched_provider_sources':matched}
          Path('build/proof/override/config.json').write_text(
              json.dumps(config,indent=2)+'\n')
          Path('build/proof/override/values.env').write_text(
              f'VALUE_130={value130}\nVALUE_138={value138}\n')
          print(json.dumps(config,indent=2))
          PY
          source build/proof/override/values.env
          python3 runtime/m9/augment_provider_culture_override.py \
            build/generated/syscall-baseline.c \
            build/proof/override/provider-patch-manifest.json \
            build/generated/syscall-override.c \
            --value-130 "$VALUE_130" --value-138 "$VALUE_138"

          common=(-arch x86_64 -std=c17 -O2 -g -fno-stack-protector \
            -fno-omit-frame-pointer -Wall -Wextra -Werror -Wpedantic \
            -Wno-unused-function -Wno-unused-variable \
            -Iruntime/m8 -Iruntime/m6 -Iruntime/m3 -Iruntime/m1)
          index=0
          for source_file in runtime/m6/main.c runtime/m6/hostcall_trampoline.c \
            runtime/m1/common.c runtime/m3/elf_map.c build/generated/stack.c \
            runtime/m3/patch.c build/generated/syscall-override.c; do
            clang "${common[@]}" -c "$source_file" \
              -o "build/objects-override/c-${index}.o"
            index=$((index+1))
          done
          cp build/objects-baseline/appkit-adapter.o \
             build/objects-override/appkit-adapter.o
          cp build/objects-baseline/appkit-input.o \
             build/objects-override/appkit-input.o
          cp build/objects-baseline/enter-guest.o \
             build/objects-override/enter-guest.o
          cp build/objects-baseline/hostcall-trampoline.o \
             build/objects-override/hostcall-trampoline.o
          clang -arch x86_64 build/objects-override/*.o \
            -Wl,-pagezero_size,0x1000 \
            -framework AppKit -framework CoreGraphics -framework ImageIO \
            -o build/host/hrt-m9-provider-override
          codesign --force --sign - --timestamp=none \
            build/host/hrt-m9-provider-override
          codesign --verify --strict build/host/hrt-m9-provider-override

      - name: Run the exact provider fallback when compiled
        run: |
          set -uxo pipefail
          if test -f build/proof/override/skipped; then exit 0; fi
          export HRT_M6_CAPTURE_PATH="$PWD/build/proof/override/pre-frame-window.png"
          export HRT_M7_CAPTURE_PATH="$PWD/build/proof/override/frame.png"
          unset HRT_M8_SYNTHETIC_INPUT
          : >build/proof/override/stdout.txt
          : >build/proof/override/stderr.txt
          /usr/bin/arch -x86_64 build/host/hrt-m9-provider-override \
            --root "$HRT_ROOT" --program "$PROGRAM" \
            >build/proof/override/stdout.txt \
            2>build/proof/override/stderr.txt &
          pid=$!
          frame_seen=0
          for _ in $(jot 1200); do
            if grep -q 'HRT M7 QPA: BGRA frame accepted' \
                 build/proof/override/stderr.txt 2>/dev/null; then
              frame_seen=1
              sleep 10
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 0.05
          done
          alive=0
          if [ "$frame_seen" -eq 1 ] && kill -0 "$pid" 2>/dev/null; then alive=1; fi
          if kill -0 "$pid" 2>/dev/null; then
            ps -o pid,ppid,state,%cpu,%mem,etime,command -p "$pid" \
              >build/proof/override/process.txt 2>&1 || true
            /usr/bin/sample "$pid" 1 1 \
              -file build/proof/override/sample.txt >/dev/null 2>&1 || true
            kill -TERM "$pid" 2>/dev/null || true
            sleep 0.25
            kill -KILL "$pid" 2>/dev/null || true
          fi
          set +e; wait "$pid"; raw_status=$?; set -e
          printf '%s\n' "$raw_status" >build/proof/override/raw-exit-status.txt
          printf '%s\n' "$frame_seen" >build/proof/override/frame-seen.txt
          printf '%s\n' "$alive" >build/proof/override/alive-after-frame.txt

      - name: Classify the fallback and select the exact M9 frontier
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path

          baseline=json.loads(Path('build/proof/baseline/summary.json').read_text())
          override_root=Path('build/proof/override')
          override=None
          if not (override_root/'skipped').exists():
              stderr=(override_root/'stderr.txt').read_text(errors='replace')
              titles=[]; geometries=[]
              for line in re.findall(r'HRT M6 QPA: CREATE .*',stderr):
                  title=re.search(r' title=(.*?) handle=',line)
                  geometry=re.search(r' geometry=(\d+)x(\d+)',line)
                  if title: titles.append(title.group(1))
                  if geometry: geometries.append([
                      int(geometry.group(1)),int(geometry.group(2))])
              markers=[line for line in stderr.splitlines()
                       if line.startswith('HRT M9 PROVIDER OVERRIDE:')]
              frame=override_root/'frame.png'
              frame_present=frame.is_file() and frame.stat().st_size>0
              alive=bool(int((override_root/'alive-after-frame.txt').read_text()))
              init_error='Initialization Error' in titles
              throw_seen=('__pos (which is' in stderr or
                          'std::out_of_range' in stderr)
              nonerror=[title for title in titles if title!='Initialization Error']
              if len(markers)<2: classification='PROVIDER_OVERRIDE_INCOMPLETE'
              elif not titles: classification='NO_NATIVE_QT_WINDOW'
              elif init_error and not nonerror: classification='INITIALIZATION_ERROR_REMAINS'
              elif throw_seen: classification='SUBSTR_EXCEPTION_REMAINS'
              elif frame_present and alive: classification='OVERRIDE_STABLE_FRAME'
              elif frame_present: classification='OVERRIDE_FRAME_PROCESS_EXITED'
              else: classification='OVERRIDE_NONERROR_WINDOW_WITHOUT_FRAME'
              override={
                  'status':'PASS' if classification=='OVERRIDE_STABLE_FRAME'
                                  else 'DIAGNOSTIC',
                  'classification':classification,
                  'window_titles':titles,'window_geometries':geometries,
                  'override_markers':markers,
                  'frame_present':frame_present,
                  'frame_sha256':hashlib.sha256(frame.read_bytes()).hexdigest()
                      if frame_present else None,
                  'alive_after_frame':alive,
                  'initialization_error_observed':init_error,
                  'substr_exception_observed':throw_seen,
                  'raw_exit_status':int((override_root/'raw-exit-status.txt').read_text()),
                  'config':json.loads((override_root/'config.json').read_text()),
              }
              (override_root/'summary.json').write_text(
                  json.dumps(override,indent=2)+'\n')

          if baseline['status']=='PASS':
              frontier='NORMAL_KOREAN_LOCALE_BOOTSTRAP_PASS'
              status='PASS'
              production_path='locale-and-resource-restoration'
          elif override and override['status']=='PASS':
              frontier='EXPERIMENTAL_PROVIDER_OVERRIDE_PASS'
              status='EXPERIMENTAL_PASS'
              production_path='unresolved-provider-source'
          else:
              frontier='M9_BOOTSTRAP_UNRESOLVED'
              status='DIAGNOSTIC'
              production_path='unresolved'

          result={
              'schema':1,'milestone':'M9-bootstrap-resolution',
              'status':status,'frontier':frontier,
              'workflow_run':os.environ['GITHUB_RUN_ID'],
              'commit':os.environ['GITHUB_SHA'],
              'program':os.environ['PROGRAM'],
              'program_sha256':os.environ['PROGRAM_SHA256'],
              'production_path':production_path,
              'provider_diagnosis':json.loads(Path(
                  'build/proof/provider-diagnosis.json').read_text()),
              'baseline':baseline,'provider_override':override,
          }
          payload=json.dumps(result,indent=2)+'\n'
          Path('diagnostics/m9-bootstrap-resolution-latest.json').write_text(payload)
          Path(f"diagnostics/m9-bootstrap-resolution-{os.environ['GITHUB_RUN_ID']}.json").write_text(payload)
          Path('diagnostics/m9-bootstrap-resolution-latest.md').write_text(
              '# Exact HWord M9 bootstrap resolution\n\n'
              f"- Status: `{status}`\n"
              f"- Frontier: `{frontier}`\n"
              f"- Production path: `{production_path}`\n"
              f"- Baseline: `{baseline['classification']}`\n"
              f"- Provider override: `{override['classification'] if override else 'SKIPPED'}`\n")
          if status=='PASS':
              Path('proofs/m9-hword-normal-bootstrap.json').write_text(payload)
          elif status=='EXPERIMENTAL_PASS':
              Path('proofs/m9-hword-provider-override-bootstrap.json').write_text(payload)
          print(payload)
          PY

      - name: Commit the durable M9 resolution
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin codex/hoffice-runtime-from-scratch
          git add diagnostics/m9-bootstrap-resolution-*.json \
                  diagnostics/m9-bootstrap-resolution-latest.md
          if test -f proofs/m9-hword-normal-bootstrap.json; then
            git add proofs/m9-hword-normal-bootstrap.json
          fi
          if test -f proofs/m9-hword-provider-override-bootstrap.json; then
            git add proofs/m9-hword-provider-override-bootstrap.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'diagnostic: resolve exact HWord M9 bootstrap frontier'
            git push origin HEAD:codex/hoffice-runtime-from-scratch
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hrt-m9-bootstrap-resolution-proof
          path: |
            build/host
            build/proof
            diagnostics/m9-bootstrap-resolution-*.json
            diagnostics/m9-bootstrap-resolution-latest.md
            proofs/m9-hword-normal-bootstrap.json
            proofs/m9-hword-provider-override-bootstrap.json
          if-no-files-found: warn
          retention-days: 14

      - name: Detach the exact HWord guest
        if: always()
        run: hdiutil detach -quiet "$HRT_ROOT" || true
