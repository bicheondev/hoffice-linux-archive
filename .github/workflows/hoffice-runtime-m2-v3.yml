name: HOffice runtime M2 glibc bootstrap v3

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
    paths:
      - 'runtime/m1/test_main.S'
      - 'runtime/m2/**'
      - '.github/workflows/hoffice-runtime-m2-v3.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build-linux-assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build TLS probe rootfs
        run: |
          set -euxo pipefail
          mkdir -p build/tls-rootfs/lib64 build/tls-rootfs/opt/hrt build/objects
          clang -c -nostdlib -fPIC runtime/m2/test_tls_interp.S \
            -o build/objects/test_tls_interp.o
          ld -shared -nostdlib --build-id=none -z max-page-size=4096 \
            -e _start build/objects/test_tls_interp.o \
            -o build/tls-rootfs/lib64/ld-hrt-m2-tls.so
          clang -c -nostdlib -fPIE runtime/m1/test_main.S \
            -o build/objects/test_main.o
          ld -pie -nostdlib --build-id=none -z max-page-size=4096 \
            -e _start --dynamic-linker /lib64/ld-hrt-m2-tls.so \
            build/objects/test_main.o -o build/tls-rootfs/opt/hrt/main
          readelf -lW build/tls-rootfs/opt/hrt/main \
            | grep -F 'Requesting program interpreter: /lib64/ld-hrt-m2-tls.so'

      - name: Build real glibc rootfs
        run: |
          set -euxo pipefail
          mkdir -p build/glibc-rootfs/lib64 \
                   build/glibc-rootfs/lib/x86_64-linux-gnu \
                   build/glibc-rootfs/opt/hrt
          cc -O2 -fPIE -pie -fno-stack-protector \
            -Wl,--build-id=none \
            -Wl,--dynamic-linker=/lib64/ld-linux-x86-64.so.2 \
            runtime/m2/test_dynamic.c \
            -o build/glibc-rootfs/opt/hrt/dynamic-main
          loader=$(realpath "$(gcc -print-file-name=ld-linux-x86-64.so.2)")
          libc=$(realpath "$(gcc -print-file-name=libc.so.6)")
          cp -L "$loader" build/glibc-rootfs/lib64/ld-linux-x86-64.so.2
          cp -L "$libc" build/glibc-rootfs/lib/x86_64-linux-gnu/libc.so.6
          readelf -lW build/glibc-rootfs/opt/hrt/dynamic-main \
            | grep -F 'Requesting program interpreter: /lib64/ld-linux-x86-64.so.2'
          readelf -dW build/glibc-rootfs/opt/hrt/dynamic-main \
            | grep -F 'Shared library: [libc.so.6]'

      - uses: actions/upload-artifact@v4
        with:
          name: hrt-m2-v3-linux-assets
          path: |
            build/tls-rootfs
            build/glibc-rootfs
          if-no-files-found: error
          retention-days: 14

  execute-on-apple-silicon:
    needs: build-linux-assets
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hrt-m2-v3-linux-assets
          path: build

      - name: Ensure Rosetta is available
        run: |
          set -euxo pipefail
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          /usr/bin/arch -x86_64 /usr/bin/getconf PAGESIZE \
            | tee build/x86-page-size.txt

      - name: Compile TLS semantic probe
        run: |
          set -euxo pipefail
          mkdir -p build/host
          clang -arch x86_64 -std=c17 -O2 -g \
            -Wall -Wextra -Werror -Wpedantic \
            -fno-stack-protector -mfsgsbase \
            runtime/m2/main.c runtime/m2/common.c runtime/m2/elf_map.c \
            runtime/m2/stack.c runtime/m2/tls_syscall_bridge_v2.c \
            runtime/m2/fs_trampoline.S runtime/m2/enter_guest.S \
            -Wl,-pagezero_size,0x1000 -o build/host/hrt-m2-tls-v2
          codesign --force --sign - --timestamp=none build/host/hrt-m2-tls-v2
          codesign --verify --strict build/host/hrt-m2-tls-v2

      - name: Prove ARCH_SET_FS across trapped syscalls
        run: |
          set -euxo pipefail
          /usr/bin/arch -x86_64 build/host/hrt-m2-tls-v2 \
            --rootfs "$PWD/build/tls-rootfs" --program /opt/hrt/main \
            >build/tls-stdout.txt 2>build/tls-stderr.txt
          cat build/tls-stderr.txt
          cat build/tls-stdout.txt
          grep -Fx 'HRT M2 TLS: ARCH_SET_FS survived signal-return and another syscall' \
            build/tls-stdout.txt
          grep -Fx 'HRT M1: main program reached through synthetic Linux interpreter' \
            build/tls-stdout.txt

      - name: Generate and compile the full FS-safe M2 bridge
        run: |
          set -euxo pipefail
          python3 runtime/m2/build_syscall_bridge_v3.py \
            runtime/m2/syscall_bridge.c build/syscall_bridge_v3.c
          grep -F 'hrt_set_fs_trampoline' build/syscall_bridge_v3.c
          grep -F 'g_guest_fs_base' build/syscall_bridge_v3.c
          clang -arch x86_64 -std=c17 -O2 -g \
            -Wall -Wextra -Werror -Wpedantic \
            -fno-stack-protector -mfsgsbase \
            -include runtime/m2/mmap_shim.h \
            runtime/m2/main.c runtime/m2/common.c runtime/m2/elf_map.c \
            runtime/m2/stack.c build/syscall_bridge_v3.c \
            runtime/m2/mmap_shim.c runtime/m2/fs_trampoline.S \
            runtime/m2/enter_guest.S \
            -Wl,-pagezero_size,0x1000 -o build/host/hrt-m2-v3
          file build/host/hrt-m2-v3
          lipo -info build/host/hrt-m2-v3
          codesign --force --sign - --timestamp=none build/host/hrt-m2-v3
          codesign --verify --strict build/host/hrt-m2-v3

      - name: Start real ld-linux and glibc
        run: |
          set -uxo pipefail
          set +e
          python3 - <<'PY'
          import pathlib
          import subprocess

          root = pathlib.Path.cwd()
          command = [
              '/usr/bin/arch', '-x86_64', str(root / 'build/host/hrt-m2-v3'),
              '--rootfs', str(root / 'build/glibc-rootfs'),
              '--program', '/opt/hrt/dynamic-main',
          ]
          try:
              with (root / 'build/glibc-stdout.txt').open('wb') as stdout, \
                   (root / 'build/glibc-stderr.txt').open('wb') as stderr:
                  completed = subprocess.run(command, stdout=stdout, stderr=stderr,
                                             timeout=30, check=False)
              status = completed.returncode
          except subprocess.TimeoutExpired:
              status = 124
          (root / 'build/glibc-exit-status.txt').write_text(f'{status}\n')
          PY
          status=$(cat build/glibc-exit-status.txt)
          set -e
          echo '--- glibc stderr ---'
          cat build/glibc-stderr.txt || true
          echo '--- glibc stdout ---'
          cat build/glibc-stdout.txt || true
          echo "--- glibc exit status: $status ---"
          test "$status" -eq 0
          grep -Fx 'HRT M2: real ld-linux and glibc reached the dynamic main program' \
            build/glibc-stdout.txt

      - name: Write durable M2 proof
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p proofs
          cat > proofs/m2-glibc-bootstrap.json <<JSON
          {
            "schema": 1,
            "milestone": "M2",
            "status": "PASS",
            "commit": "$GITHUB_SHA",
            "workflow_run": "$GITHUB_RUN_ID",
            "runner": "macos-14-arm64",
            "guest": "Ubuntu glibc dynamic PIE",
            "proof": "HRT M2: real ld-linux and glibc reached the dynamic main program"
          }
          JSON
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proofs/m2-glibc-bootstrap.json
          git commit -m 'proof: verify M2 real glibc bootstrap [skip ci]'
          git push origin HEAD:codex/hoffice-runtime-from-scratch
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" \
            --body "M2 PASS: real ld-linux and glibc bootstrap completed on Apple Silicon macOS. Run: $GITHUB_RUN_ID, commit: $GITHUB_SHA."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hrt-m2-v3-macos-proof
          path: |
            build/host
            build/tls-rootfs
            build/glibc-rootfs
            build/x86-page-size.txt
            build/tls-stdout.txt
            build/tls-stderr.txt
            build/glibc-stdout.txt
            build/glibc-stderr.txt
            build/glibc-exit-status.txt
          if-no-files-found: warn
          retention-days: 14
