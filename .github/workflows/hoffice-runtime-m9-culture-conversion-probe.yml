name: HOffice runtime M9 culture conversion probe

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
    paths:
      - 'runtime/m9/patch_elf_int3_probe_address.py'
      - 'runtime/m9/augment_culture_conversion_probe.py'
      - '.github/workflows/hoffice-runtime-m9-culture-conversion-probe.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: hrt-m9-culture-conversion-${{ github.ref }}
  cancel-in-progress: true

env:
  ROOTFS_ARTIFACT_ID: '8968324706'
  ROOTFS_ARTIFACT_SHA256: 3e301d3c6269926c62804bff18671136fcf8c0b0b22b3952072e427a8fa9918a
  ROOTFS_ARCHIVE_SHA256: 322fcf228092b296a34edbfa7ee43f9a7b237d5bcedaee50109ac4bb44d9ca28
  QPA_RUN_ID: '31166152504'
  ASSET_NAME: hoffice_11.20.0.1520+h1_amd64.deb
  RELEASE_TAG: linux-11.20-series
  PACKAGE_SHA256: 23fc502c430b4dd829fee36740fbce06b819cd51d36fcdf0afbb6fcc5d0b7c46
  PROGRAM: /opt/hnc/hoffice11/Bin/hword
  PROGRAM_SHA256: 55876ea7d0c20e73d936af11cc3623c418acb09d61bde5bfeecafa1da7a9b5cb
  HWORD_APP: /opt/hnc/hoffice11/Bin/libHwordApp.so
  HWORD_APP_SHA256: e8523db3ae977771dddc8fbc5ac03c1a3410b28629e4136d31583a31c3806d50
  PLUGIN_GUEST: /opt/hnc/hoffice11/Bin/qt/plugins/platforms/libqhrtappkit.so

jobs:
  capture-conversion:
    runs-on: macos-14
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: before
            virtual_address: '0x411133'
            expected_prefix: 'ff5020'
            exit_status: '194'
          - mode: after
            virtual_address: '0x411136'
            expected_prefix: '4889e8'
            exit_status: '195'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require exact GetCulture result proof
        run: |
          set -euxo pipefail
          test -s diagnostics/m9-framework-culture-latest.json
          grep -F '"status": "PASS"' \
            diagnostics/m9-framework-culture-latest.json
          grep -F '"returned_utf16": "zh-CN"' \
            diagnostics/m9-framework-culture-latest.json

      - uses: actions/download-artifact@v4
        with:
          name: hrt-m8-qt5113-hrtappkit-input-qpa
          path: build/input/qpa
          repository: ${{ github.repository }}
          run-id: ${{ env.QPA_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download and verify the exact root and package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p build/input/hword build/input/deb build/generated \
                   build/objects build/host build/proof
          curl --fail --location --retry 5 --retry-delay 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ROOTFS_ARTIFACT_ID/zip" \
            -o build/input/hword-artifact.zip
          printf '%s  %s\n' "$ROOTFS_ARTIFACT_SHA256" \
            build/input/hword-artifact.zip | shasum -a 256 -c -
          ditto -x -k build/input/hword-artifact.zip build/input/hword
          printf '%s  %s\n' "$ROOTFS_ARCHIVE_SHA256" \
            build/input/hword/hword-rootfs.tar.gz | shasum -a 256 -c -
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_NAME" \
            --dir build/input/deb
          printf '%s  %s\n' "$PACKAGE_SHA256" \
            "build/input/deb/$ASSET_NAME" | shasum -a 256 -c -

      - name: Reconstruct and patch the exact full-font guest
        env:
          PROBE_MODE: ${{ matrix.mode }}
          PROBE_VIRTUAL_ADDRESS: ${{ matrix.virtual_address }}
          PROBE_EXPECTED_PREFIX: ${{ matrix.expected_prefix }}
        run: |
          set -euxo pipefail
          image="$RUNNER_TEMP/hrt-m9-conversion-$PROBE_MODE.sparsebundle"
          root="/tmp/h9cv-$PROBE_MODE-$GITHUB_RUN_ID"
          rm -rf "$image" "$root"; mkdir -p "$root"
          if ! hdiutil create -quiet -size 12g -fs APFSX \
               -volname HRTM9CV -type SPARSEBUNDLE "$image"; then
            rm -rf "$image"
            hdiutil create -quiet -size 12g -fs HFSX \
              -volname HRTM9CV -type SPARSEBUNDLE "$image"
          fi
          hdiutil attach -quiet -nobrowse -mountpoint "$root" "$image"
          echo "HRT_ROOT=$root" >>"$GITHUB_ENV"
          echo "HRT_IMAGE=$image" >>"$GITHUB_ENV"
          tar -xzf build/input/hword/hword-rootfs.tar.gz -C "$root"
          test -s "$root/.hrt-prepatched-v1"
          printf '%s  %s\n' "$HWORD_APP_SHA256" "$root$HWORD_APP" \
            | shasum -a 256 -c -

          deb="build/input/deb/$ASSET_NAME"
          data_member=$(ar t "$deb" | awk '/^data\.tar/{print; exit}')
          test -n "$data_member"
          ar p "$deb" "$data_member" >"build/input/deb/$data_member"
          tar -xf "build/input/deb/$data_member" -C "$root" \
            ./opt/hnc/hoffice11/Shared/Fonts \
            ./opt/hnc/hoffice11/Shared/TTF
          rm -f "$root/opt/hnc/hoffice1"
          ln -s hoffice11 "$root/opt/hnc/hoffice1"
          test -f "$root/opt/hnc/hoffice1/Shared/Fonts/HGSMJ.HFT"

          mkdir -p "$root$(dirname "$PLUGIN_GUEST")"
          python3 - build/input/qpa/libqhrtappkit.so.xz \
            build/input/qpa/lock.json "$root$PLUGIN_GUEST" <<'PY'
          import hashlib,json,lzma,pathlib,sys
          compressed=pathlib.Path(sys.argv[1]).read_bytes()
          lock=json.loads(pathlib.Path(sys.argv[2]).read_text())
          assert hashlib.sha256(compressed).hexdigest()==lock['plugin']['xz_sha256']
          plugin=lzma.decompress(compressed)
          assert hashlib.sha256(plugin).hexdigest()==lock['plugin']['sha256_after_prepatch']
          pathlib.Path(sys.argv[3]).write_bytes(plugin)
          PY
          chmod 0755 "$root$PLUGIN_GUEST"

          python3 runtime/m9/patch_elf_int3_probe_address.py \
            "$root$HWORD_APP" \
            --virtual-address "$PROBE_VIRTUAL_ADDRESS" \
            --expected-prefix "$PROBE_EXPECTED_PREFIX" \
            --label "culture-conversion-$PROBE_MODE" \
            --signature-length 24 \
            --manifest "build/proof/conversion-$PROBE_MODE-manifest.json"
          diskutil info "$root" | tee build/proof/guest-volume.txt
          grep -F 'Case-sensitive' build/proof/guest-volume.txt

      - name: Generate and compile the terminal conversion probe
        env:
          PROBE_MODE: ${{ matrix.mode }}
          PROBE_EXIT_STATUS: ${{ matrix.exit_status }}
        run: |
          set -euxo pipefail
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          python3 runtime/m6/augment_stack_hrtappkit.py \
            runtime/m3/stack.c build/generated/stack.c
          python3 runtime/m3/augment_syscalls.py \
            runtime/m3/syscall_bridge.c build/generated/stage1.c
          python3 runtime/m3/augment_directory_syscalls.py \
            build/generated/stage1.c build/generated/stage2.c
          python3 runtime/m3/augment_directory_stream.py \
            build/generated/stage2.c build/generated/stage3.c
          python3 runtime/m3/augment_pipe2.py \
            build/generated/stage3.c build/generated/stage4.c
          python3 runtime/m3/augment_eventfd2.py \
            build/generated/stage4.c build/generated/stage5.c
          python3 runtime/m3/augment_crash_signals.py \
            build/generated/stage5.c build/generated/stage6.c
          python3 runtime/m3/augment_poll.py \
            build/generated/stage6.c build/generated/stage7.c
          python3 runtime/m3/augment_posix_basics.py \
            build/generated/stage7.c build/generated/stage8.c
          python3 runtime/m3/augment_connect.py \
            build/generated/stage8.c build/generated/stage9.c
          python3 runtime/m6/augment_appkit_hostcall_deferred.py \
            build/generated/stage9.c build/generated/stage10.c
          python3 runtime/m3/augment_darwin_syscall_abi.py \
            build/generated/stage10.c build/generated/stage11.c
          python3 runtime/m9/augment_exec_mmap_trace.py \
            build/generated/stage11.c build/generated/stage12.c
          python3 runtime/m9/augment_culture_conversion_probe.py \
            build/generated/stage12.c \
            "build/proof/conversion-$PROBE_MODE-manifest.json" \
            build/generated/syscall_bridge.c \
            --mode "$PROBE_MODE" --exit-status "$PROBE_EXIT_STATUS"
          python3 - <<'PY'
          from pathlib import Path
          path=Path('build/generated/syscall_bridge.c')
          path.write_text(path.read_text().replace(
              '#define M3_TRACE_LIMIT 256u','#define M3_TRACE_LIMIT 30000u'))
          PY

          common=(-arch x86_64 -std=c17 -O2 -g -fno-stack-protector \
            -fno-omit-frame-pointer -Wall -Wextra -Werror -Wpedantic \
            -Wno-unused-function -Wno-unused-variable \
            -Iruntime/m6 -Iruntime/m3 -Iruntime/m1)
          index=0
          for source in runtime/m6/main.c runtime/m6/hostcall_trampoline.c \
            runtime/m1/common.c runtime/m3/elf_map.c build/generated/stack.c \
            runtime/m3/patch.c build/generated/syscall_bridge.c; do
            clang "${common[@]}" -c "$source" \
              -o "build/objects/c-${index}.o"
            index=$((index+1))
          done
          clang -arch x86_64 -std=c17 -O2 -g -fobjc-arc \
            -Wall -Wextra -Werror -Wpedantic -Iruntime/m6 \
            -c runtime/m6/appkit_adapter.m \
            -o build/objects/appkit-adapter.o
          clang -arch x86_64 -g -c runtime/m1/enter_guest.S \
            -o build/objects/enter-guest.o
          clang -arch x86_64 -g -c runtime/m6/hostcall_trampoline.S \
            -o build/objects/hostcall-trampoline.o
          clang -arch x86_64 build/objects/*.o -Wl,-pagezero_size,0x1000 \
            -framework AppKit -framework CoreGraphics -framework ImageIO \
            -o "build/host/hrt-m9-conversion-$PROBE_MODE"
          codesign --force --sign - --timestamp=none \
            "build/host/hrt-m9-conversion-$PROBE_MODE"
          codesign --verify --strict \
            "build/host/hrt-m9-conversion-$PROBE_MODE"

      - name: Execute exact HWord until the conversion probe
        env:
          PROBE_MODE: ${{ matrix.mode }}
          PROBE_EXIT_STATUS: ${{ matrix.exit_status }}
        run: |
          set -uxo pipefail
          : >"build/proof/$PROBE_MODE-stdout.txt"
          : >"build/proof/$PROBE_MODE-stderr.txt"
          set +e
          /usr/bin/arch -x86_64 \
            "build/host/hrt-m9-conversion-$PROBE_MODE" \
            --root "$HRT_ROOT" --program "$PROGRAM" \
            >"build/proof/$PROBE_MODE-stdout.txt" \
            2>"build/proof/$PROBE_MODE-stderr.txt"
          status=$?
          set -e
          printf '%s\n' "$status" \
            >"build/proof/$PROBE_MODE-exit-status.txt"
          grep -F "HRT M9 CONVERSION: mode=$PROBE_MODE" \
            "build/proof/$PROBE_MODE-stderr.txt" \
            | tee "build/proof/conversion-$PROBE_MODE-line.txt"
          grep -F 'HRT M9 MAP:' \
            "build/proof/$PROBE_MODE-stderr.txt" \
            >"build/proof/$PROBE_MODE-executable-maps.txt" || true
          test "$status" -eq "$PROBE_EXIT_STATUS"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hrt-m9-culture-conversion-${{ matrix.mode }}
          path: |
            build/host/hrt-m9-conversion-${{ matrix.mode }}
            build/proof
          if-no-files-found: warn
          retention-days: 14

      - name: Detach the exact HWord guest
        if: always()
        run: hdiutil detach -quiet "$HRT_ROOT" || true

  persist-result:
    needs: capture-conversion
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: hrt-m9-culture-conversion-*
          path: build/input
          merge-multiple: false

      - name: Persist the exact conversion argument and output state
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json,os,pathlib,re
          before_path=next(pathlib.Path('build/input').rglob(
              'conversion-before-line.txt'))
          after_path=next(pathlib.Path('build/input').rglob(
              'conversion-after-line.txt'))
          before_line=before_path.read_text().strip()
          after_line=after_path.read_text().strip()
          before_pattern=re.compile(
              r'HRT M9 CONVERSION: mode=before label=(\S+) site=(0x[0-9a-f]+) '
              r'receiver=(0x[0-9a-f]+) vtable=(0x[0-9a-f]+) '
              r'method20=(0x[0-9a-f]+) wide-pointer=(0x[0-9a-f]+) '
              r'wide=(.*?) rdx-destination=(0x[0-9a-f]+) '
              r'outer-rbp-destination=(0x[0-9a-f]+)$')
          after_pattern=re.compile(
              r'HRT M9 CONVERSION: mode=after label=(\S+) site=(0x[0-9a-f]+) '
              r'destination=(0x[0-9a-f]+) data=(0x[0-9a-f]+) '
              r'length=(0x[0-9a-f]+) capacity-or-inline=(0x[0-9a-f]+) '
              r'text=(.*?) return-rax=(0x[0-9a-f]+) receiver=(0x[0-9a-f]+)$')
          before=before_pattern.fullmatch(before_line); assert before,before_line
          after=after_pattern.fullmatch(after_line); assert after,after_line
          result={
              'schema':1,
              'milestone':'M9-culture-conversion-call',
              'status':'PASS',
              'workflow_run':os.environ['GITHUB_RUN_ID'],
              'commit':os.environ['GITHUB_SHA'],
              'program':os.environ['PROGRAM'],
              'program_sha256':os.environ['PROGRAM_SHA256'],
              'package_sha256':os.environ['PACKAGE_SHA256'],
              'before':{
                  'probe_site':before.group(2),
                  'receiver':before.group(3),
                  'receiver_vtable':before.group(4),
                  'method20':before.group(5),
                  'wide_pointer':before.group(6),
                  'wide_preview':before.group(7),
                  'rdx_destination':before.group(8),
                  'outer_rbp_destination':before.group(9),
                  'destination_matches_outer_rbp':
                      before.group(8)==before.group(9),
              },
              'after':{
                  'probe_site':after.group(2),
                  'destination':after.group(3),
                  'data':after.group(4),
                  'length':int(after.group(5),16),
                  'capacity_or_inline':after.group(6),
                  'text':after.group(7),
                  'conversion_return_rax':after.group(8),
                  'receiver':after.group(9),
              },
              'note':'Before and after probes use separate ASLR processes; raw pointers are not compared across runs.',
          }
          if not result['before']['destination_matches_outer_rbp']:
              result['conclusion']='The conversion virtual call receives a stale or unrelated RDX destination instead of the outer std::string return object.'
          elif result['after']['length']==0:
              result['conclusion']='The conversion receives the correct destination but produces an empty std::string.'
          else:
              result['conclusion']='The conversion produces a non-empty std::string; the later empty string arises after this return.'
          pathlib.Path('diagnostics').mkdir(exist_ok=True)
          payload=json.dumps(result,indent=2)+'\n'
          pathlib.Path(
              f"diagnostics/m9-culture-conversion-{os.environ['GITHUB_RUN_ID']}.json").write_text(payload)
          pathlib.Path('diagnostics/m9-culture-conversion-latest.json').write_text(payload)
          pathlib.Path('diagnostics/m9-culture-conversion-latest.md').write_text(
              '# HWord M9 culture conversion\n\n'
              f"- Wide input: `{result['before']['wide_preview']}`\n"
              f"- RDX destination: `{result['before']['rdx_destination']}`\n"
              f"- Outer destination: `{result['before']['outer_rbp_destination']}`\n"
              f"- Destinations match: `{result['before']['destination_matches_outer_rbp']}`\n"
              f"- Output length: `{result['after']['length']}`\n"
              f"- Output text: `{result['after']['text']}`\n"
              f"- Conclusion: {result['conclusion']}\n"
          )
          print(payload)
          PY

      - name: Commit the durable conversion diagnostic
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin codex/hoffice-runtime-from-scratch
          git add diagnostics/m9-culture-conversion-*.json \
                  diagnostics/m9-culture-conversion-latest.md
          if ! git diff --cached --quiet; then
            git commit -m 'diagnostic: capture exact HWord culture conversion'
            git push origin HEAD:codex/hoffice-runtime-from-scratch
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: hrt-m9-culture-conversion-result
          path: diagnostics/m9-culture-conversion-*
          if-no-files-found: error
          retention-days: 14
