name: HOffice runtime M8 supervisor cleanup

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
    paths:
      - '.github/workflows/hoffice-runtime-m8-supervisor-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hrt-m8-supervisor-cleanup-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_BRANCH: codex/hoffice-runtime-from-scratch

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Clone the exact target branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --single-branch \
            --branch "$TARGET_BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          git -C repo config user.name github-actions[bot]
          git -C repo config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Wait for the fail-closed v3 result and remove transient scaffolding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          for _ in $(seq 1 420); do
            git -C repo fetch origin "$TARGET_BRANCH"
            git -C repo reset --hard "origin/$TARGET_BRANCH"
            if [ -s repo/diagnostics/m8-pipeline-supervisor-v3.json ]; then
              break
            fi
            sleep 10
          done
          test -s repo/diagnostics/m8-pipeline-supervisor-v3.json
          rm -f \
            repo/.github/workflows/hoffice-runtime-m8-supervisor.yml \
            repo/.github/workflows/hoffice-runtime-m8-supervisor-v2.yml \
            repo/runtime/m6/qpa/.m8-input-rebuild-trigger-20260807 \
            repo/runtime/m8/.m8-input-replay-trigger-20260807 \
            repo/runtime/m6/qpa/.m8-supervisor-publish-trigger \
            repo/runtime/m8/.m8-supervisor-replay-trigger
          git -C repo add -A
          if git -C repo diff --cached --quiet; then
            exit 0
          fi
          git -C repo commit -m 'ci: remove superseded M8 supervisor triggers [skip ci]'
          for _ in $(seq 1 12); do
            if git -C repo push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            fi
            git -C repo fetch origin "$TARGET_BRANCH"
            git -C repo rebase "origin/$TARGET_BRANCH"
          done
          exit 1
