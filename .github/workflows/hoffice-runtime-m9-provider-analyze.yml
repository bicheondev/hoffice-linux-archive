name: HOffice runtime M9 provider diagnosis

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
    paths:
      - '.github/workflows/hoffice-runtime-m9-provider-analyze.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: hrt-m9-provider-diagnosis-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_RUN_ID: '31171219264'
  SOURCE_ARTIFACT: hrt-m9-hword-throw-int3-caller

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the exact direct-probe artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: build/input
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Resolve the caller, provider object and returned strings
        run: |
          set -euxo pipefail
          mkdir -p build/analysis diagnostics
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import shutil
          import struct

          root = pathlib.Path('build/input')
          attribution_files = list(root.rglob('caller-attribution.json'))
          stderr_files = list(root.rglob('stderr.txt'))
          object_files = list(root.rglob('libHwordApp.so'))
          assert len(attribution_files) == 1, attribution_files
          assert len(stderr_files) == 1, stderr_files
          assert len(object_files) == 1, object_files

          attribution = json.loads(attribution_files[0].read_text())
          stderr = stderr_files[0].read_text(errors='replace')
          object_path = object_files[0]
          assert hashlib.sha256(object_path.read_bytes()).hexdigest() == \
              attribution['caller_object_sha256']

          throw_lines = [line for line in stderr.splitlines()
                         if line.startswith('HRT M9 THROW INT3:')]
          object_lines = [line for line in stderr.splitlines()
                          if line.startswith('HRT M9 THROW OBJECT:')]
          assert len(throw_lines) == 1, throw_lines
          assert len(object_lines) == 1, object_lines

          object_pattern = re.compile(
              r'HRT M9 THROW OBJECT: '
              r'rbx=(0x[0-9a-f]+) r12=(0x[0-9a-f]+) '
              r'r13=(0x[0-9a-f]+) r14=(0x[0-9a-f]+) '
              r'r15=(0x[0-9a-f]+) rbp=(0x[0-9a-f]+) '
              r'vtable=(0x[0-9a-f]+) offset-to-top=(0x[0-9a-f]+) '
              r'typeinfo=(0x[0-9a-f]+) '
              r'type-name-pointer=(0x[0-9a-f]+) type-name=(.*?) '
              r'method130=(0x[0-9a-f]+) method138=(0x[0-9a-f]+) '
              r'first-data=(0x[0-9a-f]+) first-length=(0x[0-9a-f]+) '
              r'first=(.*?) second-data=(0x[0-9a-f]+) '
              r'second-length=(0x[0-9a-f]+) second=(.*)$')
          object_match = object_pattern.fullmatch(object_lines[0])
          assert object_match, object_lines[0]

          keys = [
              'rbx','r12','r13','r14','r15','rbp','vtable',
              'offset_to_top','typeinfo','type_name_pointer','type_name',
              'method_130','method_138','first_data','first_length_hex',
              'first_string','second_data','second_length_hex','second_string',
          ]
          provider = dict(zip(keys, object_match.groups()))
          provider['first_length'] = int(provider.pop('first_length_hex'), 16)
          provider['second_length'] = int(provider.pop('second_length_hex'), 16)

          file_offset = int(attribution['caller_file_offset'])
          blob = object_path.read_bytes()
          header = struct.unpack_from('<16sHHIQQQIHHHHHH', blob, 0)
          ident = header[0]
          assert ident[:4] == b'\x7fELF' and ident[4] == 2 and ident[5] == 1
          phoff, phentsize, phnum = header[5], header[9], header[10]
          assert phentsize == 56
          virtual = None
          segment = None
          for index in range(phnum):
              values = struct.unpack_from(
                  '<IIQQQQQQ', blob, phoff + index * phentsize)
              p_type,p_flags,p_offset,p_vaddr,_paddr,p_filesz,p_memsz,p_align = values
              if p_type == 1 and p_offset <= file_offset < p_offset + p_filesz:
                  virtual = p_vaddr + file_offset - p_offset
                  segment = {
                      'index': index,
                      'flags': p_flags,
                      'file_offset': p_offset,
                      'virtual_address': p_vaddr,
                      'file_size': p_filesz,
                      'memory_size': p_memsz,
                      'alignment': p_align,
                  }
                  break
          assert virtual is not None, (file_offset, object_path)

          if provider['first_length'] < 3:
              classification = 'FIRST_PROVIDER_STRING_SHORTER_THAN_SUBSTR_POSITION'
          elif provider['second_length'] < 3:
              classification = 'SECOND_PROVIDER_STRING_SHORTER_THAN_THREE'
          else:
              classification = 'PROVIDER_STRINGS_LONG_ENOUGH_REQUIRES_CALLSITE_REVIEW'

          resolved = {
              **attribution,
              'schema': 1,
              'milestone': 'M9-provider-diagnosis',
              'status': 'PASS',
              'analysis_workflow_run': os.environ['GITHUB_RUN_ID'],
              'source_workflow_run': os.environ['SOURCE_RUN_ID'],
              'classification': classification,
              'provider': provider,
              'caller_object_virtual_address': virtual,
              'caller_load_segment': segment,
              'throw_line': throw_lines[0],
              'provider_line': object_lines[0],
          }
          pathlib.Path('build/analysis/caller-attribution-resolved.json').write_text(
              json.dumps(resolved, indent=2) + '\n')
          pathlib.Path('build/analysis/start.txt').write_text(
              str(max(0, virtual - 512)) + '\n')
          pathlib.Path('build/analysis/stop.txt').write_text(
              str(virtual + 512) + '\n')
          shutil.copy2(object_path, 'build/analysis/libHwordApp.so')
          print(json.dumps(resolved, indent=2))
          PY

          start=$(cat build/analysis/start.txt)
          stop=$(cat build/analysis/stop.txt)
          object=build/analysis/libHwordApp.so
          file "$object" | tee build/analysis/file.txt
          readelf -hW "$object" | tee build/analysis/elf-header.txt
          readelf -lW "$object" | tee build/analysis/program-headers.txt
          readelf -dW "$object" | tee build/analysis/dynamic.txt
          readelf -Ws "$object" | tee build/analysis/symbols.txt
          objdump -dC --start-address="$start" --stop-address="$stop" \
            "$object" | tee build/analysis/callsite-disassembly.txt

      - name: Resolve the nearest available symbol and persist the diagnosis
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          result = json.loads(pathlib.Path(
              'build/analysis/caller-attribution-resolved.json').read_text())
          target = int(result['caller_object_virtual_address'])
          symbols = []
          pattern = re.compile(
              r'^\s*\d+:\s+([0-9a-fA-F]+)\s+(\d+)\s+(\S+)\s+(\S+)\s+'
              r'(\S+)\s+(\S+)\s+(.*)$')
          for line in pathlib.Path('build/analysis/symbols.txt').read_text(
                  errors='replace').splitlines():
              match = pattern.match(line)
              if not match:
                  continue
              value = int(match.group(1), 16)
              size = int(match.group(2))
              name = match.group(7).strip()
              if value == 0 or not name:
                  continue
              symbols.append({
                  'value': value,
                  'size': size,
                  'type': match.group(3),
                  'binding': match.group(4),
                  'name': name,
              })
          containing = [item for item in symbols
                        if item['value'] <= target and
                        (item['size'] == 0 or target < item['value'] + item['size'])]
          preceding = [item for item in symbols if item['value'] <= target]
          nearest = max(containing or preceding,
                        key=lambda item: item['value'], default=None)
          result['nearest_symbol'] = nearest
          result['offset_from_nearest_symbol'] = (
              target - nearest['value'] if nearest else None)
          result['callsite_disassembly'] = pathlib.Path(
              'build/analysis/callsite-disassembly.txt').read_text(errors='replace')

          payload = json.dumps(result, indent=2) + '\n'
          pathlib.Path('diagnostics').mkdir(exist_ok=True)
          run_path = pathlib.Path(
              f"diagnostics/m9-hword-provider-{os.environ['GITHUB_RUN_ID']}.json")
          run_path.write_text(payload)
          pathlib.Path('diagnostics/m9-hword-provider-latest.json').write_text(payload)
          provider = result['provider']
          pathlib.Path('diagnostics/m9-hword-provider-latest.md').write_text(
              '# HWord M9 bootstrap provider diagnosis\n\n'
              f"- Classification: `{result['classification']}`\n"
              f"- Caller object: `{result['caller_guest_path']}`\n"
              f"- Caller file offset: `0x{result['caller_file_offset']:x}`\n"
              f"- Caller virtual address: `0x{target:x}`\n"
              f"- Nearest symbol: `{nearest['name'] if nearest else None}`\n"
              f"- Provider type: `{provider['type_name']}`\n"
              f"- Provider vtable: `{provider['vtable']}`\n"
              f"- Virtual slot 0x130: `{provider['method_130']}`\n"
              f"- Virtual slot 0x138: `{provider['method_138']}`\n"
              f"- First string length: `{provider['first_length']}`\n"
              f"- First string: `{provider['first_string']}`\n"
              f"- Second string length: `{provider['second_length']}`\n"
              f"- Second string: `{provider['second_string']}`\n"
          )
          print(payload)
          PY

      - name: Commit the durable provider diagnosis
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin codex/hoffice-runtime-from-scratch
          git add diagnostics/m9-hword-provider-*.json \
                  diagnostics/m9-hword-provider-latest.md
          if ! git diff --cached --quiet; then
            git commit -m 'diagnostic: persist exact HWord bootstrap provider state'
            git push origin HEAD:codex/hoffice-runtime-from-scratch
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: hrt-m9-hword-provider-analysis
          path: |
            build/analysis
            diagnostics/m9-hword-provider-*.json
            diagnostics/m9-hword-provider-latest.md
          if-no-files-found: error
          retention-days: 14
