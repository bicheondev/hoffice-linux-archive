name: HOffice runtime M5 HWord directory bridge

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
    paths:
      - 'runtime/m3/augment_directory_syscalls.py'
      - '.github/workflows/hoffice-runtime-m5-hword-dirents.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: hrt-m5-hword-dirents-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_RUN_ID: '31102898765'
  PROGRAM: /opt/hnc/hoffice11/Bin/hword
  PROGRAM_SHA256: 55876ea7d0c20e73d936af11cc3623c418acb09d61bde5bfeecafa1da7a9b5cb

jobs:
  discover-offscreen-qpa:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Download the verified HWord shadow root
        uses: actions/download-artifact@v4
        with:
          name: hrt-m5-hword-offscreen-rootfs
          path: build/input
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Create and verify a case-sensitive guest filesystem
        run: |
          set -euxo pipefail
          shasum -a 256 -c build/input/hword-rootfs.tar.gz.sha256
          image="$RUNNER_TEMP/hrt-m5-dirents.sparsebundle"
          root="$RUNNER_TEMP/hrt-m5-dirents-root"
          rm -rf "$image" "$root"
          mkdir -p "$root" build/host build/generated build/proof
          if ! hdiutil create -quiet -size 8g -fs APFSX \
               -volname HRTM5D -type SPARSEBUNDLE "$image"; then
            rm -rf "$image"
            hdiutil create -quiet -size 8g -fs HFSX \
              -volname HRTM5D -type SPARSEBUNDLE "$image"
          fi
          hdiutil attach -quiet -nobrowse -mountpoint "$root" "$image"
          echo "HRT_ROOT=$root" >> "$GITHUB_ENV"
          echo "HRT_IMAGE=$image" >> "$GITHUB_ENV"
          tar -xzf build/input/hword-rootfs.tar.gz -C "$root"
          test -s "$root/.hrt-closure-v1.json"
          test -s "$root/.hrt-prepatched-v1"
          test -f "$root$PROGRAM"
          test -d "$root/opt/hnc/hoffice11/Bin/Hword"
          test -f "$root/opt/hnc/hoffice11/Bin/qt/plugins/platforms/libqoffscreen.so"
          python3 - "$root" "$PROGRAM" "$PROGRAM_SHA256" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          guest = sys.argv[2]
          expected_original = sys.argv[3]
          image = root / guest.lstrip('/')
          marker = json.loads((root / '.hrt-prepatched-v1').read_text())
          records = [item for item in marker['objects'] if item['path'] == guest]
          assert len(records) == 1, records
          record = records[0]
          assert record['sha256_before'] == expected_original, record
          actual = hashlib.sha256(image.read_bytes()).hexdigest()
          assert actual == record['sha256_after'], (actual, record)
          pathlib.Path('build/proof/hword-prepatch-lock.json').write_text(
              json.dumps(record, indent=2) + '\n')
          PY
          diskutil info "$root" | tee build/proof/guest-volume.txt

      - name: Ensure Rosetta is available
        run: |
          set -euxo pipefail
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          /usr/bin/arch -x86_64 /usr/bin/true
          /usr/bin/arch -x86_64 /usr/bin/getconf PAGESIZE \
            | tee build/proof/x86-page-size.txt

      - name: Generate the directory-aware M3 syscall bridge
        run: |
          set -euxo pipefail
          python3 runtime/m3/augment_syscalls.py \
            runtime/m3/syscall_bridge.c \
            build/generated/syscall_bridge-stage1.c
          python3 runtime/m3/augment_directory_syscalls.py \
            build/generated/syscall_bridge-stage1.c \
            build/generated/syscall_bridge.c
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build/generated/syscall_bridge.c')
          text = path.read_text()
          text = text.replace('#define M3_TRACE_LIMIT 256u',
                              '#define M3_TRACE_LIMIT 8192u')
          path.write_text(text)
          PY
          grep -q 'case LINUX_SYS_GETDENTS64' build/generated/syscall_bridge.c
          grep -q 'DARWIN_SYS_GETDIRENTRIES64' build/generated/syscall_bridge.c
          grep -q 'case LINUX_SYS_PRCTL' build/generated/syscall_bridge.c
          grep -q '#define M3_TRACE_LIMIT 8192u' build/generated/syscall_bridge.c

      - name: Compile and sign the instrumented HWord host
        run: |
          set -euxo pipefail
          clang -arch x86_64 -std=c17 -O2 -g \
            -fno-stack-protector -fno-omit-frame-pointer \
            -Wall -Wextra -Werror -Wpedantic \
            -Iruntime/m3 -Iruntime/m1 \
            runtime/m3/main.c runtime/m1/common.c runtime/m3/elf_map.c \
            runtime/m3/stack.c runtime/m3/patch.c \
            build/generated/syscall_bridge.c runtime/m1/enter_guest.S \
            -Wl,-pagezero_size,0x1000 -o build/host/hrt-m5-dirents
          file build/host/hrt-m5-dirents | tee build/proof/host-file.txt
          lipo -info build/host/hrt-m5-dirents | tee build/proof/host-arch.txt
          codesign --force --sign - --timestamp=none build/host/hrt-m5-dirents
          codesign --verify --strict build/host/hrt-m5-dirents

      - name: Run exact HWord through Qt platform discovery
        run: |
          set -uxo pipefail
          : >build/proof/stdout.txt
          : >build/proof/stderr.txt
          /usr/bin/arch -x86_64 build/host/hrt-m5-dirents \
            --root "$HRT_ROOT" --program "$PROGRAM" \
            >build/proof/stdout.txt 2>build/proof/stderr.txt &
          guest_pid=$!
          reached_deadline=1
          for _ in $(jot 300); do
            if ! kill -0 "$guest_pid" 2>/dev/null; then
              reached_deadline=0
              break
            fi
            sleep 0.05
          done
          if [ "$reached_deadline" -ne 0 ]; then
            ps -o pid,ppid,state,%cpu,%mem,etime,command -p "$guest_pid" \
              >build/proof/process.txt 2>&1 || true
            /usr/bin/sample "$guest_pid" 1 1 \
              -file build/proof/sample.txt >/dev/null 2>&1 || true
            kill -TERM "$guest_pid" 2>/dev/null || true
            sleep 0.2
            kill -KILL "$guest_pid" 2>/dev/null || true
          fi
          set +e
          wait "$guest_pid"
          status=$?
          set -e
          if [ "$reached_deadline" -ne 0 ]; then status=124; fi
          printf '%s\n' "$status" >build/proof/exit-status.txt
          printf '%s\n' "$reached_deadline" >build/proof/reached-deadline.txt
          echo '--- stderr tail ---'
          tail -n 1600 build/proof/stderr.txt || true
          echo '--- stdout tail ---'
          tail -n 300 build/proof/stdout.txt || true
          echo '--- process ---'
          cat build/proof/process.txt 2>/dev/null || true
          echo "--- status: $status; reached-deadline: $reached_deadline ---"

      - name: Prove directory translation and classify the next boundary
        run: |
          set -euxo pipefail
          grep -Fx 'hrt-m3: verified instruction-boundary shadow root enabled' \
            build/proof/stderr.txt
          grep -F 'libqoffscreen.so' build/proof/stderr.txt
          ! grep -F 'Linux syscall ENOSYS 217' build/proof/stderr.txt
          ! grep -F 'Linux syscall ENOSYS 157' build/proof/stderr.txt
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          stderr = Path('build/proof/stderr.txt').read_text(errors='replace')
          stdout = Path('build/proof/stdout.txt').read_text(errors='replace')
          status = int(Path('build/proof/exit-status.txt').read_text())
          deadline = bool(int(Path('build/proof/reached-deadline.txt').read_text()))
          unsupported = sorted({
              int(match.group(1))
              for line in stderr.splitlines()
              if (match := re.search(r'Linux syscall ENOSYS ([0-9]+)', line))
          })
          summary = {
              'status': status,
              'reached_deadline': deadline,
              'getdents64_translated': 217 not in unsupported,
              'pr_capbset_read_translated': 157 not in unsupported,
              'offscreen_plugin_observed': 'libqoffscreen.so' in stderr,
              'offscreen_metadata_observed': (
                  'Got keys from plugin meta data ("offscreen")' in stderr or
                  'Found metadata in lib' in stderr and 'libqoffscreen.so' in stderr
              ),
              'offscreen_library_loaded': (
                  'loaded library' in stderr and 'libqoffscreen.so' in stderr
              ),
              'qt_platform_error_observed': (
                  'Could not find the Qt platform plugin' in stderr or
                  'Could not load the Qt platform plugin' in stderr
              ),
              'fatal_signal_observed': 'fatal signal' in stderr,
              'unsupported_syscalls': unsupported,
              'stdout_tail': stdout[-1000:],
          }
          Path('build/proof/summary.json').write_text(
              json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hrt-m5-hword-dirents-proof
          path: |
            build/host/hrt-m5-dirents
            build/generated/syscall_bridge.c
            build/proof
          if-no-files-found: warn
          retention-days: 14

      - name: Detach the case-sensitive guest filesystem
        if: always()
        run: hdiutil detach -quiet "$HRT_ROOT" || true
