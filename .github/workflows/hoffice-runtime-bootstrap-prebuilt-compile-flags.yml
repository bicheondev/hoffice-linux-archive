name: Bootstrap prebuilt QPA generated-helper compile flags

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
    paths:
      - '.github/workflows/hoffice-runtime-bootstrap-prebuilt-compile-flags.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hrt-bootstrap-prebuilt-compile-flags-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BRANCH: codex/hoffice-runtime-from-scratch
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clone the exact branch
        shell: bash
        run: |
          set -euxo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          rm -rf /tmp/hrt-prebuilt-flags
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            clone --depth=1 --branch "$BRANCH" \
            "https://github.com/$GITHUB_REPOSITORY.git" /tmp/hrt-prebuilt-flags
          cd /tmp/hrt-prebuilt-flags
          git config "http.https://github.com/.extraheader" \
            "AUTHORIZATION: basic $auth"
          git rev-parse HEAD

      - name: Permit intentionally retained generated compatibility helpers
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/hrt-prebuilt-flags
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/hoffice-runtime-m6-hword-prebuilt-qpa.yml')
          text = path.read_text()
          old = (
              '            -Wall -Wextra -Werror -Wpedantic\n'
              '            -Iruntime/m6 -Iruntime/m3 -Iruntime/m1\n'
          )
          new = (
              '            -Wall -Wextra -Werror -Wpedantic\n'
              '            -Wno-unused-function -Wno-unused-variable\n'
              '            -Iruntime/m6 -Iruntime/m3 -Iruntime/m1\n'
          )
          count = text.count(old)
          assert count == 1, count
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- .github/workflows/hoffice-runtime-m6-hword-prebuilt-qpa.yml

      - name: Commit the focused compile repair
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/hrt-prebuilt-flags
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/hoffice-runtime-m6-hword-prebuilt-qpa.yml
          git commit -m 'ci: tolerate retained generated helpers in the prebuilt replay'
          git fetch origin "$BRANCH"
          git rebase FETCH_HEAD
          git push origin HEAD:"$BRANCH"
