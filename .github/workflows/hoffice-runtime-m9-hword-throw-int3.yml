name: HOffice runtime M9 HWord direct throw probe

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
    paths:
      - 'runtime/m9/augment_exec_mmap_trace.py'
      - 'runtime/m9/augment_int3_caller_probe.py'
      - '.github/workflows/hoffice-runtime-m9-hword-throw-int3.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: hrt-m9-hword-throw-int3-${{ github.ref }}
  cancel-in-progress: true

env:
  ROOTFS_ARTIFACT_ID: '8968324706'
  ROOTFS_ARTIFACT_SHA256: 3e301d3c6269926c62804bff18671136fcf8c0b0b22b3952072e427a8fa9918a
  ROOTFS_ARCHIVE_SHA256: 322fcf228092b296a34edbfa7ee43f9a7b237d5bcedaee50109ac4bb44d9ca28
  QPA_RUN_ID: '31166152504'
  ASSET_NAME: hoffice_11.20.0.1520+h1_amd64.deb
  RELEASE_TAG: linux-11.20-series
  PACKAGE_SHA256: 23fc502c430b4dd829fee36740fbce06b819cd51d36fcdf0afbb6fcc5d0b7c46
  PROGRAM: /opt/hnc/hoffice11/Bin/hword
  PROGRAM_SHA256: 55876ea7d0c20e73d936af11cc3623c418acb09d61bde5bfeecafa1da7a9b5cb
  PLUGIN_GUEST: /opt/hnc/hoffice11/Bin/qt/plugins/platforms/libqhrtappkit.so
  LIBSTDCXX_GUEST: /lib/x86_64-linux-gnu/libstdc++.so.6
  THROW_SYMBOL_REGEX: '^_ZSt24__throw_out_of_range_fmtPKcz$'

jobs:
  capture-caller:
    runs-on: macos-14
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the exact-font bootstrap advance
        run: |
          set -euxo pipefail
          test -s proofs/m9-hword-past-font-initialization.json
          grep -F '"status": "PASS"' \
            proofs/m9-hword-past-font-initialization.json

      - name: Download the verified Qt 5.11.3 hrtappkit QPA
        uses: actions/download-artifact@v4
        with:
          name: hrt-m8-qt5113-hrtappkit-input-qpa
          path: build/input/qpa
          repository: ${{ github.repository }}
          run-id: ${{ env.QPA_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download and verify the exact HWord root and package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p build/input/hword build/input/deb build/generated \
                   build/objects build/host build/proof build/caller-object
          curl --fail --location --retry 5 --retry-delay 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ROOTFS_ARTIFACT_ID/zip" \
            -o build/input/hword-artifact.zip
          printf '%s  %s\n' "$ROOTFS_ARTIFACT_SHA256" \
            build/input/hword-artifact.zip | shasum -a 256 -c -
          ditto -x -k build/input/hword-artifact.zip build/input/hword
          printf '%s  %s\n' "$ROOTFS_ARCHIVE_SHA256" \
            build/input/hword/hword-rootfs.tar.gz | shasum -a 256 -c -

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_NAME" \
            --dir build/input/deb
          printf '%s  %s\n' "$PACKAGE_SHA256" \
            "build/input/deb/$ASSET_NAME" | shasum -a 256 -c -

      - name: Reconstruct the exact full-font case-sensitive guest
        run: |
          set -euxo pipefail
          image="$RUNNER_TEMP/hrt-m9-direct-throw.sparsebundle"
          root="/tmp/h9i-$GITHUB_RUN_ID"
          rm -rf "$image" "$root"; mkdir -p "$root"
          if ! hdiutil create -quiet -size 12g -fs APFSX \
               -volname HRTM9I -type SPARSEBUNDLE "$image"; then
            rm -rf "$image"
            hdiutil create -quiet -size 12g -fs HFSX \
              -volname HRTM9I -type SPARSEBUNDLE "$image"
          fi
          hdiutil attach -quiet -nobrowse -mountpoint "$root" "$image"
          echo "HRT_ROOT=$root" >>"$GITHUB_ENV"
          echo "HRT_IMAGE=$image" >>"$GITHUB_ENV"
          tar -xzf build/input/hword/hword-rootfs.tar.gz -C "$root"
          test -s "$root/.hrt-prepatched-v1"
          test -f "$root$PROGRAM"
          test -f "$root$LIBSTDCXX_GUEST"

          deb="build/input/deb/$ASSET_NAME"
          data_member=$(ar t "$deb" | awk '/^data\.tar/{print; exit}')
          test -n "$data_member"
          ar p "$deb" "$data_member" >"build/input/deb/$data_member"
          tar -xf "build/input/deb/$data_member" -C "$root" \
            ./opt/hnc/hoffice11/Shared/Fonts \
            ./opt/hnc/hoffice11/Shared/TTF
          rm -f "$root/opt/hnc/hoffice1"
          ln -s hoffice11 "$root/opt/hnc/hoffice1"
          test -f "$root/opt/hnc/hoffice1/Shared/Fonts/HGSMJ.HFT"
          test -f "$root/opt/hnc/hoffice11/Shared/TTF/Install/HanSantteutDotum-Regular.ttf"

          mkdir -p "$root$(dirname "$PLUGIN_GUEST")"
          python3 - build/input/qpa/libqhrtappkit.so.xz \
            build/input/qpa/lock.json "$root$PLUGIN_GUEST" <<'PY'
          import hashlib,json,lzma,pathlib,sys
          compressed=pathlib.Path(sys.argv[1]).read_bytes()
          lock=json.loads(pathlib.Path(sys.argv[2]).read_text())
          assert lock['toolchain']['qt_version']=='5.11.3'
          assert hashlib.sha256(compressed).hexdigest()==lock['plugin']['xz_sha256']
          plugin=lzma.decompress(compressed)
          assert hashlib.sha256(plugin).hexdigest()==lock['plugin']['sha256_after_prepatch']
          pathlib.Path(sys.argv[3]).write_bytes(plugin)
          pathlib.Path('build/proof/qpa-lock.json').write_text(
              json.dumps(lock,indent=2)+'\n')
          PY
          chmod 0755 "$root$PLUGIN_GUEST"

          python3 - "$root" "$PROGRAM" "$PROGRAM_SHA256" \
                    "$LIBSTDCXX_GUEST" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); program=sys.argv[2]
          marker=json.loads((root/'.hrt-prepatched-v1').read_text())
          records={item['path']:item for item in marker['objects']}
          program_record=records[program]
          assert program_record['sha256_before']==sys.argv[3]
          assert hashlib.sha256((root/program.lstrip('/')).read_bytes()).hexdigest()==program_record['sha256_after']
          library=sys.argv[4]
          assert library in records, library
          library_record=records[library]
          actual=hashlib.sha256((root/library.lstrip('/')).read_bytes()).hexdigest()
          assert actual==library_record['sha256_after'],(actual,library_record)
          pathlib.Path('build/proof/libstdcxx-prepatch-record.json').write_text(
              json.dumps(library_record,indent=2)+'\n')
          PY
          diskutil info "$root" | tee build/proof/guest-volume.txt
          grep -F 'Case-sensitive' build/proof/guest-volume.txt

      - name: Patch the exact libstdc++ throw helper with a one-shot INT3
        run: |
          set -euxo pipefail
          python3 runtime/m3/patch_elf_int3_probe_regex.py \
            "$HRT_ROOT$LIBSTDCXX_GUEST" \
            --symbol-regex "$THROW_SYMBOL_REGEX" \
            --label 'std::__throw_out_of_range_fmt' \
            --signature-length 24 \
            --manifest build/proof/throw-int3-manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path('build/proof/libstdcxx-prepatch-record.json').read_text())
          probe=json.loads(Path('build/proof/throw-int3-manifest.json').read_text())
          assert probe['sha256_before']==lock['sha256_after'],(probe,lock)
          assert probe['symbol']['name']=='_ZSt24__throw_out_of_range_fmtPKcz'
          assert probe['patched_bytes_hex'].startswith('cc')
          assert probe['original_bytes_hex'].startswith('f30f1efa')
          PY

      - name: Generate the mature bridge with mapping and caller probes
        run: |
          set -euxo pipefail
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          /usr/bin/arch -x86_64 /usr/bin/getconf PAGESIZE \
            | tee build/proof/x86-page-size.txt
          sw_vers | tee build/proof/sw-vers.txt

          python3 runtime/m8/augment_appkit_adapter_input.py \
            runtime/m6/appkit_adapter.m build/generated/appkit_adapter_m8.m
          python3 runtime/m6/augment_stack_hrtappkit.py \
            runtime/m3/stack.c build/generated/stack.c
          python3 runtime/m3/augment_syscalls.py \
            runtime/m3/syscall_bridge.c build/generated/stage1.c
          python3 runtime/m3/augment_directory_syscalls.py \
            build/generated/stage1.c build/generated/stage2.c
          python3 runtime/m3/augment_directory_stream.py \
            build/generated/stage2.c build/generated/stage3.c
          python3 runtime/m3/augment_pipe2.py \
            build/generated/stage3.c build/generated/stage4.c
          python3 runtime/m3/augment_eventfd2.py \
            build/generated/stage4.c build/generated/stage5.c
          python3 runtime/m3/augment_crash_signals.py \
            build/generated/stage5.c build/generated/stage6.c
          python3 runtime/m3/augment_poll.py \
            build/generated/stage6.c build/generated/stage7.c
          python3 runtime/m3/augment_posix_basics.py \
            build/generated/stage7.c build/generated/stage8.c
          python3 runtime/m3/augment_connect.py \
            build/generated/stage8.c build/generated/stage9.c
          python3 runtime/m6/augment_appkit_hostcall_deferred.py \
            build/generated/stage9.c build/generated/stage10.c
          python3 runtime/m3/augment_darwin_syscall_abi.py \
            build/generated/stage10.c build/generated/stage11.c
          python3 runtime/m9/augment_exec_mmap_trace.py \
            build/generated/stage11.c build/generated/stage12.c
          python3 runtime/m9/augment_int3_caller_probe.py \
            build/generated/stage12.c build/proof/throw-int3-manifest.json \
            build/generated/syscall_bridge.c --exit-status 191
          python3 - <<'PY'
          from pathlib import Path
          path=Path('build/generated/syscall_bridge.c')
          path.write_text(path.read_text().replace(
              '#define M3_TRACE_LIMIT 256u','#define M3_TRACE_LIMIT 30000u'))
          PY
          grep -Fq 'HRT M9 MAP:' build/generated/syscall_bridge.c
          grep -Fq 'HRT M9 THROW INT3:' build/generated/syscall_bridge.c
          grep -Fq 'm9_int3_caller_signal_handler' \
            build/generated/syscall_bridge.c
          sha256sum build/generated/syscall_bridge.c \
            >build/proof/generated-bridge.sha256

      - name: Compile and sign the direct-probe HWord runtime
        run: |
          set -euxo pipefail
          common=(-arch x86_64 -std=c17 -O2 -g -fno-stack-protector \
            -fno-omit-frame-pointer -Wall -Wextra -Werror -Wpedantic \
            -Wno-unused-function -Wno-unused-variable \
            -Iruntime/m8 -Iruntime/m6 -Iruntime/m3 -Iruntime/m1)
          index=0
          for source in runtime/m6/main.c runtime/m6/hostcall_trampoline.c \
            runtime/m1/common.c runtime/m3/elf_map.c build/generated/stack.c \
            runtime/m3/patch.c build/generated/syscall_bridge.c; do
            clang "${common[@]}" -c "$source" \
              -o "build/objects/c-${index}.o"
            index=$((index+1))
          done
          clang -arch x86_64 -std=c17 -O2 -g -fobjc-arc \
            -Wall -Wextra -Werror -Wpedantic -Iruntime/m8 -Iruntime/m6 \
            -c build/generated/appkit_adapter_m8.m \
            -o build/objects/appkit-adapter.o
          clang -arch x86_64 -std=c17 -O2 -g -fobjc-arc \
            -Wall -Wextra -Werror -Wpedantic -Iruntime/m8 -Iruntime/m6 \
            -c runtime/m8/appkit_input.m -o build/objects/appkit-input.o
          clang -arch x86_64 -g -c runtime/m1/enter_guest.S \
            -o build/objects/enter-guest.o
          clang -arch x86_64 -g -c runtime/m6/hostcall_trampoline.S \
            -o build/objects/hostcall-trampoline.o
          clang -arch x86_64 build/objects/*.o -Wl,-pagezero_size,0x1000 \
            -framework AppKit -framework CoreGraphics -framework ImageIO \
            -o build/host/hrt-m9-hword-throw-int3
          file build/host/hrt-m9-hword-throw-int3 \
            | tee build/proof/host-file.txt
          lipo -info build/host/hrt-m9-hword-throw-int3 \
            | tee build/proof/host-arch.txt
          codesign --force --sign - --timestamp=none \
            build/host/hrt-m9-hword-throw-int3
          codesign --verify --strict build/host/hrt-m9-hword-throw-int3

      - name: Stop at the exact out-of-range helper and record its caller
        run: |
          set -uxo pipefail
          export HRT_M6_CAPTURE_PATH="$PWD/build/proof/pre-frame-window.png"
          export HRT_M7_CAPTURE_PATH="$PWD/build/proof/hword-before-throw.png"
          unset HRT_M8_SYNTHETIC_INPUT
          : >build/proof/stdout.txt; : >build/proof/stderr.txt
          /usr/bin/arch -x86_64 build/host/hrt-m9-hword-throw-int3 \
            --root "$HRT_ROOT" --program "$PROGRAM" \
            >build/proof/stdout.txt 2>build/proof/stderr.txt &
          pid=$!
          reached=0
          for _ in $(jot 1000); do
            if grep -q 'HRT M9 THROW INT3:' build/proof/stderr.txt 2>/dev/null; then
              reached=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 0.05
          done
          if kill -0 "$pid" 2>/dev/null; then
            kill -TERM "$pid" 2>/dev/null || true
            sleep 0.25
            kill -KILL "$pid" 2>/dev/null || true
          fi
          set +e; wait "$pid"; raw_status=$?; set -e
          printf '%s\n' "$raw_status" >build/proof/raw-exit-status.txt
          printf '%s\n' "$reached" >build/proof/probe-reached.txt
          grep -F 'HRT M9 THROW INT3:' build/proof/stderr.txt \
            | tee build/proof/throw-int3-lines.txt || true
          grep -F 'HRT M9 MAP:' build/proof/stderr.txt \
            | tee build/proof/executable-maps.txt || true
          grep -E 'guest-thread=.*program image=|interpreter image=' \
            build/proof/stderr.txt | tee build/proof/primary-images.txt || true
          tail -n 1000 build/proof/stderr.txt >build/proof/stderr-tail.txt
          cat build/proof/throw-int3-lines.txt
          test "$reached" -eq 1
          test "$raw_status" -eq 191

      - name: Attribute the return address to an exact guest object
        run: |
          set -euxo pipefail
          python3 - "$HRT_ROOT" <<'PY'
          import hashlib,json,os,pathlib,re,shutil,sys
          root=pathlib.Path(sys.argv[1])
          stderr=pathlib.Path('build/proof/stderr.txt').read_text(errors='replace')
          lines=pathlib.Path('build/proof/throw-int3-lines.txt').read_text(errors='replace').splitlines()
          assert len(lines)==1,lines
          pattern=re.compile(
              r'HRT M9 THROW INT3: label=(.*?) symbol=(\S+) site=(0x[0-9a-f]+) '
              r'return=(0x[0-9a-f]+) rsp=(0x[0-9a-f]+) rdi=(0x[0-9a-f]+) '
              r'rsi=(0x[0-9a-f]+) format=(.*?) '
              r'stack0=(0x[0-9a-f]+) stack1=(0x[0-9a-f]+) '
              r'stack2=(0x[0-9a-f]+) stack3=(0x[0-9a-f]+) '
              r'stack4=(0x[0-9a-f]+) stack5=(0x[0-9a-f]+) '
              r'stack6=(0x[0-9a-f]+) stack7=(0x[0-9a-f]+)$')
          match=pattern.fullmatch(lines[0]); assert match,lines[0]
          return_address=int(match.group(4),16)

          maps=[]
          map_pattern=re.compile(
              r'HRT M9 MAP: start=(0x[0-9a-f]+) end=(0x[0-9a-f]+) '
              r'offset=(0x[0-9a-f]+) fd=(\d+) path=(.*)$')
          for line in pathlib.Path('build/proof/executable-maps.txt').read_text(
                  errors='replace').splitlines():
              mapped=map_pattern.fullmatch(line)
              if not mapped: continue
              maps.append({
                  'start':int(mapped.group(1),16),
                  'end':int(mapped.group(2),16),
                  'file_offset':int(mapped.group(3),16),
                  'fd':int(mapped.group(4)),
                  'host_path':mapped.group(5),
              })
          owner=next((item for item in maps
                      if item['start'] <= return_address < item['end']),None)

          primary=re.search(
              r'program image=\[(0x[0-9a-f]+),(0x[0-9a-f]+)\) '
              r'bias=(0x[0-9a-f]+)',stderr)
          if owner is None and primary:
              start,end,bias=(int(primary.group(i),16) for i in range(1,4))
              if start <= return_address < end:
                  owner={
                      'start':start,'end':end,'file_offset':0,
                      'fd':None,'host_path':str(root/os.environ['PROGRAM'].lstrip('/')),
                      'load_bias':bias,
                  }

          guest_path=None; object_file_offset=None; object_virtual_address=None
          object_sha256=None; object_copy=None
          if owner is not None:
              host_path=pathlib.Path(owner['host_path'])
              try:
                  guest_path='/' + str(host_path.relative_to(root))
              except ValueError:
                  guest_path=str(host_path)
              object_file_offset=(owner['file_offset'] +
                                  return_address-owner['start'])
              if host_path.is_file():
                  data=host_path.read_bytes()
                  object_sha256=hashlib.sha256(data).hexdigest()
                  object_copy=pathlib.Path('build/caller-object')/host_path.name
                  shutil.copy2(host_path,object_copy)

          diagnostic={
              'schema':1,
              'milestone':'M9-throw-int3-caller',
              'status':'PASS' if owner is not None and object_copy is not None
                                else 'PARTIAL',
              'workflow_run':os.environ['GITHUB_RUN_ID'],
              'commit':os.environ['GITHUB_SHA'],
              'program':os.environ['PROGRAM'],
              'program_sha256':os.environ['PROGRAM_SHA256'],
              'package_sha256':os.environ['PACKAGE_SHA256'],
              'probe_label':match.group(1),
              'probe_symbol':match.group(2),
              'probe_site':match.group(3),
              'return_address':match.group(4),
              'stack_pointer':match.group(5),
              'format_pointer':match.group(6),
              'first_variadic_argument':match.group(7),
              'format':match.group(8),
              'stack_words':[match.group(i) for i in range(9,17)],
              'executable_mapping_count':len(maps),
              'owner_mapping':owner,
              'caller_guest_path':guest_path,
              'caller_file_offset':object_file_offset,
              'caller_object_sha256':object_sha256,
              'caller_object_copy':str(object_copy) if object_copy else None,
              'raw_exit_status':int(pathlib.Path(
                  'build/proof/raw-exit-status.txt').read_text()),
          }
          pathlib.Path('build/proof/caller-attribution.json').write_text(
              json.dumps(diagnostic,indent=2)+'\n')
          print(json.dumps(diagnostic,indent=2))
          assert diagnostic['status']=='PASS',diagnostic
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: hrt-m9-hword-throw-int3-caller
          path: |
            build/host/hrt-m9-hword-throw-int3
            build/proof
            build/caller-object
          if-no-files-found: error
          retention-days: 14

      - name: Detach the exact HWord guest
        if: always()
        run: hdiutil detach -quiet "$HRT_ROOT" || true

  analyze-caller:
    needs: capture-caller
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: hrt-m9-hword-throw-int3-caller
          path: build/input

      - name: Resolve the exact ELF virtual address and disassemble the callsite
        run: |
          set -euxo pipefail
          mkdir -p build/analysis diagnostics
          python3 - <<'PY'
          import json,pathlib,struct
          attribution=json.loads(pathlib.Path(
              'build/input/build/proof/caller-attribution.json').read_text())
          object_path=pathlib.Path(attribution['caller_object_copy'])
          object_path=pathlib.Path('build/input')/object_path
          assert object_path.is_file(),object_path
          file_offset=int(attribution['caller_file_offset'])
          blob=object_path.read_bytes()
          header=struct.unpack_from('<16sHHIQQQIHHHHHH',blob,0)
          ident=header[0]
          assert ident[:4]==b'\x7fELF' and ident[4]==2 and ident[5]==1
          phoff=header[5]; phentsize=header[9]; phnum=header[10]
          assert phentsize==56
          virtual=None; segment=None
          for index in range(phnum):
              values=struct.unpack_from('<IIQQQQQQ',blob,phoff+index*phentsize)
              p_type,p_flags,p_offset,p_vaddr,_paddr,p_filesz,p_memsz,p_align=values
              if p_type==1 and p_offset <= file_offset < p_offset+p_filesz:
                  virtual=p_vaddr+(file_offset-p_offset)
                  segment={
                      'index':index,'flags':p_flags,'file_offset':p_offset,
                      'virtual_address':p_vaddr,'file_size':p_filesz,
                      'memory_size':p_memsz,'alignment':p_align,
                  }
                  break
          assert virtual is not None,(file_offset,object_path)
          attribution['caller_object_virtual_address']=virtual
          attribution['caller_load_segment']=segment
          pathlib.Path('build/analysis/caller-attribution-resolved.json').write_text(
              json.dumps(attribution,indent=2)+'\n')
          pathlib.Path('build/analysis/start.txt').write_text(
              str(max(0,virtual-96))+'\n')
          pathlib.Path('build/analysis/stop.txt').write_text(
              str(virtual+96)+'\n')
          pathlib.Path('build/analysis/object-path.txt').write_text(
              str(object_path)+'\n')
          print(json.dumps(attribution,indent=2))
          PY
          object=$(cat build/analysis/object-path.txt)
          start=$(cat build/analysis/start.txt)
          stop=$(cat build/analysis/stop.txt)
          file "$object" | tee build/analysis/file.txt
          readelf -hW "$object" | tee build/analysis/elf-header.txt
          readelf -dW "$object" | tee build/analysis/dynamic.txt
          readelf -Ws "$object" | tee build/analysis/symbols.txt
          objdump -dC --start-address="$start" --stop-address="$stop" \
            "$object" | tee build/analysis/callsite-disassembly.txt

      - name: Record the nearest available symbol and durable result
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json,os,pathlib,re
          attribution=json.loads(pathlib.Path(
              'build/analysis/caller-attribution-resolved.json').read_text())
          target=int(attribution['caller_object_virtual_address'])
          symbols=[]
          pattern=re.compile(
              r'^\s*\d+:\s+([0-9a-fA-F]+)\s+(\d+)\s+(\S+)\s+(\S+)\s+'
              r'(\S+)\s+(\S+)\s+(.*)$')
          for line in pathlib.Path('build/analysis/symbols.txt').read_text(
                  errors='replace').splitlines():
              match=pattern.match(line)
              if not match: continue
              value=int(match.group(1),16); size=int(match.group(2))
              name=match.group(7).strip()
              if value==0 or not name: continue
              symbols.append({'value':value,'size':size,'name':name,
                              'type':match.group(3),'binding':match.group(4)})
          containing=[item for item in symbols if item['value'] <= target and
                      (item['size']==0 or target < item['value']+item['size'])]
          preceding=[item for item in symbols if item['value'] <= target]
          nearest=max(containing or preceding,key=lambda item:item['value'],
                      default=None)
          attribution.update({
              'schema':1,
              'status':'PASS',
              'milestone':'M9-throw-int3-caller',
              'analysis_workflow_run':os.environ['GITHUB_RUN_ID'],
              'nearest_symbol':nearest,
              'offset_from_nearest_symbol':
                  target-nearest['value'] if nearest else None,
              'callsite_disassembly':pathlib.Path(
                  'build/analysis/callsite-disassembly.txt').read_text(
                      errors='replace'),
          })
          payload=json.dumps(attribution,indent=2)+'\n'
          run_path=pathlib.Path(
              f"diagnostics/m9-hword-throw-int3-{os.environ['GITHUB_RUN_ID']}.json")
          run_path.write_text(payload)
          pathlib.Path('diagnostics/m9-hword-throw-int3-latest.json').write_text(
              payload)
          pathlib.Path('diagnostics/m9-hword-throw-int3-latest.md').write_text(
              '# HWord M9 direct throw caller\n\n'
              f"- Caller object: `{attribution['caller_guest_path']}`\n"
              f"- Caller file offset: `0x{attribution['caller_file_offset']:x}`\n"
              f"- Caller virtual address: `0x{target:x}`\n"
              f"- Nearest symbol: `{nearest['name'] if nearest else None}`\n"
              f"- Exception format: `{attribution['format']}`\n"
          )
          print(payload)
          PY

      - name: Commit the exact direct-probe diagnosis
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin codex/hoffice-runtime-from-scratch
          git add diagnostics/m9-hword-throw-int3-*.json \
                  diagnostics/m9-hword-throw-int3-latest.md
          if ! git diff --cached --quiet; then
            git commit -m 'diagnostic: locate exact HWord out-of-range callsite'
            git push origin HEAD:codex/hoffice-runtime-from-scratch
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: hrt-m9-hword-throw-int3-analysis
          path: |
            build/analysis
            diagnostics/m9-hword-throw-int3-*.json
            diagnostics/m9-hword-throw-int3-latest.md
          if-no-files-found: error
          retention-days: 14
