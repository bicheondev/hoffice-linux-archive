name: HOffice chain M6 offscreen backing store constructor

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
    paths:
      - 'proofs/chain/m6-create-backing-store.json'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  probe:
    uses: ./.github/workflows/hoffice-runtime-guest-symbol-probe-chain.yml
    with:
      predecessor_proof: proofs/chain/m6-create-backing-store.json
      symbol_regex: 'QOffscreenBackingStoreC1E'
      label: Qt offscreen backing store constructor
      milestone: M6-chain-offscreen-backing-store-constructor
      diagnostic_path: diagnostics/chain/m6-backing-store-constructor.json
      proof_path: proofs/chain/m6-backing-store-constructor.json
      trace_limit: 96000
      run_seconds: 50
      require_pipe2: true
