name: HOffice runtime M11 Korean-title staged input

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
    paths:
      - 'runtime/m11/run_korean_title_staged_replay.sh'
      - 'runtime/m11/augment_full_product_replay.py'
      - 'runtime/m11/augment_full_product_replay_v2.py'
      - 'runtime/m11/harden_text_input_proof.py'
      - '.github/workflows/hoffice-runtime-m11-korean-title-replay.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: hrt-m11-korean-title-staged-${{ github.ref }}
  cancel-in-progress: true

env:
  PREPARED_RUN_ID: '31235068358'
  HOST_RUN_ID: '31308329454'
  QPA_RUN_ID: '31305695836'
  QPA_ARTIFACT_DIGEST: 8b2552ed25ce79626dcc90d55c2fcc6263b39ded64abac5ce5d7f639640df9ee
  ASSET_NAME: hoffice_11.20.0.1520+h1_amd64.deb
  RELEASE_TAG: linux-11.20-series
  PACKAGE_SHA256: 23fc502c430b4dd829fee36740fbce06b819cd51d36fcdf0afbb6fcc5d0b7c46
  PROGRAM: /opt/hnc/hoffice11/Bin/hword
  PROGRAM_SHA256: 55876ea7d0c20e73d936af11cc3623c418acb09d61bde5bfeecafa1da7a9b5cb
  HWORD_APP_GUEST: /opt/hnc/hoffice11/Bin/libHwordApp.so
  HWORD_APP_SHA256: e8523db3ae977771dddc8fbc5ac03c1a3410b28629e4136d31583a31c3806d50
  HWORD_APP_PATCHED_SHA256: ccceee82d4f5a97d8f52286a6cc8aa753c9ef44b2d484627291361645be27fd8
  PLUGIN_GUEST: /opt/hnc/hoffice11/Bin/qt/plugins/platforms/libqhrtappkit.so

jobs:
  replay:
    runs-on: macos-14
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the verified Korean HWord main-window proof
        run: |
          set -euxo pipefail
          test -s proofs/m10-hword-culture-resource-window.json
          grep -F '"status": "PASS"' \
            proofs/m10-hword-culture-resource-window.json
          grep -F 'HWORD_KOREAN_MAIN_WINDOW_AFTER_CULTURE_AND_RESOURCE_REPAIR' \
            proofs/m10-hword-culture-resource-window.json
          test -s proofs/m10-clone-chdir.json
          grep -F '"status": "PASS"' proofs/m10-clone-chdir.json
          grep -F '"exit_status": 0' proofs/m10-clone-chdir.json

      - name: Generate and run the product closure-fill replay
        env:
          GH_TOKEN: ${{ github.token }}
          HRT_M11_MODAL_CAPTURE_PATH: ${{ github.workspace }}/build/proof/hword-modal-dialog.png
        run: |
          set -euxo pipefail
          mkdir -p build/generated
          python3 runtime/m11/augment_full_product_replay_v2.py \
            runtime/m11/run_korean_title_staged_replay.sh \
            build/generated/run_korean_title_full_product.sh
          test -x build/generated/run_korean_title_full_product.sh
          grep -F 'full-product-payload-missing-paths.txt' \
            build/generated/run_korean_title_full_product.sh
          build/generated/run_korean_title_full_product.sh

      - name: Harden editor-level text credit
        if: always()
        run: |
          set -euxo pipefail
          test -s diagnostics/m11-korean-title-staged-latest.json
          test -s build/proof/stderr.txt
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          current = json.loads(Path(
              'diagnostics/m11-korean-title-staged-latest.json'
          ).read_text(encoding='utf-8'))
          if str(current.get('workflow_run')) != os.environ['GITHUB_RUN_ID']:
              raise SystemExit(
                  f"stale replay summary: {current.get('workflow_run')} != "
                  f"{os.environ['GITHUB_RUN_ID']}")
          PY
          python3 runtime/m11/harden_text_input_proof.py

      - name: Record the completed product closure-fill experiment
        if: always()
        run: |
          set -euxo pipefail
          test -s build/proof/full-product-payload-paths.txt
          test -f build/proof/full-product-payload-missing-paths.txt
          test -f build/proof/full-product-payload-existing-paths.txt
          test -s build/proof/full-product-payload-count.txt
          test -s build/proof/full-product-payload-missing-count.txt
          test -s build/proof/full-product-payload-existing-count.txt
          test -s build/proof/full-product-payload-bytes.txt
          test -s build/proof/prepatched-object-integrity-before.json
          test -s build/proof/prepatched-object-integrity-after.json
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import struct
          from pathlib import Path

          summary_path = Path('diagnostics/m11-korean-title-staged-latest.json')
          result = json.loads(summary_path.read_text(encoding='utf-8'))
          if str(result.get('workflow_run')) != os.environ['GITHUB_RUN_ID']:
              raise SystemExit(
                  f"refusing to annotate stale run {result.get('workflow_run')}")

          all_manifest = Path('build/proof/full-product-payload-paths.txt')
          missing_manifest = Path(
              'build/proof/full-product-payload-missing-paths.txt')
          existing_manifest = Path(
              'build/proof/full-product-payload-existing-paths.txt')
          count = int(Path(
              'build/proof/full-product-payload-count.txt').read_text())
          missing_count = int(Path(
              'build/proof/full-product-payload-missing-count.txt').read_text())
          existing_count = int(Path(
              'build/proof/full-product-payload-existing-count.txt').read_text())
          byte_count = int(Path(
              'build/proof/full-product-payload-bytes.txt').read_text())
          before = json.loads(Path(
              'build/proof/prepatched-object-integrity-before.json'
          ).read_text(encoding='utf-8'))
          after = json.loads(Path(
              'build/proof/prepatched-object-integrity-after.json'
          ).read_text(encoding='utf-8'))
          if count != missing_count + existing_count:
              raise SystemExit(
                  f'closure partition mismatch: {count} != '
                  f'{missing_count} + {existing_count}')
          if before != after:
              raise SystemExit('prepatched object integrity changed during fill')

          modal_path = Path('build/proof/hword-modal-dialog.png')
          modal_capture = None
          if modal_path.is_file() and modal_path.stat().st_size > 0:
              modal_data = modal_path.read_bytes()
              if modal_data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit('modal capture is not a PNG')
              modal_width, modal_height = struct.unpack(
                  '>II', modal_data[16:24])
              modal_capture = {
                  'path': str(modal_path),
                  'width': modal_width,
                  'height': modal_height,
                  'size': len(modal_data),
                  'sha256': hashlib.sha256(modal_data).hexdigest(),
              }

          for legacy_key in (
              'full_product_payload_restored',
              'full_product_payload_entry_count',
              'full_product_payload_file_bytes',
              'full_product_payload_manifest_sha256',
          ):
              result.pop(legacy_key, None)
          result['schema'] = max(int(result.get('schema', 0)), 7)
          result['product_closure_fill_completed'] = True
          result['product_package_entry_count'] = count
          result['product_missing_entry_count'] = missing_count
          result['product_existing_entry_count'] = existing_count
          result['product_tree_file_bytes'] = byte_count
          result['prepatched_object_count'] = int(before['object_count'])
          result['prepatched_object_integrity_preserved'] = True
          result['product_package_manifest_sha256'] = hashlib.sha256(
              all_manifest.read_bytes()).hexdigest()
          result['product_missing_manifest_sha256'] = hashlib.sha256(
              missing_manifest.read_bytes()).hexdigest()
          result['product_existing_manifest_sha256'] = hashlib.sha256(
              existing_manifest.read_bytes()).hexdigest()
          result['modal_native_window_materialized'] = modal_capture is not None
          result['modal_native_window_capture'] = modal_capture
          if (modal_capture is not None and
                  result.get('document_interaction_credited') and
                  not result.get('text_interaction_credited') and
                  not result.get('editor_materialized_classes')):
              result['classification'] = (
                  'HWORD_PRODUCT_CLOSURE_MODAL_MATERIALIZED_'
                  'EDITOR_NOT_MATERIALIZED')
          elif (result.get('document_interaction_credited') and
                  not result.get('text_interaction_credited') and
                  not result.get('editor_materialized_classes')):
              result['classification'] = (
                  'HWORD_PRODUCT_CLOSURE_FILLED_EDITOR_NOT_MATERIALIZED')
          payload = json.dumps(result, ensure_ascii=False, indent=2) + '\n'
          run_id = str(result['workflow_run'])
          Path(f'diagnostics/m11-korean-title-staged-{run_id}.json').write_text(
              payload, encoding='utf-8')
          summary_path.write_text(payload, encoding='utf-8')
          Path('build/proof/summary.json').write_text(payload, encoding='utf-8')
          document_proof = Path('proofs/m11-hword-document-interaction.json')
          if document_proof.exists():
              document_proof.write_text(payload, encoding='utf-8')
          text_proof = Path('proofs/m11-hword-text-input.json')
          if result.get('text_interaction_credited') and text_proof.exists():
              text_proof.write_text(payload, encoding='utf-8')
          Path('diagnostics/m11-korean-title-staged-latest.md').write_text(
              '# Korean HWord product closure-fill staged input\n\n'
              f"- Status: `{result['status']}`\n"
              f"- Classification: `{result['classification']}`\n"
              f"- Package entries: `{count}`\n"
              f"- Missing entries filled: `{missing_count}`\n"
              f"- Existing entries preserved: `{existing_count}`\n"
              f"- Prepatched objects preserved: `{before['object_count']}`\n"
              f"- Product file bytes: `{byte_count}`\n"
              f"- Native modal materialized: `{modal_capture is not None}`\n"
              f"- Native modal capture: `{modal_capture}`\n"
              f"- Credible editor key press: `{result.get('credible_editor_key_press')}`\n"
              f"- Editor classes: `{result.get('editor_materialized_classes', [])}`\n",
              encoding='utf-8')
          print(payload)
          PY

      - name: Commit the durable M11 input frontier
        if: always()
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/m11-korean-title-staged-*.json \
                  diagnostics/m11-korean-title-staged-latest.md 2>/dev/null || true
          git add -A -- proofs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'diagnostic: classify native-modal HWord input'
          for attempt in $(seq 1 20); do
            if git push origin HEAD:codex/hoffice-runtime-from-scratch; then
              exit 0
            fi
            git fetch origin codex/hoffice-runtime-from-scratch
            git rebase origin/codex/hoffice-runtime-from-scratch
            sleep "$attempt"
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hrt-m11-korean-title-staged-proof
          path: |
            build/generated/run_korean_title_full_product.sh
            build/host/hrt-m11-korean-staged
            build/proof
            diagnostics/m11-korean-title-staged-*.json
            diagnostics/m11-korean-title-staged-latest.md
            proofs/m11-hword-document-interaction.json
            proofs/m11-hword-text-input.json
          if-no-files-found: warn
          retention-days: 14
