name: HOffice runtime M11 Korean-title staged input

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
    paths:
      - 'runtime/m11/run_korean_title_staged_replay.sh'
      - 'runtime/m11/augment_full_product_replay.py'
      - 'runtime/m11/harden_text_input_proof.py'
      - '.github/workflows/hoffice-runtime-m11-korean-title-replay.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: hrt-m11-korean-title-staged-${{ github.ref }}
  cancel-in-progress: true

env:
  PREPARED_RUN_ID: '31235068358'
  HOST_RUN_ID: '31295600664'
  QPA_RUN_ID: '31294953477'
  QPA_ARTIFACT_DIGEST: 39d85aa902c9e8a92325d69c21c4b8535d06396ee59603e71613068c0b212dff
  ASSET_NAME: hoffice_11.20.0.1520+h1_amd64.deb
  RELEASE_TAG: linux-11.20-series
  PACKAGE_SHA256: 23fc502c430b4dd829fee36740fbce06b819cd51d36fcdf0afbb6fcc5d0b7c46
  PROGRAM: /opt/hnc/hoffice11/Bin/hword
  PROGRAM_SHA256: 55876ea7d0c20e73d936af11cc3623c418acb09d61bde5bfeecafa1da7a9b5cb
  HWORD_APP_GUEST: /opt/hnc/hoffice11/Bin/libHwordApp.so
  HWORD_APP_SHA256: e8523db3ae977771dddc8fbc5ac03c1a3410b28629e4136d31583a31c3806d50
  HWORD_APP_PATCHED_SHA256: ccceee82d4f5a97d8f52286a6cc8aa753c9ef44b2d484627291361645be27fd8
  PLUGIN_GUEST: /opt/hnc/hoffice11/Bin/qt/plugins/platforms/libqhrtappkit.so

jobs:
  replay:
    runs-on: macos-14
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the verified Korean HWord main-window proof
        run: |
          set -euxo pipefail
          test -s proofs/m10-hword-culture-resource-window.json
          grep -F '"status": "PASS"' \
            proofs/m10-hword-culture-resource-window.json
          grep -F 'HWORD_KOREAN_MAIN_WINDOW_AFTER_CULTURE_AND_RESOURCE_REPAIR' \
            proofs/m10-hword-culture-resource-window.json
          test -s proofs/m10-clone-chdir.json
          grep -F '"status": "PASS"' proofs/m10-clone-chdir.json
          grep -F '"exit_status": 0' proofs/m10-clone-chdir.json

      - name: Generate and run the complete-product staged replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p build/generated
          python3 runtime/m11/augment_full_product_replay.py \
            runtime/m11/run_korean_title_staged_replay.sh \
            build/generated/run_korean_title_full_product.sh
          test -x build/generated/run_korean_title_full_product.sh
          grep -F 'full-product-payload-paths.txt' \
            build/generated/run_korean_title_full_product.sh
          build/generated/run_korean_title_full_product.sh

      - name: Harden editor-level text credit
        if: always()
        run: |
          set -euxo pipefail
          test -s diagnostics/m11-korean-title-staged-latest.json
          test -s build/proof/stderr.txt
          python3 runtime/m11/harden_text_input_proof.py

      - name: Record the full-product closure experiment
        if: always()
        run: |
          set -euxo pipefail
          test -s build/proof/full-product-payload-paths.txt
          test -s build/proof/full-product-payload-count.txt
          test -s build/proof/full-product-payload-bytes.txt
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          summary_path = Path('diagnostics/m11-korean-title-staged-latest.json')
          result = json.loads(summary_path.read_text(encoding='utf-8'))
          manifest = Path('build/proof/full-product-payload-paths.txt')
          count = int(Path('build/proof/full-product-payload-count.txt').read_text())
          byte_count = int(Path('build/proof/full-product-payload-bytes.txt').read_text())
          result['schema'] = max(int(result.get('schema', 0)), 5)
          result['full_product_payload_restored'] = True
          result['full_product_payload_entry_count'] = count
          result['full_product_payload_file_bytes'] = byte_count
          result['full_product_payload_manifest_sha256'] = hashlib.sha256(
              manifest.read_bytes()).hexdigest()
          if (result.get('document_interaction_credited') and
                  not result.get('text_interaction_credited') and
                  not result.get('editor_materialized_classes')):
              result['classification'] = (
                  'HWORD_FULL_PRODUCT_RESTORED_EDITOR_NOT_MATERIALIZED')
          payload = json.dumps(result, ensure_ascii=False, indent=2) + '\n'
          run_id = str(result['workflow_run'])
          Path(f'diagnostics/m11-korean-title-staged-{run_id}.json').write_text(
              payload, encoding='utf-8')
          summary_path.write_text(payload, encoding='utf-8')
          Path('build/proof/summary.json').write_text(payload, encoding='utf-8')
          document_proof = Path('proofs/m11-hword-document-interaction.json')
          if document_proof.exists():
              document_proof.write_text(payload, encoding='utf-8')
          text_proof = Path('proofs/m11-hword-text-input.json')
          if result.get('text_interaction_credited') and text_proof.exists():
              text_proof.write_text(payload, encoding='utf-8')
          Path('diagnostics/m11-korean-title-staged-latest.md').write_text(
              '# Korean HWord complete-product staged input\n\n'
              f"- Status: `{result['status']}`\n"
              f"- Classification: `{result['classification']}`\n"
              f"- Product entries restored: `{count}`\n"
              f"- Product file bytes: `{byte_count}`\n"
              f"- Credible editor key press: `{result.get('credible_editor_key_press')}`\n"
              f"- Editor classes: `{result.get('editor_materialized_classes', [])}`\n",
              encoding='utf-8')
          print(payload)
          PY

      - name: Commit the durable M11 input frontier
        if: always()
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/m11-korean-title-staged-*.json \
                  diagnostics/m11-korean-title-staged-latest.md 2>/dev/null || true
          git add -A -- proofs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'diagnostic: classify full-product HWord input'
          for attempt in $(seq 1 20); do
            if git push origin HEAD:codex/hoffice-runtime-from-scratch; then
              exit 0
            fi
            git fetch origin codex/hoffice-runtime-from-scratch
            git rebase origin/codex/hoffice-runtime-from-scratch
            sleep "$attempt"
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hrt-m11-korean-title-staged-proof
          path: |
            build/generated/run_korean_title_full_product.sh
            build/host/hrt-m11-korean-staged
            build/proof
            diagnostics/m11-korean-title-staged-*.json
            diagnostics/m11-korean-title-staged-latest.md
            proofs/m11-hword-document-interaction.json
            proofs/m11-hword-text-input.json
          if-no-files-found: warn
          retention-days: 14
