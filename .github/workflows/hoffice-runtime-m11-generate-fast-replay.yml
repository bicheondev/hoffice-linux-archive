name: Generate Korean-title staged M11 input replay

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
    paths:
      - '.github/workflows/hoffice-runtime-m11-generate-fast-replay.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hrt-m11-generate-fast-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate the Korean-title staged replay from M11 v2
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/hoffice-runtime-m11-korean-input-replay-v2.yml')
          target = Path('.github/workflows/hoffice-runtime-m11-korean-input-replay-v3.yml')
          text = source.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{label}: expected exactly one anchor, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'name: HOffice runtime M11 Korean HWord input replay v2',
              'name: HOffice runtime M11 Korean HWord input replay v3',
              'workflow name')
          replace_once(
              "      - '.github/workflows/hoffice-runtime-m11-korean-input-replay-v2.yml'",
              "      - '.github/workflows/hoffice-runtime-m11-korean-input-replay-v3.yml'",
              'trigger path')
          replace_once(
              '  group: hrt-m11-korean-input-replay-v2-',
              '  group: hrt-m11-korean-input-replay-v3-',
              'concurrency prefix')
          replace_once(
              '          python3 runtime/m10/augment_appkit_input_capture.py \\\n',
              '          python3 runtime/m11/augment_appkit_korean_input_capture.py \\\n',
              'Korean staged-input generator')
          replace_once(
              "          path.write_text(text.replace(anchor,'#define M3_TRACE_LIMIT 100000u'))",
              "          path.write_text(text.replace(anchor,'#define M3_TRACE_LIMIT 8000u'))",
              'bounded trace limit')
          replace_once(
              '          for _ in $(jot 2200); do\n',
              '          for _ in $(jot 1800); do\n',
              'bounded observation loop')

          text = text.replace('input-v2', 'input-v3')
          text = text.replace('M11 v2 frontier', 'M11 v3 frontier')
          text = text.replace(
              'stage-separated exact HWord interaction',
              'Korean-title stage-separated exact HWord interaction')

          required = {
              'augment_appkit_korean_input_capture.py': 1,
              '#define M3_TRACE_LIMIT 8000u': 1,
              'for _ in $(jot 1800); do': 1,
              'hrt-m11-korean-hword-input-v3-proof': 1,
              'diagnostics/m11-korean-hword-input-v3-latest.json': 1,
              'name: HOffice runtime M11 Korean HWord input replay v3': 1,
          }
          for marker, expected in required.items():
              count = text.count(marker)
              if count != expected:
                  raise SystemExit(
                      f'generated marker {marker!r}: '
                      f'expected {expected}, found {count}')
          target.write_text(text, encoding='utf-8')
          PY
          test -s .github/workflows/hoffice-runtime-m11-korean-input-replay-v3.yml
          grep -F 'augment_appkit_korean_input_capture.py' \
            .github/workflows/hoffice-runtime-m11-korean-input-replay-v3.yml
          grep -F '#define M3_TRACE_LIMIT 8000u' \
            .github/workflows/hoffice-runtime-m11-korean-input-replay-v3.yml

      - name: Commit and trigger the Korean-title staged replay
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/hoffice-runtime-m11-korean-input-replay-v3.yml
          git commit -m 'ci: replay M11 input for the Korean HWord title'
          for attempt in $(seq 1 20); do
            if git push origin HEAD:codex/hoffice-runtime-from-scratch; then
              exit 0
            fi
            git fetch origin codex/hoffice-runtime-from-scratch
            git rebase origin/codex/hoffice-runtime-from-scratch
            sleep "$attempt"
          done
          exit 1
