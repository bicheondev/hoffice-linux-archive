name: HOffice runtime M9 HWord bootstrap CWD

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
    paths:
      - 'runtime/m6/main.c'
      - 'runtime/m8/**'
      - '.github/workflows/hoffice-runtime-m9-hword-bootstrap-cwd.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: hrt-m9-hword-bootstrap-cwd-${{ github.ref }}
  cancel-in-progress: true

env:
  ROOTFS_ARTIFACT_ID: '8968324706'
  ROOTFS_ARTIFACT_SHA256: 3e301d3c6269926c62804bff18671136fcf8c0b0b22b3952072e427a8fa9918a
  ROOTFS_ARCHIVE_SHA256: 322fcf228092b296a34edbfa7ee43f9a7b237d5bcedaee50109ac4bb44d9ca28
  QPA_RUN_ID: '31166152504'
  PROGRAM: /opt/hnc/hoffice11/Bin/hword
  PROGRAM_SHA256: 55876ea7d0c20e73d936af11cc3623c418acb09d61bde5bfeecafa1da7a9b5cb
  PLUGIN_GUEST: /opt/hnc/hoffice11/Bin/qt/plugins/platforms/libqhrtappkit.so

jobs:
  classify-bootstrap:
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the durable exact-HWord frame boundary
        run: |
          set -euxo pipefail
          test -s proofs/m7-hword-bgra-first-frame.json
          grep -F '"status": "PASS"' proofs/m7-hword-bgra-first-frame.json

      - name: Download the verified Qt 5.11.3 input QPA
        uses: actions/download-artifact@v4
        with:
          name: hrt-m8-qt5113-hrtappkit-input-qpa
          path: build/input/qpa
          repository: ${{ github.repository }}
          run-id: ${{ env.QPA_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download and verify the exact HWord guest archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p build/input/hword build/generated build/objects \
                   build/host build/proof
          curl --fail --location --retry 5 --retry-delay 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ROOTFS_ARTIFACT_ID/zip" \
            -o build/input/hword-artifact.zip
          printf '%s  %s\n' "$ROOTFS_ARTIFACT_SHA256" \
            build/input/hword-artifact.zip | shasum -a 256 -c -
          ditto -x -k build/input/hword-artifact.zip build/input/hword
          printf '%s  %s\n' "$ROOTFS_ARCHIVE_SHA256" \
            build/input/hword/hword-rootfs.tar.gz | shasum -a 256 -c -

      - name: Reconstruct the case-sensitive exact-HWord guest
        run: |
          set -euxo pipefail
          image="$RUNNER_TEMP/hrt-m9-bootstrap.sparsebundle"
          root="/tmp/h9b-$GITHUB_RUN_ID"
          rm -rf "$image" "$root"
          mkdir -p "$root"
          if ! hdiutil create -quiet -size 8g -fs APFSX \
               -volname HRTM9B -type SPARSEBUNDLE "$image"; then
            rm -rf "$image"
            hdiutil create -quiet -size 8g -fs HFSX \
              -volname HRTM9B -type SPARSEBUNDLE "$image"
          fi
          hdiutil attach -quiet -nobrowse -mountpoint "$root" "$image"
          echo "HRT_ROOT=$root" >>"$GITHUB_ENV"
          echo "HRT_IMAGE=$image" >>"$GITHUB_ENV"
          tar -xzf build/input/hword/hword-rootfs.tar.gz -C "$root"
          test -s "$root/.hrt-prepatched-v1"
          test -f "$root$PROGRAM"
          test -d "$root/opt/hnc/hoffice11/Bin/Hword"

          mkdir -p "$root$(dirname "$PLUGIN_GUEST")"
          python3 - build/input/qpa/libqhrtappkit.so.xz \
            build/input/qpa/lock.json "$root$PLUGIN_GUEST" <<'PY'
          import hashlib, json, lzma, pathlib, sys
          source = pathlib.Path(sys.argv[1])
          lock = json.loads(pathlib.Path(sys.argv[2]).read_text())
          destination = pathlib.Path(sys.argv[3])
          assert lock['toolchain']['qt_version'] == '5.11.3', lock
          compressed = source.read_bytes()
          assert hashlib.sha256(compressed).hexdigest() == lock['plugin']['xz_sha256']
          plugin = lzma.decompress(compressed)
          assert hashlib.sha256(plugin).hexdigest() == lock['plugin']['sha256_after_prepatch']
          destination.write_bytes(plugin)
          pathlib.Path('build/proof/qpa-lock.json').write_text(
              json.dumps(lock, indent=2) + '\n')
          PY
          chmod 0755 "$root$PLUGIN_GUEST"

          python3 - "$root" "$PROGRAM" "$PROGRAM_SHA256" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          program = sys.argv[2]
          marker = json.loads((root / '.hrt-prepatched-v1').read_text())
          record, = [item for item in marker['objects']
                     if item['path'] == program]
          assert record['sha256_before'] == sys.argv[3], record
          actual = hashlib.sha256((root / program.lstrip('/')).read_bytes()).hexdigest()
          assert actual == record['sha256_after'], (actual, record)
          PY

          find "$root/opt/hnc/hoffice11/Bin" -type f \
            \( -iname 'FontMap.dat' -o -iname 'fontinfo.dat' \) \
            -print | LC_ALL=C sort | tee build/proof/font-database-files.txt
          grep -F '/FontDB/FontMap.dat' build/proof/font-database-files.txt
          grep -F '/FontDB/fontinfo.dat' build/proof/font-database-files.txt
          diskutil info "$root" | tee build/proof/guest-volume.txt
          grep -F 'Case-sensitive' build/proof/guest-volume.txt

      - name: Generate the mature Linux and AppKit bridge
        run: |
          set -euxo pipefail
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          /usr/bin/arch -x86_64 /usr/bin/getconf PAGESIZE \
            | tee build/proof/x86-page-size.txt
          sw_vers | tee build/proof/sw-vers.txt

          python3 runtime/m8/augment_appkit_adapter_input.py \
            runtime/m6/appkit_adapter.m build/generated/appkit_adapter_m8.m
          python3 runtime/m6/augment_stack_hrtappkit.py \
            runtime/m3/stack.c build/generated/stack.c
          python3 runtime/m3/augment_syscalls.py \
            runtime/m3/syscall_bridge.c build/generated/stage1.c
          python3 runtime/m3/augment_directory_syscalls.py \
            build/generated/stage1.c build/generated/stage2.c
          python3 runtime/m3/augment_directory_stream.py \
            build/generated/stage2.c build/generated/stage3.c
          python3 runtime/m3/augment_pipe2.py \
            build/generated/stage3.c build/generated/stage4.c
          python3 runtime/m3/augment_eventfd2.py \
            build/generated/stage4.c build/generated/stage5.c
          python3 runtime/m3/augment_crash_signals.py \
            build/generated/stage5.c build/generated/stage6.c
          python3 runtime/m3/augment_poll.py \
            build/generated/stage6.c build/generated/stage7.c
          python3 runtime/m3/augment_posix_basics.py \
            build/generated/stage7.c build/generated/stage8.c
          python3 runtime/m3/augment_connect.py \
            build/generated/stage8.c build/generated/stage9.c
          python3 runtime/m6/augment_appkit_hostcall_deferred.py \
            build/generated/stage9.c build/generated/stage10.c
          python3 runtime/m3/augment_darwin_syscall_abi.py \
            build/generated/stage10.c build/generated/syscall_bridge.c
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build/generated/syscall_bridge.c')
          path.write_text(path.read_text().replace(
              '#define M3_TRACE_LIMIT 256u', '#define M3_TRACE_LIMIT 30000u'))
          PY
          grep -q 'host_getdents64_stream_bridge' build/generated/syscall_bridge.c
          grep -q 'case HRT_M6_HOSTCALL_SYSCALL' build/generated/syscall_bridge.c

      - name: Compile and sign the bootstrap-classification runtime
        run: |
          set -euxo pipefail
          common=(-arch x86_64 -std=c17 -O2 -g -fno-stack-protector \
            -fno-omit-frame-pointer -Wall -Wextra -Werror -Wpedantic \
            -Wno-unused-function -Wno-unused-variable \
            -Iruntime/m8 -Iruntime/m6 -Iruntime/m3 -Iruntime/m1)
          index=0
          for source in runtime/m6/main.c runtime/m6/hostcall_trampoline.c \
            runtime/m1/common.c runtime/m3/elf_map.c build/generated/stack.c \
            runtime/m3/patch.c build/generated/syscall_bridge.c; do
            clang "${common[@]}" -c "$source" \
              -o "build/objects/c-${index}.o"
            index=$((index+1))
          done
          clang -arch x86_64 -std=c17 -O2 -g -fobjc-arc \
            -Wall -Wextra -Werror -Wpedantic -Iruntime/m8 -Iruntime/m6 \
            -c build/generated/appkit_adapter_m8.m \
            -o build/objects/appkit-adapter.o
          clang -arch x86_64 -std=c17 -O2 -g -fobjc-arc \
            -Wall -Wextra -Werror -Wpedantic -Iruntime/m8 -Iruntime/m6 \
            -c runtime/m8/appkit_input.m -o build/objects/appkit-input.o
          clang -arch x86_64 -g -c runtime/m1/enter_guest.S \
            -o build/objects/enter-guest.o
          clang -arch x86_64 -g -c runtime/m6/hostcall_trampoline.S \
            -o build/objects/hostcall-trampoline.o
          clang -arch x86_64 build/objects/*.o -Wl,-pagezero_size,0x1000 \
            -framework AppKit -framework CoreGraphics -framework ImageIO \
            -o build/host/hrt-m9-hword-bootstrap
          file build/host/hrt-m9-hword-bootstrap \
            | tee build/proof/host-file.txt
          lipo -info build/host/hrt-m9-hword-bootstrap \
            | tee build/proof/host-arch.txt
          codesign --force --sign - --timestamp=none \
            build/host/hrt-m9-hword-bootstrap
          codesign --verify --strict build/host/hrt-m9-hword-bootstrap

      - name: Run exact HWord and retain its first native window classification
        run: |
          set -uxo pipefail
          export HRT_M6_CAPTURE_PATH="$PWD/build/proof/pre-frame-window.png"
          export HRT_M7_CAPTURE_PATH="$PWD/build/proof/hword-bootstrap-frame.png"
          unset HRT_M8_SYNTHETIC_INPUT
          : >build/proof/stdout.txt
          : >build/proof/stderr.txt
          /usr/bin/arch -x86_64 build/host/hrt-m9-hword-bootstrap \
            --root "$HRT_ROOT" --program "$PROGRAM" \
            >build/proof/stdout.txt 2>build/proof/stderr.txt &
          pid=$!
          observed=0
          for _ in $(jot 600); do
            if grep -q 'HRT M6 QPA: CREATE ' build/proof/stderr.txt 2>/dev/null && \
               grep -q 'HRT M7 QPA: BGRA frame accepted' build/proof/stderr.txt 2>/dev/null; then
              observed=1
              sleep 1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 0.05
          done
          if kill -0 "$pid" 2>/dev/null; then
            ps -o pid,ppid,state,%cpu,%mem,etime,command -p "$pid" \
              >build/proof/process.txt 2>&1 || true
            /usr/bin/sample "$pid" 1 1 -file build/proof/sample.txt \
              >/dev/null 2>&1 || true
            kill -TERM "$pid" 2>/dev/null || true
            sleep 0.25
            kill -KILL "$pid" 2>/dev/null || true
          fi
          set +e
          wait "$pid"
          raw_status=$?
          set -e
          printf '%s\n' "$raw_status" >build/proof/raw-exit-status.txt
          printf '%s\n' "$observed" >build/proof/observed-window.txt
          grep -E 'guest current directory=|HRT M6 QPA: QPlatformWindow constructed|HRT M6 QPA: CREATE |HRT M7 QPA: BGRA frame accepted|fatal signal|Linux syscall ENOSYS' \
            build/proof/stderr.txt | tail -n 5000 \
            | tee build/proof/key-lines.txt || true
          cat build/proof/key-lines.txt
          echo "raw-status=$raw_status observed=$observed"

      - name: Classify whether HWord passed its font-database initialization
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          stderr = Path('build/proof/stderr.txt').read_text(errors='replace')
          create_lines = re.findall(r'HRT M6 QPA: CREATE .*', stderr)
          titles = []
          geometries = []
          for line in create_lines:
              title_match = re.search(r' title=(.*?) handle=', line)
              geometry_match = re.search(r' geometry=(\d+)x(\d+)', line)
              if title_match:
                  titles.append(title_match.group(1))
              if geometry_match:
                  geometries.append([
                      int(geometry_match.group(1)),
                      int(geometry_match.group(2)),
                  ])

          cwd_expected_suffix = '/opt/hnc/hoffice11/Bin'
          cwd_lines = re.findall(r'hrt-m6: guest current directory=(.*)', stderr)
          cwd_correct = bool(cwd_lines and cwd_lines[-1].endswith(cwd_expected_suffix))
          frame = Path('build/proof/hword-bootstrap-frame.png')
          frame_present = frame.is_file() and frame.stat().st_size > 0
          initialization_error = any(title == 'Initialization Error'
                                     for title in titles)

          if not cwd_correct:
              classification = 'GUEST_CWD_NOT_ESTABLISHED'
          elif not titles:
              classification = 'NO_QT_NATIVE_WINDOW'
          elif initialization_error:
              classification = 'INITIALIZATION_ERROR_REMAINS'
          elif frame_present:
              classification = 'NONERROR_WINDOW_WITH_FRAME'
          else:
              classification = 'NONERROR_WINDOW_WITHOUT_FRAME'

          diagnostic = {
              'schema': 1,
              'milestone': 'M9-bootstrap',
              'status': 'PASS' if classification == 'NONERROR_WINDOW_WITH_FRAME'
                                  else 'DIAGNOSTIC',
              'classification': classification,
              'workflow_run': os.environ['GITHUB_RUN_ID'],
              'commit': os.environ['GITHUB_SHA'],
              'program': os.environ['PROGRAM'],
              'program_sha256': os.environ['PROGRAM_SHA256'],
              'rootfs_artifact_id': os.environ['ROOTFS_ARTIFACT_ID'],
              'qpa_run_id': os.environ['QPA_RUN_ID'],
              'guest_cwd_lines': cwd_lines,
              'guest_cwd_correct': cwd_correct,
              'window_titles': titles,
              'window_geometries': geometries,
              'initialization_error_observed': initialization_error,
              'frame_present': frame_present,
              'frame_sha256': hashlib.sha256(frame.read_bytes()).hexdigest()
                  if frame_present else None,
              'font_database_files': Path(
                  'build/proof/font-database-files.txt').read_text().splitlines(),
              'raw_exit_status': int(Path(
                  'build/proof/raw-exit-status.txt').read_text()),
          }

          Path('diagnostics').mkdir(exist_ok=True)
          run_path = Path(
              f"diagnostics/m9-hword-bootstrap-cwd-{os.environ['GITHUB_RUN_ID']}.json")
          latest_path = Path('diagnostics/m9-hword-bootstrap-cwd-latest.json')
          payload = json.dumps(diagnostic, indent=2) + '\n'
          run_path.write_text(payload)
          latest_path.write_text(payload)
          Path('diagnostics/m9-hword-bootstrap-cwd-latest.md').write_text(
              '# HWord M9 bootstrap CWD diagnostic\n\n'
              f"- Classification: `{classification}`\n"
              f"- Guest CWD correct: `{cwd_correct}`\n"
              f"- Window titles: `{titles}`\n"
              f"- Window geometries: `{geometries}`\n"
              f"- Initialization Error: `{initialization_error}`\n"
              f"- Frame present: `{frame_present}`\n"
          )
          Path('build/proof/summary.json').write_text(payload)

          if classification == 'NONERROR_WINDOW_WITH_FRAME':
              Path('proofs').mkdir(exist_ok=True)
              Path('proofs/m9-hword-bootstrap-past-initialization.json').write_text(
                  payload)
          print(payload)
          PY

      - name: Commit the durable bootstrap diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin codex/hoffice-runtime-from-scratch
          git add diagnostics/m9-hword-bootstrap-cwd-*.json \
                  diagnostics/m9-hword-bootstrap-cwd-latest.json \
                  diagnostics/m9-hword-bootstrap-cwd-latest.md
          if test -f proofs/m9-hword-bootstrap-past-initialization.json; then
            git add proofs/m9-hword-bootstrap-past-initialization.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'diagnostic: classify exact HWord bootstrap after guest CWD fix'
            git push origin HEAD:codex/hoffice-runtime-from-scratch
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hrt-m9-hword-bootstrap-cwd-proof
          path: |
            build/host/hrt-m9-hword-bootstrap
            build/proof
            diagnostics/m9-hword-bootstrap-cwd-*.json
            diagnostics/m9-hword-bootstrap-cwd-latest.md
            proofs/m9-hword-bootstrap-past-initialization.json
          if-no-files-found: warn
          retention-days: 14

      - name: Detach the case-sensitive HWord guest
        if: always()
        run: hdiutil detach -quiet "$HRT_ROOT" || true
