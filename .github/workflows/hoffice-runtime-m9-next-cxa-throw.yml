name: HOffice runtime M9 next C++ throw

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
    paths:
      - 'diagnostics/m9-hword-after-provider-string-latest.json'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: hrt-m9-next-cxa-throw-${{ github.ref }}
  cancel-in-progress: true

env:
  ROOTFS_ARTIFACT_ID: '8968324706'
  ROOTFS_ARTIFACT_SHA256: 3e301d3c6269926c62804bff18671136fcf8c0b0b22b3952072e427a8fa9918a
  ROOTFS_ARCHIVE_SHA256: 322fcf228092b296a34edbfa7ee43f9a7b237d5bcedaee50109ac4bb44d9ca28
  QPA_RUN_ID: '31166152504'
  ASSET_NAME: hoffice_11.20.0.1520+h1_amd64.deb
  RELEASE_TAG: linux-11.20-series
  PACKAGE_SHA256: 23fc502c430b4dd829fee36740fbce06b819cd51d36fcdf0afbb6fcc5d0b7c46
  PROGRAM: /opt/hnc/hoffice11/Bin/hword
  PROGRAM_SHA256: 55876ea7d0c20e73d936af11cc3623c418acb09d61bde5bfeecafa1da7a9b5cb
  PLUGIN_GUEST: /opt/hnc/hoffice11/Bin/qt/plugins/platforms/libqhrtappkit.so
  LIBSTDCXX_GUEST: /lib/x86_64-linux-gnu/libstdc++.so.6

jobs:
  capture-next-throw:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether a post-provider exception probe is needed
        run: |
          set -euxo pipefail
          test -s diagnostics/m9-hword-after-provider-string-latest.json
          mkdir -p build/proof build/logs build/caller-object diagnostics
          python3 - <<'PY'
          import json,pathlib
          source=json.loads(pathlib.Path(
              'diagnostics/m9-hword-after-provider-string-latest.json').read_text())
          need=not (source['frame_present'] or source['window_titles'] or
                    source['reached_deadline'])
          pathlib.Path('build/proof/need-cxa.txt').write_text(
              ('1' if need else '0')+'\n')
          pathlib.Path('build/proof/source-next-boundary.json').write_text(
              json.dumps(source,indent=2)+'\n')
          provider=source['source_candidate_result']
          value=source['selected_value']
          abi=source['method_abi']
          target=provider['method_target']
          pathlib.Path('build/proof/selected-value.txt').write_text(value+'\n')
          pathlib.Path('build/proof/method-abi.txt').write_text(abi+'\n')
          pathlib.Path('build/proof/method-target.json').write_text(
              json.dumps(target,indent=2)+'\n')
          print(json.dumps({'need_cxa':need,'value':value,'abi':abi},indent=2))
          PY
          echo "NEED_CXA=$(cat build/proof/need-cxa.txt)" >>"$GITHUB_ENV"

      - name: Download the verified Qt 5.11.3 hrtappkit QPA
        if: env.NEED_CXA == '1'
        uses: actions/download-artifact@v4
        with:
          name: hrt-m8-qt5113-hrtappkit-input-qpa
          path: build/input/qpa
          repository: ${{ github.repository }}
          run-id: ${{ env.QPA_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download and verify exact HWord inputs
        if: env.NEED_CXA == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p build/input/hword build/input/deb build/generated \
                   build/objects build/host
          curl --fail --location --retry 5 --retry-delay 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ROOTFS_ARTIFACT_ID/zip" \
            -o build/input/hword-artifact.zip
          printf '%s  %s\n' "$ROOTFS_ARTIFACT_SHA256" \
            build/input/hword-artifact.zip | shasum -a 256 -c -
          ditto -x -k build/input/hword-artifact.zip build/input/hword
          printf '%s  %s\n' "$ROOTFS_ARCHIVE_SHA256" \
            build/input/hword/hword-rootfs.tar.gz | shasum -a 256 -c -
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_NAME" \
            --dir build/input/deb
          printf '%s  %s\n' "$PACKAGE_SHA256" \
            "build/input/deb/$ASSET_NAME" | shasum -a 256 -c -

      - name: Reconstruct and patch the exact two-site guest
        if: env.NEED_CXA == '1'
        run: |
          set -euxo pipefail
          image="$RUNNER_TEMP/hrt-m9-next-cxa.sparsebundle"
          root="/tmp/h9x-$GITHUB_RUN_ID"
          rm -rf "$image" "$root"; mkdir -p "$root"
          if ! hdiutil create -quiet -size 12g -fs APFSX \
               -volname HRTM9X -type SPARSEBUNDLE "$image"; then
            rm -rf "$image"
            hdiutil create -quiet -size 12g -fs HFSX \
              -volname HRTM9X -type SPARSEBUNDLE "$image"
          fi
          hdiutil attach -quiet -nobrowse -mountpoint "$root" "$image"
          echo "HRT_ROOT=$root" >>"$GITHUB_ENV"
          echo "HRT_IMAGE=$image" >>"$GITHUB_ENV"
          tar -xzf build/input/hword/hword-rootfs.tar.gz -C "$root"
          test -s "$root/.hrt-prepatched-v1"
          test -f "$root$PROGRAM"
          test -f "$root$LIBSTDCXX_GUEST"

          deb="build/input/deb/$ASSET_NAME"
          data_member=$(ar t "$deb" | awk '/^data\.tar/{print; exit}')
          test -n "$data_member"
          ar p "$deb" "$data_member" >"build/input/deb/$data_member"
          tar -xf "build/input/deb/$data_member" -C "$root" \
            ./opt/hnc/hoffice11/Shared/Fonts \
            ./opt/hnc/hoffice11/Shared/TTF
          rm -f "$root/opt/hnc/hoffice1"
          ln -s hoffice11 "$root/opt/hnc/hoffice1"
          test -f "$root/opt/hnc/hoffice1/Shared/Fonts/HGSMJ.HFT"

          mkdir -p "$root$(dirname "$PLUGIN_GUEST")"
          python3 - build/input/qpa/libqhrtappkit.so.xz \
            build/input/qpa/lock.json "$root$PLUGIN_GUEST" <<'PY'
          import hashlib,json,lzma,pathlib,sys
          compressed=pathlib.Path(sys.argv[1]).read_bytes()
          lock=json.loads(pathlib.Path(sys.argv[2]).read_text())
          assert hashlib.sha256(compressed).hexdigest()==lock['plugin']['xz_sha256']
          plugin=lzma.decompress(compressed)
          assert hashlib.sha256(plugin).hexdigest()==lock['plugin']['sha256_after_prepatch']
          pathlib.Path(sys.argv[3]).write_bytes(plugin)
          pathlib.Path('build/proof/qpa-lock.json').write_text(
              json.dumps(lock,indent=2)+'\n')
          PY
          chmod 0755 "$root$PLUGIN_GUEST"

          python3 - "$root" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          target=json.loads(pathlib.Path(
              'build/proof/method-target.json').read_text())
          method=root/target['guest_path'].lstrip('/')
          assert method.is_file(),method
          assert hashlib.sha256(method.read_bytes()).hexdigest()==target[
              'object_sha256_before_probe']
          pathlib.Path('build/proof/method-guest-path.txt').write_text(
              target['guest_path']+'\n')
          pathlib.Path('build/proof/method-file-offset.txt').write_text(
              str(target['file_offset'])+'\n')
          PY
          method_path=$(cat build/proof/method-guest-path.txt)
          method_offset=$(cat build/proof/method-file-offset.txt)
          python3 runtime/m9/patch_elf_int3_at_offset.py \
            "$root$method_path" --file-offset "$method_offset" \
            --label 'provider-vtable+0x130' --signature-length 24 \
            --manifest build/proof/method-int3-manifest.json
          python3 runtime/m3/patch_elf_int3_probe_regex.py \
            "$root$LIBSTDCXX_GUEST" \
            --symbol-regex '^__cxa_throw$' --label '__cxa_throw' \
            --signature-length 24 \
            --manifest build/proof/cxa-int3-manifest.json
          diskutil info "$root" | tee build/proof/guest-volume.txt
          grep -F 'Case-sensitive' build/proof/guest-volume.txt

      - name: Generate the provider override and exact throw probe
        if: env.NEED_CXA == '1'
        run: |
          set -euxo pipefail
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          abi=$(cat build/proof/method-abi.txt)
          value=$(cat build/proof/selected-value.txt)
          python3 runtime/m8/augment_appkit_adapter_input.py \
            runtime/m6/appkit_adapter.m build/generated/appkit_adapter_m8.m
          python3 runtime/m6/augment_stack_hrtappkit.py \
            runtime/m3/stack.c build/generated/stack.c
          python3 runtime/m3/augment_syscalls.py \
            runtime/m3/syscall_bridge.c build/generated/stage1.c
          python3 runtime/m3/augment_directory_syscalls.py \
            build/generated/stage1.c build/generated/stage2.c
          python3 runtime/m3/augment_directory_stream.py \
            build/generated/stage2.c build/generated/stage3.c
          python3 runtime/m3/augment_pipe2.py \
            build/generated/stage3.c build/generated/stage4.c
          python3 runtime/m3/augment_eventfd2.py \
            build/generated/stage4.c build/generated/stage5.c
          python3 runtime/m3/augment_crash_signals.py \
            build/generated/stage5.c build/generated/stage6.c
          python3 runtime/m3/augment_poll.py \
            build/generated/stage6.c build/generated/stage7.c
          python3 runtime/m3/augment_posix_basics.py \
            build/generated/stage7.c build/generated/stage8.c
          python3 runtime/m3/augment_connect.py \
            build/generated/stage8.c build/generated/stage9.c
          python3 runtime/m6/augment_appkit_hostcall_deferred.py \
            build/generated/stage9.c build/generated/stage10.c
          python3 runtime/m3/augment_darwin_syscall_abi.py \
            build/generated/stage10.c build/generated/stage11.c
          python3 runtime/m9/augment_exec_mmap_trace.py \
            build/generated/stage11.c build/generated/stage12.c
          python3 runtime/m9/augment_int3_string_override.py \
            build/generated/stage12.c \
            build/proof/method-int3-manifest.json \
            build/generated/stage13.c --abi "$abi" --value "$value"
          python3 runtime/m9/augment_int3_cxa_throw_probe.py \
            build/generated/stage13.c \
            build/proof/cxa-int3-manifest.json \
            build/generated/syscall_bridge.c --exit-status 194
          python3 - <<'PY'
          from pathlib import Path
          path=Path('build/generated/syscall_bridge.c')
          path.write_text(path.read_text().replace(
              '#define M3_TRACE_LIMIT 256u','#define M3_TRACE_LIMIT 120000u'))
          PY
          grep -Fq 'HRT M9 METHOD OVERRIDE:' \
            build/generated/syscall_bridge.c
          grep -Fq 'HRT M9 CXA THROW:' build/generated/syscall_bridge.c

      - name: Compile and sign the two-site diagnostic runtime
        if: env.NEED_CXA == '1'
        run: |
          set -euxo pipefail
          common=(-arch x86_64 -std=c17 -O2 -g -fno-stack-protector \
            -fno-omit-frame-pointer -Wall -Wextra -Werror -Wpedantic \
            -Wno-unused-function -Wno-unused-variable \
            -Iruntime/m8 -Iruntime/m6 -Iruntime/m3 -Iruntime/m1)
          index=0
          for source in runtime/m6/main.c runtime/m6/hostcall_trampoline.c \
            runtime/m1/common.c runtime/m3/elf_map.c build/generated/stack.c \
            runtime/m3/patch.c build/generated/syscall_bridge.c; do
            clang "${common[@]}" -c "$source" \
              -o "build/objects/c-${index}.o"
            index=$((index+1))
          done
          clang -arch x86_64 -std=c17 -O2 -g -fobjc-arc \
            -Wall -Wextra -Werror -Wpedantic -Iruntime/m8 -Iruntime/m6 \
            -c build/generated/appkit_adapter_m8.m \
            -o build/objects/appkit-adapter.o
          clang -arch x86_64 -std=c17 -O2 -g -fobjc-arc \
            -Wall -Wextra -Werror -Wpedantic -Iruntime/m8 -Iruntime/m6 \
            -c runtime/m8/appkit_input.m -o build/objects/appkit-input.o
          clang -arch x86_64 -g -c runtime/m1/enter_guest.S \
            -o build/objects/enter-guest.o
          clang -arch x86_64 -g -c runtime/m6/hostcall_trampoline.S \
            -o build/objects/hostcall-trampoline.o
          clang -arch x86_64 build/objects/*.o -Wl,-pagezero_size,0x1000 \
            -framework AppKit -framework CoreGraphics -framework ImageIO \
            -o build/host/hrt-m9-next-cxa-throw
          codesign --force --sign - --timestamp=none \
            build/host/hrt-m9-next-cxa-throw
          codesign --verify --strict build/host/hrt-m9-next-cxa-throw

      - name: Stop at the next exact C++ throw
        if: env.NEED_CXA == '1'
        run: |
          set -uxo pipefail
          export HRT_M6_CAPTURE_PATH="$PWD/build/logs/pre-frame.png"
          export HRT_M7_CAPTURE_PATH="$PWD/build/logs/frame.png"
          unset HRT_M8_SYNTHETIC_INPUT
          : >build/logs/stdout.txt; : >build/logs/stderr.txt
          /usr/bin/arch -x86_64 build/host/hrt-m9-next-cxa-throw \
            --root "$HRT_ROOT" --program "$PROGRAM" \
            >build/logs/stdout.txt 2>build/logs/stderr.txt &
          pid=$!
          cxa_reached=0
          reached_deadline=1
          for _ in $(jot 500); do
            if grep -q 'HRT M9 CXA THROW:' \
                 build/logs/stderr.txt 2>/dev/null; then
              cxa_reached=1
              reached_deadline=0
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              reached_deadline=0
              break
            fi
            sleep 0.05
          done
          if kill -0 "$pid" 2>/dev/null; then
            ps -o pid,ppid,state,%cpu,%mem,etime,command -p "$pid" \
              >build/logs/process.txt 2>&1 || true
            /usr/bin/sample "$pid" 1 1 -file build/logs/sample.txt \
              >/dev/null 2>&1 || true
            kill -TERM "$pid" 2>/dev/null || true
            sleep 0.25
            kill -KILL "$pid" 2>/dev/null || true
          fi
          set +e; wait "$pid"; raw_status=$?; set -e
          printf '%s\n' "$raw_status" >build/logs/raw-exit-status.txt
          printf '%s\n' "$cxa_reached" >build/logs/cxa-reached.txt
          printf '%s\n' "$reached_deadline" \
            >build/logs/reached-deadline.txt
          grep -F 'HRT M9 CXA THROW:' build/logs/stderr.txt \
            | tee build/logs/cxa-lines.txt || true
          grep -F 'HRT M9 MAP:' build/logs/stderr.txt \
            >build/logs/executable-maps.txt || true
          tail -n 2000 build/logs/stderr.txt \
            >build/logs/stderr-tail.txt
          cat build/logs/cxa-lines.txt

      - name: Attribute the next throw caller and persist the diagnosis
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,shutil
          source=json.loads(pathlib.Path(
              'build/proof/source-next-boundary.json').read_text())
          need=pathlib.Path('build/proof/need-cxa.txt').read_text().strip()=='1'
          if not need:
              result={
                  'schema':1,
                  'milestone':'M9-next-cxa-throw',
                  'status':'SKIPPED',
                  'workflow_run':os.environ['GITHUB_RUN_ID'],
                  'reason':'previous run already produced a window, frame, or durable survival boundary',
                  'source_boundary':source,
              }
          else:
              stderr=pathlib.Path('build/logs/stderr.txt').read_text(errors='replace')
              cxa_lines=pathlib.Path(
                  'build/logs/cxa-lines.txt').read_text(errors='replace').splitlines()
              cxa_reached=bool(int(pathlib.Path(
                  'build/logs/cxa-reached.txt').read_text()))
              fields={}
              owner=None; guest_path=None; file_offset=None; object_copy=None
              if cxa_reached:
                  assert len(cxa_lines)==1,cxa_lines
                  line=cxa_lines[0]
                  return_match=re.search(r' return=(0x[0-9a-f]+) ',line)
                  type_match=re.search(r' type-name=(.*?) destructor=',line)
                  assert return_match and type_match,line
                  return_address=int(return_match.group(1),16)
                  map_pattern=re.compile(
                      r'HRT M9 MAP: start=(0x[0-9a-f]+) end=(0x[0-9a-f]+) '
                      r'offset=(0x[0-9a-f]+) fd=(\d+) path=(.*)$')
                  mappings=[]
                  for map_line in pathlib.Path(
                          'build/logs/executable-maps.txt').read_text(
                              errors='replace').splitlines():
                      mapped=map_pattern.fullmatch(map_line)
                      if mapped:
                          mappings.append({
                              'start':int(mapped.group(1),16),
                              'end':int(mapped.group(2),16),
                              'file_offset':int(mapped.group(3),16),
                              'fd':int(mapped.group(4)),
                              'host_path':mapped.group(5),
                          })
                  owner=next((item for item in mappings
                              if item['start'] <= return_address < item['end']),None)
                  if owner:
                      match=re.search(r'(/(?:opt|lib|lib64|usr|bin|sbin)/.*)$',
                                      owner['host_path'])
                      if match:
                          guest_path=match.group(1)
                          file_offset=(owner['file_offset']+
                                       return_address-owner['start'])
                          host=pathlib.Path(owner['host_path'])
                          if host.is_file():
                              object_copy=pathlib.Path(
                                  'build/caller-object')/host.name
                              shutil.copy2(host,object_copy)
                  fields={
                      'raw_line':line,
                      'return_address':hex(return_address),
                      'type_name':type_match.group(1),
                      'registers':{name:value for name,value in re.findall(
                          r'([a-z][a-z0-9-]*)=(0x[0-9a-f]+)',line)},
                  }
              fatal=[line for line in stderr.splitlines()
                     if 'fatal signal' in line]
              result={
                  'schema':1,
                  'milestone':'M9-next-cxa-throw',
                  'status':'PASS' if cxa_reached else 'NO_CXA_THROW_OBSERVED',
                  'workflow_run':os.environ['GITHUB_RUN_ID'],
                  'commit':os.environ['GITHUB_SHA'],
                  'cxa_reached':cxa_reached,
                  'throw':fields,
                  'caller_mapping':owner,
                  'caller_guest_path':guest_path,
                  'caller_file_offset':file_offset,
                  'caller_object_copy':str(object_copy) if object_copy else None,
                  'fatal_signal_lines':fatal,
                  'raw_exit_status':int(pathlib.Path(
                      'build/logs/raw-exit-status.txt').read_text()),
                  'reached_deadline':bool(int(pathlib.Path(
                      'build/logs/reached-deadline.txt').read_text())),
                  'override_hits':stderr.count('HRT M9 METHOD OVERRIDE:'),
                  'stderr_sha256':hashlib.sha256(stderr.encode()).hexdigest(),
                  'stderr_tail':stderr.splitlines()[-300:],
                  'source_boundary':source,
              }
          payload=json.dumps(result,indent=2)+'\n'
          pathlib.Path('diagnostics').mkdir(exist_ok=True)
          pathlib.Path(
              f"diagnostics/m9-hword-next-cxa-throw-{os.environ['GITHUB_RUN_ID']}.json"
          ).write_text(payload)
          pathlib.Path(
              'diagnostics/m9-hword-next-cxa-throw-latest.json').write_text(payload)
          pathlib.Path(
              'diagnostics/m9-hword-next-cxa-throw-latest.md').write_text(
              '# HWord next C++ throw\n\n'
              f"- Status: `{result['status']}`\n"
              f"- C++ throw reached: `{result.get('cxa_reached')}`\n"
              f"- Exception type: `{result.get('throw',{}).get('type_name')}`\n"
              f"- Caller object: `{result.get('caller_guest_path')}`\n"
              f"- Caller file offset: `{result.get('caller_file_offset')}`\n"
          )
          pathlib.Path('build/proof/final-summary.json').write_text(payload)
          print(payload)
          PY

      - name: Commit the durable next-throw result
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin codex/hoffice-runtime-from-scratch
          git add diagnostics/m9-hword-next-cxa-throw-*.json \
                  diagnostics/m9-hword-next-cxa-throw-latest.md
          if ! git diff --cached --quiet; then
            git commit -m 'diagnostic: capture exact HWord post-provider C++ throw'
            git push origin HEAD:codex/hoffice-runtime-from-scratch
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hrt-m9-next-cxa-throw-proof
          path: |
            build/host/hrt-m9-next-cxa-throw
            build/proof
            build/logs
            build/caller-object
            diagnostics/m9-hword-next-cxa-throw-*.json
            diagnostics/m9-hword-next-cxa-throw-latest.md
          if-no-files-found: warn
          retention-days: 14

      - name: Detach the exact HWord guest
        if: always() && env.NEED_CXA == '1'
        run: hdiutil detach -quiet "$HRT_ROOT" || true
