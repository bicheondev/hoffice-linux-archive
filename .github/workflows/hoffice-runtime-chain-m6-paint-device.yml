name: HOffice chain M6 offscreen paint device

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
    paths:
      - 'proofs/chain/m6-backing-store-constructor.json'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  probe:
    uses: ./.github/workflows/hoffice-runtime-guest-symbol-probe-chain.yml
    with:
      predecessor_proof: proofs/chain/m6-backing-store-constructor.json
      symbol_regex: 'QOffscreenBackingStore.*paintDevice'
      label: Qt offscreen backing store paintDevice
      milestone: M6-chain-offscreen-paint-device
      diagnostic_path: diagnostics/chain/m6-paint-device.json
      proof_path: proofs/chain/m6-paint-device.json
      trace_limit: 104000
      run_seconds: 55
      require_pipe2: true
