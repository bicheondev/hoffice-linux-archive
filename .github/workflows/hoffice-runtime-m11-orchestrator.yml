name: HOffice runtime M11 diagnostic orchestrator

on:
  push:
    branches: [codex/hoffice-runtime-from-scratch]
    paths:
      - 'diagnostics/m11-empty-fallback-latest.json'
      - 'diagnostics/m11-sendfile-fallback-latest.json'
      - 'diagnostics/m11-empty-mask-matrix-latest.json'
      - 'diagnostics/m11-empty-open-caller-static-latest.json'
      - 'diagnostics/m11-empty-open-caller-ghidra-latest.json'
      - '.github/workflows/hoffice-runtime-m11-orchestrator.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: hrt-m11-diagnostic-orchestrator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify-and-route:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify the strongest durable frontier
        id: classify
        run: |
          set -euxo pipefail
          mkdir -p diagnostics
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          names = {
              'empty_fallback': 'diagnostics/m11-empty-fallback-latest.json',
              'sendfile_fallback': 'diagnostics/m11-sendfile-fallback-latest.json',
              'mask_matrix': 'diagnostics/m11-empty-mask-matrix-latest.json',
              'caller_static': 'diagnostics/m11-empty-open-caller-static-latest.json',
              'caller_ghidra': 'diagnostics/m11-empty-open-caller-ghidra-latest.json',
          }
          evidence = {}
          for key, name in names.items():
              path = Path(name)
              if path.is_file():
                  evidence[key] = json.loads(path.read_text(encoding='utf-8'))

          route = 'WAIT_FOR_EMPTY_FALLBACK_RESULT'
          reason = 'No durable empty-fallback classification is present.'
          best_status = 'DIAGNOSTIC'

          combined = evidence.get('sendfile_fallback')
          matrix = evidence.get('mask_matrix')
          baseline = evidence.get('empty_fallback')
          ghidra = evidence.get('caller_ghidra')
          static = evidence.get('caller_static')

          def accepted(item):
              return item and (
                  item.get('status') == 'PASS' or
                  'TEXT_ACCEPTED' in item.get('classification',''))

          def editor(item):
              if not item: return False
              return ('EDITOR_MATERIALIZED' in item.get('classification','') or
                      bool(item.get('editor_markers')) or
                      bool(item.get('best_result',{}).get('editor_materialized')))

          if accepted(combined) or accepted(matrix) or accepted(baseline):
              route = 'M12_EDITOR_INPUT_CREDIT'
              reason = 'A credible HwordAppView accepted staged text input.'
              best_status = 'PASS'
          elif editor(combined) or editor(matrix) or editor(baseline):
              route = 'M12_EDITOR_FOCUS_AND_TEXT'
              reason = 'The document editor materialized but text credit is incomplete.'
              best_status = 'PARTIAL_PASS'
          elif matrix:
              results = matrix.get('results', [])
              if results and all(item.get('modal') for item in results):
                  route = 'M11_PATCH_CLASSIFIER_CALLER'
                  reason = (
                      'All independently masked empty-open variants retained the '
                      'validation modal; host-level redirection is insufficient.')
              elif matrix.get('best_result',{}).get('classification','').startswith('NO_MODAL'):
                  route = 'M11_AUDIT_POST_CLASSIFIER_DEPENDENCIES'
                  reason = (
                      'At least one empty-open mask removed the modal without '
                      'materializing HwordAppView.')
              else:
                  route = 'M11_REVIEW_MASK_MATRIX'
                  reason = 'The mask matrix produced a mixed diagnostic frontier.'
          elif combined:
              classification = combined.get('classification','')
              if 'MODAL_PERSISTS' in classification:
                  route = 'M11_RUN_EMPTY_MASK_MATRIX'
                  reason = (
                      'sendfile is implemented but the all-three host fallback '
                      'still retains the modal.')
              elif 'NO_MODAL_NO_EDITOR' in classification:
                  route = 'M11_AUDIT_POST_CLASSIFIER_DEPENDENCIES'
                  reason = 'The combined experiment removed the modal but no editor appeared.'
              elif combined.get('fatal_observed'):
                  route = 'M11_REPAIR_COMBINED_HOST_FATAL'
                  reason = 'The sendfile/fallback host hit a fatal runtime boundary.'
          elif baseline:
              classification = baseline.get('classification','')
              if 'MODAL_PERSISTS' in classification:
                  route = 'M11_WAIT_FOR_SENDFILE_AND_MATRIX'
                  reason = 'The bounded HWDT fallback alone did not remove the modal.'
              elif 'REMOVED_MODAL_NO_EDITOR' in classification:
                  route = 'M11_WAIT_FOR_SENDFILE_REPLAY'
                  reason = 'The modal is removed; syscall 40 and later dependencies remain.'
              elif baseline.get('fatal_observed'):
                  route = 'M11_REPAIR_EMPTY_FALLBACK_FATAL'
                  reason = 'The empty-fallback host hit a fatal runtime boundary.'

          if route == 'M11_PATCH_CLASSIFIER_CALLER':
              if ghidra and ghidra.get('decompilation_completed'):
                  route = 'M11_PATCH_DECOMPILED_CLASSIFIER_CALLER'
                  reason += ' Bounded Ghidra attribution is available.'
              elif static:
                  route = 'M11_DECOMPILE_CLASSIFIER_CALLER'
                  reason += ' Static attribution is available; decompilation is pending.'

          payload = {
              'schema': 1,
              'workflow_run': os.environ['GITHUB_RUN_ID'],
              'commit': os.environ['GITHUB_SHA'],
              'status': best_status,
              'route': route,
              'reason': reason,
              'available_evidence': sorted(evidence),
              'evidence': evidence,
          }
          encoded = json.dumps(payload, ensure_ascii=False, indent=2) + '\n'
          Path('diagnostics/m11-orchestrator-latest.json').write_text(
              encoded, encoding='utf-8')
          Path(f"diagnostics/m11-orchestrator-{os.environ['GITHUB_RUN_ID']}.json").write_text(
              encoded, encoding='utf-8')
          Path('diagnostics/m11-orchestrator-latest.md').write_text(
              '# HOffice runtime M11 orchestrator\n\n'
              f"- Status: `{best_status}`\n"
              f"- Route: `{route}`\n"
              f"- Reason: {reason}\n"
              f"- Evidence: `{sorted(evidence)}`\n",
              encoding='utf-8')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f'route={route}\n')
          print(encoded)
          PY

      - name: Dispatch any missing deterministic experiment
        env:
          GH_TOKEN: ${{ github.token }}
          ROUTE: ${{ steps.classify.outputs.route }}
        run: |
          set -euxo pipefail
          case "$ROUTE" in
            M11_RUN_EMPTY_MASK_MATRIX|M11_WAIT_FOR_SENDFILE_AND_MATRIX)
              gh workflow run hoffice-runtime-m11-build-empty-mask-matrix.yml \
                --ref codex/hoffice-runtime-from-scratch || true
              gh workflow run hoffice-runtime-m11-empty-mask-matrix-replay.yml \
                --ref codex/hoffice-runtime-from-scratch || true
              gh workflow run hoffice-runtime-m11-build-sendfile-fallback-host.yml \
                --ref codex/hoffice-runtime-from-scratch || true
              gh workflow run hoffice-runtime-m11-sendfile-fallback-replay.yml \
                --ref codex/hoffice-runtime-from-scratch || true
              ;;
            M11_WAIT_FOR_SENDFILE_REPLAY)
              gh workflow run hoffice-runtime-m11-build-sendfile-fallback-host.yml \
                --ref codex/hoffice-runtime-from-scratch || true
              gh workflow run hoffice-runtime-m11-sendfile-fallback-replay.yml \
                --ref codex/hoffice-runtime-from-scratch || true
              ;;
            M11_DECOMPILE_CLASSIFIER_CALLER|M11_PATCH_CLASSIFIER_CALLER)
              gh workflow run hoffice-runtime-m11-empty-caller-static.yml \
                --ref codex/hoffice-runtime-from-scratch || true
              gh workflow run hoffice-runtime-m11-empty-caller-ghidra.yml \
                --ref codex/hoffice-runtime-from-scratch || true
              ;;
            *)
              ;;
          esac

      - name: Commit the orchestrated frontier
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/m11-orchestrator-*.json \
                  diagnostics/m11-orchestrator-latest.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'diagnostic: route the HOffice runtime M11 frontier'
          for attempt in $(seq 1 20); do
            if git push origin HEAD:codex/hoffice-runtime-from-scratch; then
              exit 0
            fi
            git fetch origin codex/hoffice-runtime-from-scratch
            git rebase origin/codex/hoffice-runtime-from-scratch
            sleep "$attempt"
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: hrt-m11-orchestrator-frontier
          path: |
            diagnostics/m11-orchestrator-*.json
            diagnostics/m11-orchestrator-latest.md
          if-no-files-found: error
          retention-days: 14
