name: Persist HWord M5 directory-stream diagnosis

on:
  workflow_run:
    workflows: [HOffice runtime M5 HWord deterministic directory stream]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: persist-hrt-m5-dirstream-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  persist-diagnosis:
    if: github.event.workflow_run.head_branch == 'codex/hoffice-runtime-from-scratch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/hoffice-runtime-from-scratch
          fetch-depth: 0

      - name: Download the completed run proof artifact
        uses: actions/download-artifact@v4
        with:
          name: hrt-m5-hword-dirstream-proof
          path: build/diagnosis
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate and persist the exact diagnosis
        run: |
          set -euxo pipefail
          test -s build/diagnosis/proof/summary.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path('build/diagnosis/proof/summary.json')
          summary = json.loads(source.read_text())
          assert summary['workflow_run'] == '${{ github.event.workflow_run.id }}'
          assert summary['commit'] == '${{ github.event.workflow_run.head_sha }}'
          summary['workflow_conclusion'] = '${{ github.event.workflow_run.conclusion }}'
          summary['persist_workflow_run'] = '${{ github.run_id }}'
          target = Path('diagnostics/m5-hword-dirstream-latest.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/m5-hword-dirstream-latest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'diagnostic: persist latest HWord directory-stream boundary [skip ci]'
          git pull --rebase origin codex/hoffice-runtime-from-scratch
          git push origin HEAD:codex/hoffice-runtime-from-scratch
